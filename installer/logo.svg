<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 群星回廊
       赫尔墨斯的双蛇杖长在一本摊开的书上，星作杖顶。

       为什么是双蛇杖：赫尔墨斯是翻译之神（hermeneutics 就出自他的名字），
       也是边界与通道的神——「回廊」正是他的地界。这个软件做的事
       （把外文书变成能读的东西、在语言之间来回）恰好是他的差事。

       画法上的取舍：favicon 只有 16 像素，所以
       - 去掉了旧版书页上那四条「文字线」，那个尺寸下只会糊成一团
       - 蛇只交叉两次，不做经典的四道缠绕，小尺寸下才看得出是编织不是噪点
       - 翅膀压扁拉宽，跟摊开的书页同一个走向，两个形状互相加强而不是打架

       图层顺序是有讲究的，别随手调：
       星 → 翅 → 杖身 → 双蛇 → 书（填底色，吃掉蛇尾）→ 书脊
       杖身在蛇之下，蛇才像是缠在杖上；书填底色，蛇尾才是「扎进书里」
       而不是在书页上戳出两个疙瘩；书脊最后画，才压得住书的填充。 -->
  <rect width="256" height="256" rx="52" fill="#1f1b16"/>

  <!-- 杖顶之星：既是群星，也是权杖顶端的球饰 -->
  <g fill="#e8c877">
    <path d="M128 34 L134.5 56 L157 62 L134.5 68 L128 90 L121.5 68 L99 62 L121.5 56 Z"/>
    <circle cx="58" cy="46" r="4"/>
    <circle cx="202" cy="38" r="5.5"/>
    <circle cx="220" cy="70" r="3"/>
    <circle cx="40" cy="76" r="2.8"/>
  </g>

  <!-- 翅膀：压扁拉宽，和下面摊开的书页同向 -->
  <g fill="#c89a4a">
    <path d="M123 92 C102 82 78 79 60 85 C76 95 102 100 123 99 Z"/>
    <path d="M133 92 C154 82 178 79 196 85 C180 95 154 100 133 99 Z"/>
  </g>

  <!-- 杖身：画在蛇之下 -->
  <path d="M128 88 L128 184" stroke="#f3e9d6" stroke-width="9" stroke-linecap="round"/>

  <!-- 双蛇：两条严格镜像的曲线（x' = 256 - x），只交叉两次 -->
  <g fill="none" stroke="#e8c877" stroke-width="7.5" stroke-linecap="round">
    <path d="M106 180 C106 158 152 152 152 130 C152 108 106 104 106 94"/>
    <path d="M150 180 C150 158 104 152 104 130 C104 108 150 104 150 94"/>
  </g>
  <g fill="#e8c877">
    <circle cx="106" cy="94" r="5.5"/>
    <circle cx="150" cy="94" r="5.5"/>
  </g>

  <!-- 摊开的书：填底色，把扎进来的蛇尾吃掉 -->
  <g fill="#1f1b16" stroke="#f3e9d6" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M128 176 C112 166 84 162 56 166 L56 208 C84 204 112 208 128 220 Z"/>
    <path d="M128 176 C144 166 172 162 200 166 L200 208 C172 204 144 208 128 220 Z"/>
  </g>
  <!-- 书脊：最后画，压住书的填充 -->
  <path d="M128 176 L128 220" stroke="#f3e9d6" stroke-width="9" stroke-linecap="round"/>
</svg>
