  async function syncNow() {
    try {
      await api("/api/collab/sync", { book: currentBook.name });
      refreshCollab(currentBook.name);
    } catch (e) { alert(e.message); }
  }

  // 打开着共享书时轮询：90 秒刷一次建议列表（后台 2 分钟自动同步一轮）
  setInterval(() => {
    if (currentBook && collabState && collabState.shared) refreshCollab(currentBook.name);
  }, 90000);

  // ------------------------------------------------------------------ 聊天
  // 两条**互不相干**的对话：
  //   读书模式右边那条 —— 只谈当前打开的这本书，记录存在书自己的目录里
  //   对话模式那条     —— 书架级的通用对话，跟具体哪本书无关
  // 原来是一条对话同时画进两个面板，所以「点开魔法书右边还是爱丽丝的话」，
  // 而且读书和对话看到的永远是同一串——两个模式等于白分。
  let midSeq = 0;

  function makeLane(host, scrollEl, rich) {
    // hiddenJobs：这条对话已经翻篇的作业卡。换一段对话就把当时跑完的那些收起来。
    // streaming / abort 记在 lane 上而不是全局：读书那边问一句，
    // 不该把对话那边的输入框一起锁上（服务端现在也是一条通道一把锁）。
    return { items: [], host, scroll: scrollEl, rich, scope: null, session: "",
             loaded: false, seq: 0, hiddenJobs: new Set(),
             streaming: false, abort: null, btn: null };
  }
  // 两条都渲染 markdown。读书栏原来是纯文本，但手机上 #chat 是隐藏的
  // （见 CSS 的窄屏分支），手机用户唯一能用的就是读书栏——
  // 于是他们看到的全是 **粗体** 这样的裸符号。
  const readLane = makeLane(msgs, msgs, true);          // 读书模式：跟着当前书走
  const chatLane = makeLane(chatBody, chatScroll, true); // 对话模式：恒为书架
  const laneOf = () => (view === "chat" ? chatLane : readLane);

  function paintEntry(lane, e) {
    let el = lane.host.querySelector(`[data-mid="${e.mid}"]`);
    if (!el) { el = document.createElement("div"); el.dataset.mid = e.mid; lane.host.appendChild(el); }
    el.className = "msg " + e.role + (lane.rich && e.html ? " md" : "");
    // html 是服务端 marked 渲染 + 清洗过的；没有就退回纯文本
    if (lane.rich && e.html) el.innerHTML = e.html;
    else el.textContent = e.text;
  }
  function scrollLane(lane) { lane.scroll.scrollTop = lane.scroll.scrollHeight; }

  function addMsg(lane, role, text, html) {
    const e = { mid: ++midSeq, role, text: text || "", html: html || "" };
    lane.items.push(e);
    paintEntry(lane, e);
    dockToEnd();          // 后台作业卡片永远贴在最下面
    scrollLane(lane);
    return e;
  }
  function dropMsg(lane, e) {
    const i = lane.items.indexOf(e);
    if (i >= 0) lane.items.splice(i, 1);
    const el = lane.host.querySelector(`[data-mid="${e.mid}"]`);
    if (el) el.remove();
  }
  // 一段回复收尾时才渲染 markdown：流式过程中每个 delta 都往服务端跑一趟不划算
  async function renderRich(lane, e) {
    if (!e || !e.text.trim()) return;
    try {
      const r = await api("/api/render", { md: e.text });
      if (r.html) { e.html = r.html; paintEntry(lane, e); scrollLane(lane); }
    } catch { }
  }

  // 开场白不自我介绍，直接说手该往哪放：小白看的第一句话就是操作说明。
  const GREETING = "把书的文件拖到这个框里（epub、pdf、txt、docx 都行），或者告诉我文件在哪，比如「桌面上有本 The Stranger.epub」。整理好了它会出现在左边书架上，想读哪章就说「翻第 3 章」。";

  function clearLane(lane) {
    lane.items.length = 0;
    for (const el of Array.from(lane.host.querySelectorAll("[data-mid]"))) el.remove();
    // 已经跑完的作业卡属于刚才那条对话，一起收走；还在跑的留着
    for (const j of jobList) if (!jobActive(j)) lane.hiddenJobs.add(j.id);
    renderJobs();
  }

  async function loadLane(lane, book) {
    const scope = book || null;
    lane.scope = scope;
    const token = ++lane.seq;         // 慢回来的旧请求不许再往新的对话里写
    clearLane(lane);
    let r = null;
    const q = scope ? "?book=" + encodeURIComponent(scope)
      : (lane.session ? "?session=" + encodeURIComponent(lane.session) : "");
    try { r = await fetch("/api/chat/history" + q).then(x => x.json()); } catch { }
    if (token !== lane.seq) return;
    const items = (r && r.items) || [];
    for (const it of items) addMsg(lane, it.role === "user" ? "user" : "bot", it.text, it.html);
    if (!items.length) {
      addMsg(lane, "bot", scope
        ? `这个框只聊《${scope}》：问情节、问某个词什么意思、让它翻某一章都行，比如「翻第 3 章」。`
        : GREETING);
    }
    if (r && r.noHistory) {
      addMsg(lane, "status", "历史在助手自己的会话里，这里只显示本次启动后的消息。");
    }
  }

  // 读书模式那条跟着书走
  const loadHistory = book => loadLane(readLane, book);

  // ---------------------------------------------------------------- 会话管理
  // 对话模式能像网页版聊天那样开好几段、各聊各的。读书模式不需要——
  // 那条永远绑在当前这本书上，一本书一段。
  let sessions = [], curSession = "";
  // 每段会话各存一份没发出去的草稿。
  // 原来所有会话共用 input2 这一个框：在 A 里敲了半句、切到 B，那半句跟着过去了，
  // 看着就像两段对话串了线。切换的时候存旧的、取新的，各写各的。
  const drafts = new Map();
  function stashDraft(id) { if (id !== undefined) drafts.set(id || "", input2.value); }
  function restoreDraft(id) { input2.value = drafts.get(id || "") || ""; }

  function renderSessions() {
    const host = $("sessionList");
    if (!sessions.length) {
      host.innerHTML = `<div class="sess-empty">还没有对话。点上面「新对话」开一段。</div>`;
      return;
    }
    host.innerHTML = sessions.map(s => {
      const on = s.id === curSession ? " on" : "";
      // id 也要转义：它是从磁盘读回来的，跟标题同一个信任等级。
      // 带个引号就能从属性里逃出去往页面注标签。
      const id = esc(s.id);
      return `<div class="sess${on}" data-sid="${id}">`
        + `<button class="name" data-open="${id}" title="${esc(s.title)}">${esc(s.title)}</button>`
        + `<button class="act" data-ren="${id}" title="改名">✎</button>`
        + `<button class="act" data-del="${id}" title="删掉">🗑</button></div>`;
    }).join("");
  }

  async function loadSessions(pick) {
    try { sessions = (await fetch("/api/chat/sessions").then(r => r.json())).sessions || []; }
    catch { sessions = []; }
    if (pick) curSession = pick;
    // 上次选的那段被删了，或者头一回进来，就落到最近用过的那段
    if (!sessions.some(s => s.id === curSession)) curSession = sessions.length ? sessions[0].id : "";
    renderSessions();
    return curSession;
  }

  async function newSession() {
    let r = null;
    try { r = await api("/api/chat/session/new", {}); } catch (e) { alert(e.message); return; }
    stashDraft(curSession);
    await loadSessions(r.id);
    restoreDraft(r.id);            // 新会话是空的，顺手把上一段的半句话清掉
    chatLane.session = r.id;
    await loadLane(chatLane, null);
  }

  $("newSession").addEventListener("click", newSession);

  $("sessions").addEventListener("click", async e => {
    const el = e.target.closest("[data-open],[data-ren],[data-del]");
    if (!el) return;
    if (el.dataset.open) {
      if (el.dataset.open === curSession) return;
      stashDraft(curSession);
      curSession = el.dataset.open;
      restoreDraft(curSession);
      chatLane.session = curSession;
      renderSessions();
      $("sessions").classList.remove("open");
      return loadLane(chatLane, null);
    }
    if (el.dataset.ren) {
      const cur = (sessions.find(s => s.id === el.dataset.ren) || {}).title || "";
      const title = prompt("给这段对话起个名字", cur);
      if (title === null) return;
      try { await api("/api/chat/session/rename", { id: el.dataset.ren, title }); }
      catch (err) { alert(err.message || "名字没改成，稍等一下再试一次。"); }
      return loadSessions();
    }
    if (el.dataset.del) {
      const s = sessions.find(x => x.id === el.dataset.del) || {};
      if (!confirm(`删掉「${s.title || "这段对话"}」？\n\n（会先挪进书库的「已删除」文件夹，不是立刻抹掉）`)) return;
      try { await api("/api/chat/session/delete", { id: el.dataset.del }); } catch (e) { alert(e.message); return; }
      await loadSessions();
      chatLane.session = curSession;
      return loadLane(chatLane, null);
    }
  });

  // 哪条通道用哪颗键。读书那栏是 sendBtn，对话那栏是 sendBtn2。
  readLane.btn = sendBtn;
  chatLane.btn = sendBtn2;

  // 助手在写的时候，那条通道的发送键变成「停下」而不是变灰。
  //
  // 为什么必须有出口：有用户碰上过一条请求挂在那儿转了四分钟不动，而按钮是灰的、
  // 回车也不响应——他没有任何办法，只能去关整个程序。服务端本来就认客户端断线
  //（res 一 close 就把大脑整棵进程树杀掉、把那条通道的锁放掉），差的只是这颗按钮。
  //
  // 按 lane 记：读书那边在写，不该把对话那边的键也变成「停下」。
  function setBusy(lane, on) {
    lane.streaming = on;
    if (lane.btn) {
      lane.btn.textContent = on ? "停下" : "发送";
      lane.btn.classList.toggle("stopping", on);
      lane.btn.disabled = false;          // 别再变灰：变灰就等于没有出口
    }
    // 剪贴板那颗是全局的，任意一条在跑就先按住
    $("clipBtn").disabled = readLane.streaming || chatLane.streaming;
  }

  function stopChat(lane) {
    if (!lane || !lane.abort) return;
    try { lane.abort.abort(); } catch { }
    lane.abort = null;
  }

  // fromButton：只有真去点那颗键才算「停下」。
  // 回车不能算——用户边等边把下一句敲好、顺手一个回车，
  // 结果把正在写的东西提前杀了，那比没有停止键还糟。
  function send(from, fromButton) {
    const lane = from === "main" ? chatLane : readLane;
    if (lane.streaming) { if (fromButton) stopChat(lane); return; }
    // 两个输入框分属两个模式，各发各的，不再互相清空
    const box = from === "main" ? input2 : input;
    const text = box.value.trim();
    const images = from === "main" ? pendingImages.slice() : [];
    if (!text && !images.length) return;
    box.value = "";
    if (images.length) clearPendingImages();
    return sendText(text, from === "main" ? chatLane : readLane, images);
  }

  async function sendText(text, lane, images) {
    lane = lane || laneOf();
    images = Array.isArray(images) ? images : [];
    if ((!text && !images.length) || lane.streaming) return;
    const shown = [text, ...images.map(x => `📷 ${x.name}`)].filter(Boolean).join("\n");
    addMsg(lane, "user", shown);
    setBusy(lane, true);

    let bot = null, statusEl = null;
    const ensureBot = () => bot || (bot = addMsg(lane, "bot", ""));
    const ac = new AbortController();
    lane.abort = ac;

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        signal: ac.signal,
        headers: { "Content-Type": "application/json" },
        // chapter 只在读书那条带上：对话模式是书架级的，没有"当前章节"这回事
        body: JSON.stringify({
          message: text,
          images: images.map(x => x.id),
          book: lane.scope || "",
          session: lane.scope ? "" : (lane.session || ""),
          chapter: (lane === readLane && lane.scope && currentFile)
            ? currentFile.split("/").pop().replace(/\.md$/, "") : "",
        }),
      });
      if (resp.status === 429) { addMsg(lane, "status", "助手还在忙上一件事，稍等再发。"); return; }
      if (!resp.ok || !resp.body) { addMsg(lane, "status", "连不上助手，检查「群星回廊」窗口还开着没。"); return; }

      const rd = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const evm = raw.match(/^event: (\S+)\ndata: (.*)$/s);
          if (!evm) continue;
          const [_, ev, dataStr] = evm;
          let data = {}; try { data = JSON.parse(dataStr); } catch { }
          if (ev === "delta") {
            if (statusEl) { dropMsg(lane, statusEl); statusEl = null; }
            const e = ensureBot();
            e.text += data.text;
            paintEntry(lane, e);
            scrollLane(lane);
          } else if (ev === "status") {
            if (!statusEl) statusEl = addMsg(lane, "status", "");
            statusEl.text = "⏳ " + data.text + "…";
            paintEntry(lane, statusEl);
          } else if (ev === "turn") {
            renderRich(lane, bot);       // 工具调用之后新起一个气泡，旧的先定稿
            bot = null;
          } else if (ev === "error") {
            addMsg(lane, "status", "⚠️ " + data.text);
          }
        }
      }
    } catch (e) {
      // 用户自己按的「停下」不是故障，别把它说成断线吓人一跳
      addMsg(lane, "status", e && e.name === "AbortError"
        ? "已经停下了。刚写到一半的内容没有保存。"
        : "这句话没发出去，跟「群星回廊」断了联系。看看电脑上的启动窗口还开着没有，然后把刚才那句再发一次。");
    } finally {
      lane.abort = null;
      if (statusEl) dropMsg(lane, statusEl);
      setBusy(lane, false);
      renderRich(lane, bot);
      // 没打开书的时候读书那条也是书架级的，跟对话那条同源——
      // 让另一条下次显示时重新拉一遍，不然两边各说各的
      if (lane === readLane && !lane.scope) chatLane.loaded = false;
      if (lane === chatLane && !readLane.scope && !chatLane.session) loadLane(readLane, null);
      // 会话标题是服务端拿第一句话生成的，发完刷一下列表才看得见
      if (lane === chatLane && lane.session) loadSessions(lane.session);
      loadShelf();                        // 助手可能新建/翻完了章节，刷新书架
      // 只有谈这本书的那条对话才可能改到书里的文件，刷新它
      if (lane === readLane && currentBook) openBook(currentBook.name, { keepChat: true }).catch(() => { });
    }
  }

  // ------------------------------------------------------------------ 后台作业
  // 入库要十几分钟，跑在后台，聊天区只留一张安静的卡片（读书侧栏和对话视图各
  // 一份，同一份状态）。用户在这期间照常聊天——服务端的作业进程跟聊天进程是
  // 两回事。中间过程不刷气泡：只说「在弄、还要多久、弄好了」。
  const jobDocks = new Map();          // host 元素 -> 它那份卡片容器
  let jobList = [];
  let jobTimer = null;
  let lastCourseNote = "";   // 侧栏「编成课程」上次画的进度，见 renderJobs

  // 「这是本什么书」那段是当成正常助手消息发的，服务端也写进了聊天记录——
  // 刷新页面后历史里会再出现一次，所以记下已经显示过的作业号，别重复。
  const jobInfoShown = (() => {
    try { return new Set(JSON.parse(localStorage.getItem("sfJobInfo") || "[]")); }
    catch { return new Set(); }
  })();

  function jobDock(host) {
    let d = jobDocks.get(host);
    if (!d) { d = document.createElement("div"); d.className = "job-dock"; jobDocks.set(host, d); }
    if (d.parentNode !== host) host.appendChild(d);
    return d;
  }
  function dockToEnd() {
    for (const host of [msgs, chatBody]) {
      const d = jobDocks.get(host);
      if (d && d.parentNode === host) host.appendChild(d);
    }
  }

  function jobCardHtml(icon, title, sub, acts) {
    const ic = icon === "spin" ? `<div class="jicon spin"></div>`
      : `<div class="jicon${icon === "✓" ? " ok" : ""}">${icon}</div>`;
    return `<div class="job-card">${ic}<div class="jmain"><div class="jt">${title}</div>` +
      (sub ? `<div class="js">${sub}</div>` : "") +
      (acts ? `<div class="ja">${acts}</div>` : "") + `</div></div>`;
  }

  function jobCard(j) {
    const name = esc(j.title || "这本书");
    const id = esc(j.id);
    const dismiss = `<button data-job="dismiss" data-id="${id}">知道了</button>`;
    // 「停下」只在还没结束的卡上给。扫描件认字要跑几分钟，没有这个按钮的话
    // 用户只能干等，或者去关那个黑窗口——后者会把整个软件一起带走。
    const stop = j.cancelling
      ? `<button disabled>正在停…</button>`
      : `<button data-job="cancel" data-id="${id}">停下</button>`;
    // 编成课程：主进度在「编成课程」那一页，这张卡让人在对话里也看得见它在跑
    if (j.kind === "course") {
      const p = j.progress || {};
      const go = `<button class="primary" data-job="open" data-id="${id}">去看看</button>`;
      const what = j.scope ? `《${name}》第 ${esc(j.scope.join("、"))} 章的试编课程` : `《${name}》的课程`;
      if (j.state === "queued") return jobCardHtml("spin", `${what}排着队`, "", stop);
      if (j.state === "running") return jobCardHtml("spin", `正在编${what}`,
        j.cancelling ? "正在停下…" : `${p.pct || 0}% · 第 ${(p.step || 0) + 1}/7 步：${esc(p.stepName || "")}`, go + stop);
      if (j.state === "done") return jobCardHtml("✓", `${what}编好了`, `${j.units} 个单元、${j.lessons} 课，${j.cards} 张知识卡`, go + dismiss);
      return jobCardHtml("⚠️", `${what}没编完`, esc(j.error || "中途出岔子了。"),
        `<button class="primary" data-job="open" data-id="${id}">接着编…</button>${dismiss}`);
    }
    // 章首翻译：主进度条在那一章的章首，这张卡只是让人在对话里也看得见它在跑
    if (j.kind === "translate") {
      const where = `《${name}》第 ${esc(j.chapter)} 章`;
      const p = j.progress || {};
      const pct = p.totalChars ? Math.floor(p.doneChars * 100 / p.totalChars) : 0;
      const go = `<button class="primary" data-job="open" data-id="${id}">去看看</button>`;
      if (j.state === "queued") return jobCardHtml("spin", `${where}排着队`, "", stop);
      if (j.state === "running") return jobCardHtml("spin", `正在翻译${where}`, p.total ? `${pct}%` : "正在准备…", stop);
      if (j.state === "done") return jobCardHtml("✓", `${where}翻好了`, "", go + dismiss);
      return jobCardHtml("⚠️", `${where}没翻成`, esc(j.error || "中途出岔子了。"),
        `<button class="primary" data-job="retry" data-id="${id}">再试一次</button>${dismiss}`);
    }
    if (j.state === "queued") {
      return jobCardHtml("spin", `《${name}》排着队`,
        j.ahead ? `前面还有 ${j.ahead} 本，弄完就轮到它` : "马上开始", stop);
    }
    if (j.state === "running") {
      // 章一切好书就能读了，摘要在后台慢慢补——没必要为了后半程让人干等
      if (j.readable && j.book) {
        const bits = [`一共 ${j.chapters} 章 · 摘要还在写`];
        if (j.stage) bits.push(esc(j.stage));
        return jobCardHtml("spin", `《${name}》已经可以开始读了`, bits.join(" · "),
          `<button class="primary" data-job="open" data-id="${id}">去看看</button>${stop}`);
      }
      const mins = j.startedAt ? Math.floor((Date.now() - j.startedAt) / 60000) : 0;
      const bits = [`预计 ${j.etaMin} 分钟`];
      if (mins >= 1) bits.push(`已 ${mins} 分钟`);
      if (j.stage) bits.push(esc(j.stage));
      return jobCardHtml("spin", `正在整理《${name}》`, bits.join(" · "), stop);
    }
    if (j.state === "done") {
      return jobCardHtml("✓", `《${name}》整理好了`,
        `一共 ${j.chapters} 章，梗概和摘要都写好了`,
        `<button class="primary" data-job="open" data-id="${id}">去看看</button>${dismiss}`);
    }
    return jobCardHtml("⚠️", `《${name}》没整理成`, esc(j.error || "中途出岔子了，点「再试一次」重来一遍。"),
      `<button class="primary" data-job="retry" data-id="${id}">再试一次</button>${dismiss}`);
  }

  // 作业卡以前是「一份画进两个面板」，对话拆成两条之后没跟着拆，
  // 于是「新对话」清掉了消息、卡片还挂在那儿（用户截图反馈）。
  //
  // 分清两种卡：**还在跑**的是全局状态，哪条对话都该看得见；
  // **已经跑完**的是一次事件通知，只属于当时那条对话，换一条就不该再出现。
  function renderJobs() {
    for (const lane of [readLane, chatLane]) {
      const mine = jobList.filter(j => jobActive(j) || !lane.hiddenJobs.has(j.id));
      const html = mine.map(jobCard).join("");
      const d = jobDock(lane.host);
      d.innerHTML = html;
      d.style.display = html ? "flex" : "none";
      lane.host.appendChild(d);            // 永远排在消息流最后
    }
    refreshChapterHead();
    refreshCourseMake();
    // 侧栏「编成课程」那一格带着进度百分比。只在字变了时重画侧栏：
    // 轮询一秒半一次，每次都重画的话，正在侧栏搜索框里打字的人会被抢走光标
    const cj = courseJob();
    const note = cj ? `${cj.id}|${cj.state}|${(cj.progress && cj.progress.pct) || 0}` : "";
    if (note !== lastCourseNote) { lastCourseNote = note; if (currentBook) renderBookMenu(); }
  }

  function showJobInfo(j) {
    if (!j.summary || jobInfoShown.has(j.id)) return;
    jobInfoShown.add(j.id);
    try { localStorage.setItem("sfJobInfo", JSON.stringify([...jobInfoShown].slice(-50))); } catch { }
    // 传书是在书架上做的，这条「这是本什么书」就归书架级那条对话
    renderRich(chatLane, addMsg(chatLane, "bot", j.summary));
  }

  const jobActive = j => j.state === "running" || j.state === "queued";

  function scheduleJobPoll(ms) {
    clearTimeout(jobTimer);
    jobTimer = setTimeout(pollJobs, ms);
  }

  async function pollJobs() {
    let r = null;
    try { r = await fetch("/api/jobs").then(x => x.json()); } catch { }
    if (!r) { scheduleJobPoll(20000); return; }
    const wasActive = jobList.some(jobActive);
    const wasReadable = new Set(jobList.filter(j => j.readable).map(j => j.id));
    const wasTr = new Set(jobList.filter(j => j.kind === "translate" && jobActive(j)).map(j => j.id));
    jobList = r.jobs || [];
    for (const j of jobList) showJobInfo(j);
    renderJobs();
    // 刚切完章的书这会儿才出现在书架上，不刷一下「去看看」会点进空列表
    if (jobList.some(j => j.readable && !wasReadable.has(j.id))) loadShelf();
    const active = jobList.some(jobActive);
    // 一章刚翻完：目录里多了一篇译文，开着的这一页也该换上（双列 / 只看译文）
    const trDone = jobList.some(j => wasTr.has(j.id) && j.state === "done");
    if ((wasActive && !active) || trDone) {  // 刚有作业做完，书架上多了一本 / 多了一章译文
      loadShelf();
      // 刷完这本书再刷「编成课程」那一页：课程刚编好时，侧栏和那一页都要换成「编好了」
      if (currentBook) openBook(currentBook.name, { keepChat: true }).then(refreshCourseMake).catch(() => { });
    }
    // 翻一章只要几十秒，四秒一刷进度条是一格一格跳的；有翻译在跑就刷勤一点
    const trActive = jobList.some(j => (j.kind === "translate" || j.kind === "course") && jobActive(j));
    scheduleJobPoll(trActive ? 1500 : active ? 4000 : 20000);
  }

  for (const host of [msgs, chatBody]) {
    host.addEventListener("click", async e => {
      const el = e.target.closest("[data-job]");
      if (!el) return;
      const id = el.dataset.id;
      const j = jobList.find(x => x.id === id);
      if (!j) return;
      if (el.dataset.job === "open") {
        if (!j.book) return;
        setView("read");
        await loadShelf();
        if (j.kind === "course") {
          // 编着的、没编完的到「编成课程」那一页（进度、接着编都在那儿）；编好的直接看课程
          if (!currentBook || currentBook.name !== j.book) await openBook(j.book);
          if (j.state === "failed") return openCourseMake().then(() => courseEstimate(j.scope ? j.scope.join(",") : "all"));
          return openCourse();
        }
        if (j.kind === "translate") {
          // 直接翻到那一章（按当前显示方式：单栏打开译文，双列就是双列）
          if (!currentBook || currentBook.name !== j.book) await openBook(j.book);
          const f = currentBook && currentBook.translated.find(x => chNo(x) === String(j.chapter));
          if (f) openFile(`Library/${j.book}/译文/${f}`);
          return;
        }
        openBook(j.book);
        return;
      }
      el.disabled = true;
      try {
        if (el.dataset.job === "dismiss") await api("/api/job/dismiss", { id });
        else if (el.dataset.job === "cancel") await api("/api/job/cancel", { id });
        // 翻译失败的重来：失败时译文一个字都没动，有旧译文就得带 force 才能盖
        else if (j.kind === "translate") await api("/api/job", { kind: "translate", book: j.book, chapter: j.chapter, force: true });
        // 重试要把语言一起带上，不然选过的语言在「再试一次」这里悄悄丢掉
        else await api("/api/job", { kind: "ingest", file: j.file, lang: j.lang || "" });
      } catch (err) { toast(err.message); }
      pollJobs();
    });
  }

  async function startIngest(file, lang) {
    try { await api("/api/job", { kind: "ingest", file, lang: lang || "" }); }
    catch (e) { toast(`《${file}》传好了，但没能开始整理：${e.message}　你可以跟助手说一句「帮我整理入库」。`); }
    pollJobs();
  }

  // ------------------------------------------------------------------ 传书
  // 手机用户打不开电脑上的「文档\书房」文件夹，网页上传是他们唯一的路。
  // 传完自动起一个后台整理作业，聊天不受影响。
  const fileInput = $("fileInput");
  const OK_EXT = ["epub", "txt", "docx", "pdf", "md"];
  const IMAGE_EXT = ["png", "jpg", "jpeg", "webp", "gif"];
  const MAX_MB = 200;
  let pendingImages = [];

  function pickFile() { fileInput.value = ""; fileInput.click(); }

  fileInput.addEventListener("change", () => {
    const files = [...(fileInput.files || [])];
    for (const f of files) {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      if (IMAGE_EXT.includes(ext) || String(f.type || "").startsWith("image/")) uploadChatImage(f);
      else { uploadBook(f); break; }
    }
  });

  function renderPendingImages() {
    const tray = $("imageTray");
    tray.classList.toggle("on", pendingImages.length > 0);
    tray.innerHTML = pendingImages.map((x, i) => `<span class="chat-image" title="${esc(x.name)}"><img src="${x.url}" alt=""><button data-rm-image="${i}" title="移除">×</button></span>`).join("");
  }

  function clearPendingImages() {
    for (const x of pendingImages) URL.revokeObjectURL(x.url);
    pendingImages = [];
    renderPendingImages();
  }

  async function uploadChatImage(file) {
    if (file.size > 20 * 1024 * 1024) return toast("这张图片超过 20MB，压小一点再传。");
    if (pendingImages.length >= 4) return toast("一条消息最多附 4 张图片。");
    const fd = new FormData();
    fd.append("file", file, file.name || "image.png");
    try {
      const resp = await fetch("/api/chat/image", { method: "POST", body: fd });
      const r = await resp.json();
      if (!resp.ok || !r.ok) throw new Error(r.hint || "图片没传上去。");
      pendingImages.push({ id: r.id, name: r.name || file.name || "图片", url: URL.createObjectURL(file) });
      renderPendingImages();
      input2.focus();
    } catch (e) { toast(e.message || "图片没传上去，请再试一次。"); }
  }

  $("imageTray").addEventListener("click", e => {
    const b = e.target.closest("[data-rm-image]");
    if (!b) return;
    const i = Number(b.dataset.rmImage);
    if (pendingImages[i]) URL.revokeObjectURL(pendingImages[i].url);
    pendingImages.splice(i, 1);
    renderPendingImages();
  });

  input2.addEventListener("paste", e => {
    const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => String(f.type || "").startsWith("image/"));
    if (!files.length) return;
    e.preventDefault();
    files.forEach(uploadChatImage);
  });
  input2.addEventListener("dragover", e => e.preventDefault());
  input2.addEventListener("drop", e => {
    const files = [...(e.dataTransfer && e.dataTransfer.files || [])];
    const pictures = files.filter(f => String(f.type || "").startsWith("image/"));
    if (!pictures.length) return;
    e.preventDefault();
    pictures.forEach(uploadChatImage);
  });

  function uploadBook(file) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (!OK_EXT.includes(ext)) {
      return toast("只能传 " + OK_EXT.join("、") + " 这几种文件。别的格式先在电脑上转一下。");
    }
    if (file.size > MAX_MB * 1024 * 1024) {
      return toast(`这个文件 ${(file.size / 1024 / 1024).toFixed(0)}MB，超过 ${MAX_MB}MB 传不了。`);
    }

    // 语言这一问只对**扫描版外文书**有意义：认字的时候要换识别模型，
    // 不然法语的 é ü、俄语的西里尔字母会被内置的中文模型抹平或认成拉丁字母。
    // 有文字层的 PDF、epub、txt 根本不走认字那条路，选了也不起作用。
    //
    // 为什么放在上传进度这一屏，而不是上传前弹一句问：
    // 上传前问 = 每个传中文书的人都要多点一次，而九成以上的书是中英文。
    // 放在进度里就是零点击——默认值就是今天的行为。而**扫描件必然很大**
    // （一页一张图，几十上百 MB），上传本来就要好几秒到几分钟，
    // 真正需要选的人有的是时间选；小文件一闪而过的那些，本来也用不上。
    const remembered = (() => { try { return localStorage.getItem("shufang.bookLang") || ""; } catch { return ""; } })();
    const LANG_OPTS = [
      ["", "中文 / 英文（默认）"], ["fr", "法语"], ["de", "德语"], ["es", "西班牙语"],
      ["it", "意大利语"], ["pt", "葡萄牙语"], ["la", "拉丁语"], ["ru", "俄语"], ["ja", "日语"],
    ];
    const m = modal(`
      <h3>正在上传《${esc(file.name)}》</h3>
      <div class="up-lang">
        <span>这本书是什么语言的</span>
        <select id="mLang">${LANG_OPTS.map(([v, t]) =>
      `<option value="${v}"${v === remembered ? " selected" : ""}>${t}</option>`).join("")}</select>
      </div>
      <div class="prog"><i id="mBar"></i></div>
      <p class="hint" id="mPct">0%　·　别关这个页面</p>`);
    const bar = m.querySelector("#mBar"), pct = m.querySelector("#mPct");
    const langSel = m.querySelector("#mLang");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.upload.addEventListener("progress", e => {
      if (!e.lengthComputable) return;
      const p = Math.round(e.loaded / e.total * 100);
      bar.style.width = p + "%";
      pct.textContent = p + "%　·　" + (p >= 100 ? "正在保存…" : "别关这个页面");
    });
    xhr.addEventListener("load", () => {
      let j = {};
      try { j = JSON.parse(xhr.responseText); } catch { }
      // 必须在 closeModal 之前读：关掉之后 langSel 就从 DOM 里没了，value 也拿不到
      const lang = langSel ? langSel.value : "";
      try { localStorage.setItem("shufang.bookLang", lang); } catch { }   // 一架子外文书的人不用每本都选
      closeModal();
      if (xhr.status === 200 && j.ok) {
        loadShelf();
        setView("chat");
        startIngest(j.name, lang);     // 后台整理，不占聊天
      } else {
        toast(j.hint || humanize(j.error) || "这本书没传上去，再选一次文件试试。");
      }
    });
    xhr.addEventListener("error", () => { closeModal(); toast("传到一半断了，这本书没传上去。看看网络（手机的话要跟电脑在同一个 Wi-Fi 下），然后重新传一次。"); });
    xhr.addEventListener("abort", () => closeModal());

    const fd = new FormData();
    fd.append("file", file, file.name);
    xhr.send(fd);
  }

  $("clipBtn").addEventListener("click", pickFile);

  sendBtn.addEventListener("click", () => send("side", true));
  sendBtn2.addEventListener("click", () => send("main", true));
  const enterToSend = (from) => e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(from); }
  };
  input.addEventListener("keydown", enterToSend("side"));
  input2.addEventListener("keydown", enterToSend("main"));

  // ------------------------------------------------------------------ 创意工坊
  let shopState = null;

  const shopSignature = st => !st || !st.configured ? ""
    : (st.plugins || []).map(p => p.dir + "@" + p.meta.version).sort().join(",");

  function updateShopDot(markSeen) {
    const sig = shopSignature(shopState);
    if (markSeen && sig) { try { localStorage.setItem("sfShopSeen", sig); } catch { } }
    let seen = "";
    try { seen = localStorage.getItem("sfShopSeen") || ""; } catch { }
    $("tabShop").classList.toggle("has-new", !!sig && sig !== seen);
  }

  async function loadShop(markSeen) {
    try { shopState = await fetch("/api/workshop/state").then(r => r.json()); } catch { shopState = null; }
    if (shopState && shopState.author) knownAuthor = shopState.author;
    renderShop();
    updateShopDot(markSeen);
  }

  function renderShop() {
    const st = shopState;
    if (!st) { wkBody.innerHTML = `<div class="wk-empty">读不到工坊状态，刷新一下页面。</div>`; return; }

    if (!st.configured) {
      wkBody.innerHTML = `
        <h2>创意工坊</h2>
        <p class="lead">把你调教好的本事（技能）打包成插件，跟朋友互相安装。<br/>
        工坊是一个你们几个人共用的私密仓库——谁发布，大家就都能装上。</p>
        ${st.engine ? "" : `<p class="lead">⚠️ 协作组件还没装上，重启一次「群星回廊」再来。</p>`}
        <div class="wk-entries">
          <button class="wk-entry" id="wkCreate"><b>🏗 创建工坊</b><span>你来当发起人：建一个私密仓库，把邀请串发给朋友</span></button>
          <button class="wk-entry" id="wkJoin"><b>📥 加入工坊</b><span>朋友已经建好了：把 SFW1: 开头的邀请串粘进来</span></button>
        </div>`;
      return;
    }

    const dot = st.syncState ? st.syncState.dot : "gray";
    const plugins = st.plugins || [];
    const cards = plugins.map(p => {
      const m = p.meta;
      const canUpdate = p.installed && m.version > (p.installedVersion || 0);
      const acts = [];
      if (canUpdate) acts.push(`<button class="primary" data-act="install" data-dir="${encodeURIComponent(p.dir)}">更新到 v${m.version}</button>`);
      else if (p.installed) acts.push(`<button class="on" data-act="uninstall" data-dir="${encodeURIComponent(p.dir)}">已装 ✓</button>`);
      else acts.push(`<button class="primary" data-act="install" data-dir="${encodeURIComponent(p.dir)}">安装</button>`);
      if (st.role === "owner") acts.push(`<button class="danger" data-act="remove" data-dir="${encodeURIComponent(p.dir)}">下架</button>`);
      return `<div class="wk-card">
        <div class="wk-name">${esc(m.name)}<span class="wk-ver">v${m.version}</span></div>
        <div class="wk-by">${esc(m.author)}${m.updated ? " · " + esc(m.updated) : ""}${p.installed ? ` · 已装 v${p.installedVersion}` : ""}</div>
        <div class="wk-desc">${esc(m.desc || "（没写简介）")}</div>
        <div class="wk-act">${acts.join("")}</div>
      </div>`;
    }).join("");

    // 档次：个人 10 位 / 社群位子数单谈 / 官方不限。只显示不给改——
    // 升档是站长在他那边的管理台里做的事，界面上摆个按钮只会让人白点。
    const t = st.tier;
    const tierTag = t && t.name
      ? `<span class="wk-tier${t.tier === "official" ? " official" : ""}">${esc(t.name)}工坊${
          t.limit ? ` · ${t.used || "?"}/${t.limit} 人` : " · 不限人数"}</span>`
      : "";

    // 自己投出去的稿子。投稿人不碰 GitHub，这块是他唯一能看到结果的地方——
    // 没有它，投完就只剩干等，不知道是还没审还是被退了。
    const subs = (st.subs || []).slice(0, 6);
    const subLine = s => {
      if (s.status === "approved") return `<span class="wk-sub ok">《${esc(s.name)}》已收录</span>`;
      if (s.status === "rejected") return `<span class="wk-sub no">《${esc(s.name)}》被退回：${esc(s.reason || "没写理由")}</span>`;
      return `<span class="wk-sub">《${esc(s.name)}》等站长过目</span>`;
    };

    wkBody.innerHTML = `
      <div class="wk-bar">
        <span class="title"><span class="sync-dot ${dot}"></span>创意工坊 · ${plugins.length} 个插件</span>
        ${tierTag}
        <span class="spacer"></span>
        <button class="primary" id="wkPublish">${st.readonly ? "投稿到工坊" : "发布我的插件"}</button>
        ${st.role === "owner" ? `<button id="wkInvite">邀请朋友</button>` : ""}
        <button id="wkSync">立即同步</button>
      </div>
      ${subs.length ? `<div class="wk-subs">${subs.map(subLine).join("")}</div>` : ""}
      ${plugins.length ? `<div class="wk-grid">${cards}</div>`
        : `<div class="wk-empty">工坊里还没有插件。<br/>点右上角「${st.readonly ? "投稿到工坊" : "发布我的插件"}」放第一个进来。</div>`}`;
  }

  wkBody.addEventListener("click", async e => {
    const el = e.target.closest("[data-act],#wkCreate,#wkJoin,#wkPublish,#wkInvite,#wkSync");
    if (!el) return;
    if (el.id === "wkCreate") return createWorkshopWizard();
    if (el.id === "wkJoin") return joinWorkshopWizard();
    if (el.id === "wkPublish") return publishWizard();
    if (el.id === "wkInvite") return showWorkshopInvite();
    if (el.id === "wkSync") {
      el.disabled = true; el.textContent = "同步中…";
      try { await api("/api/workshop/sync", {}); } catch (err) { alert(err.message); }
      await loadShop(true);
      return;
    }
    const dir = decodeURIComponent(el.dataset.dir || "");
    const act = el.dataset.act;
    if (act === "remove" && !confirm("从工坊里下架这个插件？已经装到别人电脑上的那份不会被删。")) return;
    if (act === "uninstall" && !confirm("卸载这个插件？")) return;
    el.disabled = true;
    try {
      await api("/api/workshop/" + act, { dir });
      await loadShop(true);
      if (act === "install") toast("装好了。下次跟助手说话就能用上。");
    } catch (err) {
      alert(err.message);
      await loadShop(false);
    }
  });

  function toast(text) {
    const m = modal(`<p>${esc(text)}</p><div class="row"><button class="primary" id="mClose">知道了</button></div>`);
    m.querySelector("#mClose").addEventListener("click", closeModal);
  }

  async function createWorkshopWizard() {
    if (!(await needAuthor())) return;
    const suggested = "shufang-workshop-" + Date.now().toString(36).slice(-4);
    const m = modal(`
      <h3>创建创意工坊</h3>
      <div class="steps">
        <p>去 GitHub 建一个<strong>私有</strong>仓库当工坊（朋友不用注册账号，只有你需要）。<br/>
        <button class="plain" id="mOpenNew" style="margin-top:.3rem">打开 github.com/new</button><br/>
        <span class="hint">仓库名随意（比如 ${esc(suggested)}），Private 必选，「Add a README」等选项全都<strong>不要勾</strong>，点 Create。</span></p>
        <p>把仓库网址粘到这里：<input id="mRepo" placeholder="https://github.com/你的用户名/仓库名" /></p>
        <p>再创建一把只开这一个仓库的钥匙（token）：<br/>
        <button class="plain" id="mOpenPat" style="margin-top:.3rem">打开 token 创建页</button><br/>
        <span class="hint">Repository access 选 Only select repositories → 挑刚建的仓；Permissions 里把 <strong>Contents</strong> 设为 Read and write；有效期选最长的。</span><br/>
        <input id="mToken" placeholder="github_pat_..." style="margin-top:.3rem" /></p>
      </div>
      <div class="row"><button class="plain" id="mCancel">算了</button><button class="primary" id="mOk">建好了，开工</button></div>`);
    m.querySelector("#mOpenNew").addEventListener("click", () => window.open("https://github.com/new?visibility=private&name=" + suggested, "_blank"));
    m.querySelector("#mOpenPat").addEventListener("click", () => window.open("https://github.com/settings/personal-access-tokens/new", "_blank"));
    m.querySelector("#mCancel").addEventListener("click", closeModal);
    m.querySelector("#mOk").addEventListener("click", async () => {
      const repoUrl = m.querySelector("#mRepo").value.trim();
      const token = m.querySelector("#mToken").value.trim();
      if (!repoUrl || !token) { alert("仓库网址和钥匙都要填。"); return; }
      const okBtn = m.querySelector("#mOk");
      okBtn.disabled = true; okBtn.textContent = "建立中…";
      try {
        const r = await api("/api/workshop/create", { repoUrl, token });
        closeModal();
        await loadShop(true);
        showInviteString(r.invite, null, "加入工坊");
      } catch (err) {
        okBtn.disabled = false; okBtn.textContent = "建好了，开工";
        alert(err.message);
      }
    });
  }

  async function joinWorkshopWizard() {
    if (!(await needAuthor())) return;
    const m = modal(`
      <h3>加入工坊</h3>
      <p>把对方发来的工坊邀请串（<strong>SFW1:</strong> 开头的一整串）粘到这里：</p>
      <textarea id="mInvite" rows="4" placeholder="SFW1:..."></textarea>
      <div class="row"><button class="plain" id="mCancel">算了</button><button class="primary" id="mOk">加入</button></div>`);
    m.querySelector("#mCancel").addEventListener("click", closeModal);
    m.querySelector("#mOk").addEventListener("click", async () => {
      const invite = m.querySelector("#mInvite").value.trim();
      if (!invite) return;
      const okBtn = m.querySelector("#mOk");
      okBtn.disabled = true; okBtn.textContent = "下载中…";
      try {
        await api("/api/workshop/join", { invite });
        closeModal();
        await loadShop(true);
      } catch (err) {
        okBtn.disabled = false; okBtn.textContent = "加入";

  async function showWorkshopInvite() {
    try {
      const r = await fetch("/api/workshop/invite").then(r => r.json());
      if (r.invite) showInviteString(r.invite, null, "加入工坊");
    } catch (e) { toast(e.message || "邀请码现在拿不到。看看网络通不通，过一会儿再点一次。"); }
  }

  async function publishWizard() {
    if (!(await needAuthor())) return;
    // 能发两类东西：技能（.claude/skills 下的目录）和体系表（译名表/体系-*.md）。
    // 两类都没有的时候把两条路都说清楚——只说技能的话，
    // 手上正好攒了一张体系表的人会以为工坊跟他没关系。
    const skills = (shopState && shopState.localSkills) || [];
    const systems = (shopState && shopState.localSystems) || [];
    if (!skills.length && !systems.length) {
      toast("本机还没有可发的东西。技能放在书库的 .claude/skills 文件夹里（一个文件夹一个技能，里面要有 SKILL.md）；体系表放在书库的「译名表」文件夹里，文件名以「体系-」开头。");
      return;
    }
    // 走审核的工坊（社群/官方）成员拿的是只读钥匙，推不动仓库，这条路是投稿。
    // 措辞得跟着换：说「发布」而实际要等人审，用户会以为没成功。
    const ro = !!(shopState && shopState.readonly);
    const kinds = [
      skills.length ? { k: "skill", label: "技能", tip: "一套调教好的本事，装上之后助手就会了" } : null,
      systems.length ? { k: "terms", label: "体系表", tip: "一个领域的通行译法，装上之后所有书都能引用" } : null,
    ].filter(Boolean);
    const m = modal(`
      <h3>${ro ? "投稿到工坊" : "发布我的插件"}</h3>
      <p>${ro
        ? "挑一样本机的东西交上去。这个工坊要过目才收，站长通过之后大家同步就能装。"
        : "挑一样本机的东西发到工坊，朋友就能装上。同名再发一次就是升版本。"}</p>
      ${kinds.length > 1 ? `<label>发什么</label>
      <select id="mKind">${kinds.map(k => `<option value="${k.k}">${k.label}</option>`).join("")}</select>` : ""}
      <label id="mPickLabel">选一个</label>
      <select id="mPick"></select>
      <label>给它起个好懂的名字</label>
      <input id="mName" maxlength="60" placeholder="比如：诗歌翻译腔调" />
      <label>一句话说明它能干嘛</label>
      <textarea id="mDesc" rows="3" maxlength="300" placeholder="比如：翻诗的时候保留押韵和断行，不出大白话。"></textarea>
      <div class="row"><button class="plain" id="mCancel">算了</button><button class="primary" id="mOk">${ro ? "投稿" : "发布"}</button></div>`);

    const kindBox = m.querySelector("#mKind");
    const pickBox = m.querySelector("#mPick");
    const nameBox = m.querySelector("#mName");
    const curKind = () => (kindBox ? kindBox.value : kinds[0].k);
    // 换类型要连带换掉候选列表和标题，不然选着「体系表」下面列的还是技能，
    // 发出去的东西跟用户以为的不是一个
    const fillPick = () => {
      const list = curKind() === "terms" ? systems : skills;
      pickBox.innerHTML = list.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      m.querySelector("#mPickLabel").textContent = curKind() === "terms" ? "选一张体系表" : "选一个技能";
      nameBox.value = pickBox.value || "";
    };
    fillPick();
    if (kindBox) kindBox.addEventListener("change", fillPick);
    pickBox.addEventListener("change", () => { nameBox.value = pickBox.value; });
    m.querySelector("#mCancel").addEventListener("click", closeModal);
    m.querySelector("#mOk").addEventListener("click", async () => {
      const okBtn = m.querySelector("#mOk");
      okBtn.disabled = true; okBtn.textContent = ro ? "投稿中…" : "上传中…";
      try {
        const kind = curKind();
        const r = await api("/api/workshop/publish", {
          kind,
          skillName: kind === "skill" ? pickBox.value : "",
          systemName: kind === "terms" ? pickBox.value : "",
          name: nameBox.value.trim(),
          desc: m.querySelector("#mDesc").value.trim(),
        });
        closeModal();
        await loadShop(true);
        toast(r.submitted
          ? `《${r.meta.name}》投上去了，等站长过目。通过之后大家同步就能看到。`
          : `《${r.meta.name}》已经发到工坊（v${r.meta.version}）。朋友那边同步后就能看到。`);
      } catch (err) {
        okBtn.disabled = false; okBtn.textContent = ro ? "投稿" : "发布";
        alert(err.message);
      }
    });
  }

  // 工坊有新东西时给顶栏点个小圆点（后台每 2 分钟自己同步一轮）
  setInterval(() => { if (view !== "workshop") loadShop(false); }, 120000);

  // ------------------------------------------------------------------ 术语表
  //
  // 左边一览右边一条。列表一行只放最要紧的四样，扫得动；禁用译名、来源、
  // 全书实例都在右边，点开才看得见——专业译者要的深度和朋友要的清爽，
  // 全靠这条分界线兼顾，别把两拨人的需求摊在同一屏上。
  //
  // 右边那块「全书实例」是这个页面的重点：一个词在全书出现的每一处，
  // 原文译文上下摆着，走样的当场改。别的 CAT 工具管这个叫 concordance，
  // 没有它，译名表就只是一张 Excel。
  const tm = {
    book: "", entries: [], scan: {}, sel: "", filter: "all", q: "",
    occ: null, badOnly: false, adding: false, loading: false,
  };

  const tmEntry = key => tm.entries.find(e => e.key === key) || null;
  const tmStat = key => tm.scan[key] || { count: 0, checked: 0, bad: 0, missing: 0, variants: {} };
  const tmWritable = e => (e && String(e.layer || "").startsWith("体系")) ? "单本" : (e ? e.layer : "单本");

  async function loadTerms(force) {
    const want = tm.book || (currentBook && currentBook.name) || "";
    if (!force && tm.entries.length && tm.book === want) return;
    tm.book = want;
    await fillTmBooks();
    if (!tm.book) {
      $("tmList").innerHTML = '<div class="tm-empty">先在书架上选一本书。</div>';
      $("tmDetail").innerHTML = "";
      return;
    }
    $("tmList").innerHTML = '<div class="tm-empty">读表中…</div>';
    const r = await fetch("/api/terms?book=" + encodeURIComponent(tm.book))
      .then(r => r.json()).catch(() => ({ entries: [] }));
    tm.entries = r.entries || [];
    tm.groups = r.groups || [];
    tm.systems = r.systems || { installed: [], on: [] };
    tm.scan = {};
    renderTmSystemsBtn();
    renderTmList();
    renderTmDetail();
    // 全书扫描要逐章对齐，慢，所以后补：表先出来，次数和冲突随后填进去。
    tm.loading = true;
    fetch("/api/terms/scan?book=" + encodeURIComponent(tm.book))
      .then(r => r.json()).catch(() => ({ scan: [] }))
      .then(s => {
        tm.loading = false;
        for (const x of (s.scan || [])) tm.scan[x.key] = x;
        renderTmList();
        if (tm.sel) renderTmDetail();
      });
  }

  // ---- 体系：这本书按哪几个领域的通行译法来 ----
  // 三层表里最容易被忘掉的一层。装了体系表但没给这本书打开，那一层就是空的，
  // 用户只会觉得「装了没用」——所以要有个看得见的开关，而不是让他去手改表头。
  //
  // 开关写回 glossary.md 表头那一行 `> 体系：…`，跟读的时候同一个地方。
  function renderTmSystemsBtn() {
    const b = $("tmSystems");
    if (!b) return;
    const s = tm.systems || { installed: [], on: [] };
    const on = (s.on || []).filter(x => (s.installed || []).includes(x));
    b.textContent = on.length ? `体系 ${on.length}` : "体系";
    b.classList.toggle("on", on.length > 0);
  }

  function openTmSystems() {
    const s = tm.systems || { installed: [], on: [] };
    const inst = s.installed || [], on = new Set(s.on || []);
    if (!inst.length) {
      // 一张都没有的时候别弹一个空框——说清楚这东西是哪儿来的
      return void modal(`
        <h3>体系表</h3>
        <p>体系表管的是<b>一个领域里的通行译法</b>——比如古希腊那一套里，
        中文学界通行的是「赫拉克勒斯」而不是流行文化里的「海格力斯」。
        这类词一本书一本书地纠正是没完的，用一张领域级的表兜住。</p>
        <p>这台电脑上还没有体系表。它们从工坊装：去「工坊」那一格看看有没有人发过。</p>
        <div class="row"><button class="primary" id="mClose">知道了</button></div>`)
        .querySelector("#mClose").addEventListener("click", closeModal);
    }
    const m = modal(`
      <h3>《${esc(tm.book)}》按哪几个体系读</h3>
      <p>勾上的会作为<b>建议</b>参与翻译和校对：大脑看得见，但本书自己的译名表说了算。</p>
      ${inst.map((n, i) => `<label class="tm-sys"><input type="checkbox" data-sys="${i}"${on.has(n) ? " checked" : ""}/> ${esc(n)}</label>`).join("")}
      <div class="row"><button class="plain" id="mCancel">算了</button><button class="primary" id="mOk">好了</button></div>`);
    m.querySelector("#mCancel").addEventListener("click", closeModal);
    m.querySelector("#mOk").addEventListener("click", async () => {
      const want = inst.filter((_, i) => m.querySelector(`[data-sys="${i}"]`).checked);
      try {
        await api("/api/terms/systems", { book: tm.book, systems: want });
        closeModal();
        await loadTerms(true);            // 合并结果变了，整张表重读
      } catch (err) { alert(err.message || "体系没存上，稍等一下再点一次「好了」。"); }
    });
  }

  $("tmSystems").addEventListener("click", openTmSystems);

  async function fillTmBooks() {
    const sel = $("tmBook");
    if (sel.dataset.filled === "1") { sel.value = tm.book; return; }
    const r = await fetch("/api/books").then(r => r.json()).catch(() => ({ books: [] }));
    sel.innerHTML = (r.books || []).map(b =>
      `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join("");
    sel.dataset.filled = "1";
    if (!tm.book && r.books && r.books[0]) tm.book = r.books[0].name;
    sel.value = tm.book;
  }

  function tmVisible() {
    const q = tm.q.trim().toLowerCase();
    return tm.entries.filter(e => {
      if (q && !(e.src.toLowerCase().includes(q) || e.zh.toLowerCase().includes(q))) return false;
      if (tm.filter === "bad") return tmStat(e.key).bad > 0;
      if (tm.filter === "draft") return e.state === "待定";
      return true;
    }).sort((a, b) => {
      // 出现次数高的排前面：最要紧的词自然浮上来。还没扫完就按原顺序。
      const d = tmStat(b.key).count - tmStat(a.key).count;
      return d || a.src.localeCompare(b.src);
    });
  }

  function renderTmList() {
    const list = tmVisible();
    const badN = tm.entries.filter(e => tmStat(e.key).bad > 0).length;
    const draftN = tm.entries.filter(e => e.state === "待定").length;
    const chips = document.querySelectorAll(".tm-chips button");
    chips[0].querySelector("b").textContent = tm.entries.length;
    chips[1].querySelector("b").textContent = tm.loading ? "…" : badN;
    chips[2].querySelector("b").textContent = draftN;
    chips.forEach(c => c.classList.toggle("on", c.dataset.f === tm.filter));

    if (!list.length) {
      $("tmList").innerHTML = `<div class="tm-empty">${tm.entries.length ? "没有符合的条目。" : "这本书还没有译名表。"}</div>`;
      return;
    }
    $("tmList").innerHTML = list.map(e => {
      const st = tmStat(e.key);
      const hint = e.state === "建议";
      return `<div class="tm-row${st.bad ? " bad" : ""}${hint ? " hint" : ""}${e.key === tm.sel ? " on" : ""}" data-k="${esc(e.key)}">
        <span class="dot">${st.bad ? "⚠" : e.state === "待定" ? "○" : "·"}</span>
        <span><span class="src">${esc(e.src)}</span><br/><span class="zh">${esc(e.zh)}</span></span>
        <span class="n">${st.count || ""}${st.bad ? " / " + st.bad + " 误" : ""}</span>
      </div>`;
    }).join("");
  }

  // 高亮：先转义再在转义后的串上找，词里带 & 或 < 的时候才不会错位。
  function tmMark(text, hits) {
    let out = esc(text);
    for (const h of hits) {
      if (!h.s) continue;
      const needle = esc(h.s);
      const re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      out = out.replace(re, m => `<mark class="${h.cls || ""}">${m}</mark>`);
    }
    return out;
  }

  function renderTmDetail() {
    const host = $("tmDetail");
    if (tm.adding) return renderTmForm(null);
    const e = tmEntry(tm.sel);
    if (!e) {
      host.innerHTML = '<div class="tm-empty">左边点一个词，这里显示它的全部：禁用译名、来源，以及它在全书出现的每一处。</div>';
      return;
    }
    renderTmForm(e);
  }

  function renderTmForm(e) {
    const host = $("tmDetail");
    const st = e ? tmStat(e.key) : null;
    const layer = e ? e.layer : "单本";
    const over = String(layer).startsWith("体系");
    const groups = [...new Set((tm.groups || []).concat(["人物", "地名", "其他"]))];
    const shadow = (e && e.shadowed || []).map(s => `${s.layer} 说「${s.zh}」`).join("；");

    host.innerHTML = `
      <h3>${e ? esc(e.src) : "新增一条"}</h3>
      <div class="meta">${e ? `来自${esc(layer)}表${st && st.count ? ` · 全书 ${st.count} 处${st.checked ? `，已翻 ${st.checked} 处` : ""}` : ""}` : "填完保存就进本书的译名表"}
        ${shadow ? ` · <span title="越具体的层权越大">被覆盖：${esc(shadow)}</span>` : ""}</div>
      ${over ? '<div class="tm-note" style="margin-left:0">这条来自体系表，改不了。下面改了会在本书的表里写一条同名的盖住它。</div>' : ""}
      <div class="tm-f">
        <label>原文</label><input id="tmSrc" value="${e ? esc(e.src) : ""}" ${e ? "readonly" : ""}/>
        <label>译名</label><input id="tmZh" value="${e ? esc(e.zh) : ""}"/>
        <label>禁用</label><input id="tmBan" value="${e ? esc((e.ban || []).join("、")) : ""}" placeholder="不许译成的写法，顿号隔开"/>
        <label>分组</label><div class="row">
          <select id="tmGroup">${groups.map(g =>
            `<option${e && e.group === g ? " selected" : ""}>${esc(g)}</option>`).join("")}</select>
          <select id="tmState">${["锁定", "待定", "建议"].map(s =>
            `<option${e && e.state === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>
        </div>
        <label>首现</label><input id="tmFirst" value="${e ? esc(e.first || "") : ""}" placeholder="第三章"/>
        <label>备注</label><textarea id="tmNote" placeholder="为什么这么译；有什么坑">${e ? esc(e.note || "") : ""}</textarea>
      </div>
      <div class="tm-note">分组决定要不要做形近告警——只有人物和地名会去抓「赫克托尔」写成「赫克托耳」这种。</div>
      <div class="tm-f"><label></label><div class="row">
        <button class="tm-fixall" id="tmSave">保存</button>
        ${e && !over ? '<button class="tm-fixall" id="tmDel" style="background:transparent;color:var(--ink-mute);border-color:var(--line)">删掉</button>' : ""}
        ${tm.adding ? '<button class="tm-fixall" id="tmCancel" style="background:transparent;color:var(--ink-mute);border-color:var(--line)">取消</button>' : ""}
      </div></div>
      ${e ? renderTmOcc(e, st) : ""}`;
  }

  function renderTmOcc(e, st) {
    const vs = Object.entries((st && st.variants) || {});
    const fixAll = vs.map(([bad, n]) =>
      `<button class="tm-fixall" data-fixall="${esc(bad)}">把 ${n} 处「${esc(bad)}」统一成「${esc(e.zh)}」</button>`).join(" ");
    const body = tm.occ && tm.occ.key === e.key
      ? (tm.occ.list.length ? tm.occ.list.map(o => tmOccRow(e, o)).join("") :
        `<div class="tm-empty">${tm.badOnly ? "没有不符的地方。" : "这个词在原文里没找到。"}</div>`)
      : '<div class="tm-empty">看实例…</div>';
    const untr = st ? st.count - st.checked : 0;
    return `<div class="tm-occ">
      <div class="head"><b>全书实例</b>
        ${st ? `<span>${st.count} 处${st.checked ? `，已翻 ${st.checked} 处` : ""}${untr ? `，${untr} 处在还没翻的章节里` : ""}</span>` : ""}
        ${st && st.bad ? `<span style="color:#b4442a">${st.bad} 处不符</span>` : ""}
        <label><input type="checkbox" id="tmBadOnly"${tm.badOnly ? " checked" : ""}/> 只看不符</label></div>
      ${fixAll ? `<div style="margin-bottom:.7rem">${fixAll}</div>` : ""}
      ${body}</div>`;
  }

  function tmOccRow(e, o) {
    const wrong = o.ban || o.near || "";
    const zh = o.translated
      ? tmMark(o.zh, [{ s: wrong, cls: "wrong" }, { s: e.zh }])
      : '<span style="color:var(--ink-mute)">这一章还没翻</span>';
    // 没翻的章节不算「不符」。标红等于说人家干错了，可人家根本还没干。
    const why = !o.translated ? "" : o.ok ? ""
      : wrong ? (o.ban ? "用了禁用译名" : "写成了形近的字") : "译文里找不到这个译名";
    return `<div class="tm-o${o.translated && !o.ok ? " bad" : ""}">
      <div class="where">第 ${esc(o.chapter)} 章 · 第 ${o.para + 1} 段${why ? " · " + why : ""}</div>
      <div class="s">${tmMark(o.src, [{ s: e.src }])}</div>
      <div class="t">${zh}</div>
      ${wrong ? `<div class="act"><button data-fix1="${esc(wrong)}" data-ch="${esc(o.chapter)}">这一处改成「${esc(e.zh)}」</button></div>` : ""}
    </div>`;
  }

  async function selectTerm(key) {
    tm.sel = key; tm.adding = false;
    tm.occ = null;
    renderTmList(); renderTmDetail();
    const e = tmEntry(key);
    if (!e) return;
    const url = `/api/terms/occurrences?book=${encodeURIComponent(tm.book)}&src=${encodeURIComponent(e.src)}${tm.badOnly ? "&bad=1" : ""}`;
    const r = await fetch(url).then(r => r.json()).catch(() => null);
    if (!r || tm.sel !== key) return;
    // 出问题的排最前。按章节顺序摆着好看，但一个词有四十处、错的那两处埋在中间，
    // 等于要人一页页翻着找——真要改的东西得一眼看见。
    const list = (r.occurrences || []).slice().sort((a, b) => {
      const rank = o => (o.translated && !o.ok) ? 0 : o.translated ? 1 : 2;
      return rank(a) - rank(b);
    });
    tm.occ = { key, list };
    renderTmDetail();
  }

  async function saveTerm() {
    const e = tmEntry(tm.sel);
    const src = ($("tmSrc").value || "").trim();
    const patch = {
      src, zh: ($("tmZh").value || "").trim(), ban: ($("tmBan").value || "").trim(),
      group: $("tmGroup").value, state: $("tmState").value,
      first: ($("tmFirst").value || "").trim(), note: ($("tmNote").value || "").trim(),
    };
    if (!patch.src || !patch.zh) return alert("原文和译名都得填。");
    // 体系表的条目改不了，改动落成本书的一条同名覆盖；其余写回它自己那层。
    const scope = (e && e.layer === "全局") ? "全局" : "单本";
    try { await api("/api/terms/save", { book: tm.book, scope, src: e ? e.src : src, patch }); }
    catch (err) { return alert(err.message); }
    tm.adding = false;
    const key = (/[A-Za-z]/.test(patch.src) ? patch.src.toLowerCase() : patch.src).replace(/\s+/g, " ").trim();
    await loadTerms(true);
    if (tmEntry(key)) selectTerm(key);
  }

  async function fixTerm(from, to, chapter) {
    try {
      const r = await api("/api/terms/fix", { book: tm.book, from, to, chapter, all: !chapter });
      if (!r.changed) return alert("没找到要改的地方，译文可能已经改过了。");
    } catch (err) { return alert(err.message); }
    const key = tm.sel;
    await loadTerms(true);
    if (tmEntry(key)) selectTerm(key);
  }

  $("tmBook").addEventListener("change", e => { tm.book = e.target.value; tm.sel = ""; loadTerms(true); });
  $("tmSearch").addEventListener("input", e => { tm.q = e.target.value; renderTmList(); });
  document.querySelector(".tm-chips").addEventListener("click", e => {
    const b = e.target.closest("button[data-f]");
    if (!b) return;
    tm.filter = b.dataset.f; renderTmList();
  });
  $("tmList").addEventListener("click", e => {
    const row = e.target.closest(".tm-row");
    if (row) selectTerm(row.dataset.k);
  });
  $("tmAdd").addEventListener("click", () => { tm.adding = true; tm.sel = ""; renderTmList(); renderTmDetail(); });
  $("tmExport").addEventListener("click", () => {
    if (tm.book) location.href = "/api/terms/export?book=" + encodeURIComponent(tm.book);
  });
  $("tmImport").addEventListener("click", () => $("tmFile").click());
  $("tmFile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f || !tm.book) return;
    const csv = await f.text();
    try {
      const r = await api("/api/terms/import", { book: tm.book, scope: "单本", csv });
      alert(`导入 ${r.imported} 条${r.skipped ? `，跳过 ${r.skipped} 条（原文或译名是空的）` : ""}。`);
    } catch (err) { return alert(err.message); }
    loadTerms(true);
  });
  $("tmDetail").addEventListener("click", e => {
    const t = e.target.closest("button, input");
    if (!t) return;
    if (t.id === "tmSave") return saveTerm();
    if (t.id === "tmCancel") { tm.adding = false; renderTmDetail(); return; }
    if (t.id === "tmDel") {
      const en = tmEntry(tm.sel);
      if (!en || !confirm(`把「${en.src} → ${en.zh}」从译名表里删掉？译文不会跟着改。`)) return;
      api("/api/terms/save", { book: tm.book, scope: en.layer === "全局" ? "全局" : "单本", src: en.src, remove: true })
        .then(() => { tm.sel = ""; loadTerms(true); }).catch(err => alert(err.message));
      return;
    }
    if (t.id === "tmBadOnly") { tm.badOnly = t.checked; selectTerm(tm.sel); return; }
    const en = tmEntry(tm.sel);
    if (!en) return;
    if (t.dataset.fixall) {
      if (!confirm(`把全书里的「${t.dataset.fixall}」都改成「${en.zh}」？改的是译文文件，改完不能撤。`)) return;
      return fixTerm(t.dataset.fixall, en.zh, null);
    }
    if (t.dataset.fix1) return fixTerm(t.dataset.fix1, en.zh, t.dataset.ch);
  });

  // 键盘：译者是不摸鼠标的。j/k 上下、回车看实例、/ 搜索、Esc 退出输入框。
  document.addEventListener("keydown", e => {
    if (view !== "bench" || benchPane !== "terms") return;
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "Escape" && inField) { document.activeElement.blur(); return; }
    if (inField) return;
    if (e.key === "/") { e.preventDefault(); $("tmSearch").focus(); return; }
    if (e.key !== "j" && e.key !== "k") return;
    const list = tmVisible();
    if (!list.length) return;
    const i = list.findIndex(x => x.key === tm.sel);
    const next = e.key === "j" ? Math.min(list.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
    e.preventDefault();
    selectTerm(list[next].key);
    const row = $("tmList").querySelector(`.tm-row[data-k="${CSS.escape(list[next].key)}"]`);
    if (row) row.scrollIntoView({ block: "nearest" });
  });

  // 组件 —— 工作台第三格。列表从 /api/components 来（站上的官方清单，跟工坊不是一回事：
  // 工坊是朋友之间递技能，组件是站长放出来的插件）；空就说空，别摆占位卡。
  // 这一格原来是抽签（荷马签、8-bit 神谕），两样都下了，格子改名留给组件。
  let compList = null, compOnline = true;
  async function loadComponents(force) {
    if (compList && !force) return renderComponents();
    try {
      const r = await fetch("/api/components").then(r => r.json());
      compList = r.components || []; compOnline = r.online !== false;
    } catch { compList = []; compOnline = false; }
    renderComponents();
  }
  function renderComponents() {
    const host = $("compBody");
    if (!compList.length) {
      // 两种空要分开说：站上确实还没放，和根本没连上站。后者要给出路。
      host.innerHTML = compOnline
        ? `<div class="rite-card off"><h3>组件库还是空的</h3>
        <p>组件是站上放出来的官方插件，上架了这里就会出现，不用你做什么。</p></div>`
        : `<div class="rite-card off"><h3>现在连不上站</h3>
        <p>组件清单在网上，等网络好一点再打开这一格看看。读书和翻译不受影响。</p></div>`;
      return;
    }
    host.innerHTML = compList.map(c => {
      let act;
      if (!c.ready) act = `<div class="soon">${esc(c.hint || "暂时用不了")}</div>`;
      else if (c.kind === "package" && !c.installed) act = `<button class="rite-go" data-act="install" data-id="${esc(c.id)}">安装</button>`;
      else if (c.kind === "package") act = (c.canOpen ? `<button class="rite-go" data-open="${esc(c.id)}" data-kind="local">打开</button> ` : `<span class="soon">已装好，助手已经会用了</span> `)
        + (c.update ? `<button class="rite-ask" data-act="install" data-id="${esc(c.id)}">更新</button> ` : "")
        + `<button class="rite-ask" data-act="uninstall" data-id="${esc(c.id)}">卸载</button>`;
      else act = `<button class="rite-go" data-open="${esc(c.id)}" data-kind="${esc(c.kind)}" data-url="${esc(c.url || "")}">打开</button>`;
      return `<div class="rite-card${c.ready ? "" : " off"}"><h3>${esc(c.name)}${c.version ? ` <small style="color:var(--ink-mute);font-weight:400">${esc(c.version)}</small>` : ""}</h3><p>${esc(c.desc)}</p>${act}<div class="soon" data-msg="${esc(c.id)}"></div></div>`;
    }).join("");
  }
  // 站上来的 embed 组件在这一格里打开（跟门枢一个样子：一条工具栏 + 一整块 iframe）；
  // 本地装的走 /components/<编号>/，入口页由服务端按目录给，路径从来不经过请求。
  $("compBody").addEventListener("click", e => {
    const back = e.target.closest("button[data-comp-back]");
    if (back) { renderComponents(); return; }
    const act = e.target.closest("button[data-act]");
    if (act) {
      // 装/卸都是几秒到一两分钟的事，按钮当场变灰、旁边写一句，完了整页重拉
      const id = act.dataset.id, msg = $("compBody").querySelector(`[data-msg="${CSS.escape(id)}"]`);
      act.disabled = true;
      if (msg) msg.textContent = act.dataset.act === "install" ? "正在下载安装…" : "正在卸载…";
      api(`/api/components/${act.dataset.act}`, { id })
        .then(r => { if (!r.ok && msg) msg.textContent = r.hint || "没成功，再试一次。"; return loadComponents(true); })
        .catch(() => { if (msg) msg.textContent = "跟程序断了联系，刷新一下页面。"; act.disabled = false; });
      return;
    }
    const b = e.target.closest("button[data-open]");
    if (!b) return;
    if (b.dataset.kind === "embed" && /^https:\/\//.test(b.dataset.url)) {
      $("compBody").innerHTML = `<div class="sp-bar"><button data-comp-back>← 回列表</button><span>${esc(b.textContent === "打开" ? b.closest(".rite-card").querySelector("h3").textContent : "")}</span></div>
        <iframe class="sp-frame" style="height:calc(100% - 3rem)" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer" src="${esc(b.dataset.url)}"></iframe>`;
      return;
    }
    window.open(`/components/${encodeURIComponent(b.dataset.open)}/`, "_blank");
  });

  let spaceList = null;
  let spaceOpen = null;                 // 正看着哪个空间，没进就是 null
  let spaceSeq = 0;                     // 进入的号码牌：探网回来时人已经走了就作废，见 enterSpace()
  // 工具条上那句小字。平时说的是常驻那一句，临时有话（比如全屏没进去）先说临时的，
  // 过几秒换回来——两句话共用一个位置，省得为一句偶尔出现的话在工具条上排第二行。
  //
  // 常驻这句要说的是：框里有些事做不成，别让人对着一个按不动的按钮猜。
  // 只举了用户真会撞上的那两件（圣灵通道的资格核验、瓦达尔瓜佳那页的加群），
  // 不解释 sandbox——那是我们的事，不是他的事。
  const SP_HINT = "核验资格、加群这些要去浏览器里做。";
  let spNoteTimer = 0;
  function spSay(text) {
    clearTimeout(spNoteTimer);
    $("spNote").textContent = text || SP_HINT;
    if (text) spNoteTimer = setTimeout(() => { $("spNote").textContent = SP_HINT; }, 6000);
  }

  async function loadSpaces(force) {
    if (spaceList && !force) return showSpaces();
    try { spaceList = (await fetch("/api/spaces").then(r => r.json())).spaces || []; }
    catch { spaceList = []; }
    showSpaces();
  }

  // 注册表里只有一处的时候不摆列表：点「门枢」就该直接站在那一页上，
  // 中间那一屏「进去看看」是白点一下——只有一个选项的菜单不是菜单。
  // 列表那套没删：注册表那边再加一条 register()，它自己就回来了。
  const solo = () => (spaceList || []).length === 1;
  function showSpaces() { return solo() ? enterSpace(spaceList[0].id) : renderSpaces(); }

  // 连不连得上。要在**挂 iframe 之前**问清楚：iframe 是跨源的，加载失败读不到
  // 状态码，而 onload 对着浏览器自己那张报错页照样会触发——等它告诉我们，
  // 用户已经先看见一个白框或者一句英文报错了。
  //
  // 不单靠 navigator.onLine：它只说网卡连没连上，连着一个上不了外网的 WiFi
  // （宾馆、公司访客网）时它照样是 true。所以那个只用来省一次请求，
  // 真正算数的是 no-cors 探一下——拿不到内容，但连不上会 reject，够判断了。
  function reachable(url) {
    if (navigator.onLine === false) return Promise.resolve(false);
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 6000);
    return fetch(url, { mode: "no-cors", cache: "no-store", signal: ac.signal })
      .then(() => true).catch(() => false)
      .finally(() => clearTimeout(timer));
  }

  function renderSpaces() {
    const host = $("spBody");
    $("spBar").hidden = true;
    host.classList.remove("viewing");
    if (!spaceList.length) {
      host.innerHTML = `<div class="rite-page"><div class="rite-card off">
        <h3>还没有可看的地方</h3><p>之后会在这里放一些看着舒服的页面。</p></div></div>`;
      return;
    }
    host.innerHTML = `<div class="rite-page">` + spaceList.map(s => `
      <div class="rite-card">
        <h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p>
        <button class="rite-go" data-enter="${esc(s.id)}">进去看看</button>
        <div class="sp-tip" data-tip="${esc(s.id)}" hidden></div>
      </div>`).join("") + `</div>`;
  }

  async function enterSpace(id) {
    const s = (spaceList || []).find(x => x.id === id);
    if (!s) return;
    // 从列表进来的话，「正在连…」和连不上那句话都挂在那张卡片上；直接进来的没有卡片，
    // 就整块写一屏。探网要等几秒，断网更是等不来——这两处都不能只给一个白框。
    const one = solo();
    const my = ++spaceSeq;                // 这一次进入的号码牌，见下面探完网那处
    const btn = $("spBody").querySelector(`[data-enter="${CSS.escape(id)}"]`);
    const tip = $("spBody").querySelector(`[data-tip="${CSS.escape(id)}"]`);
    if (tip) tip.hidden = true;
    if (btn) { btn.disabled = true; btn.textContent = "正在连…"; }
    if (one) $("spBody").innerHTML = `<div class="rite-page"><div class="rite-card off"><h3>正在连…</h3></div></div>`;
    const ok = !s.online || await reachable(s.url);
    if (btn) { btn.disabled = false; btn.textContent = "进去看看"; }
    // 探完网才发现这几秒里又发起过一次进入——那这一次就作废。
    // 不作废的话两次都往下走，后一次的 host.innerHTML = "" 会把前一次刚挂上、
    // 还在下载的 iframe 拆掉：控制台留一条 ERR_ABORTED，屏幕上白闪一下。
    // 按钮在上一行已经恢复过了才 return——不然那颗「进去看看」会永远停在「正在连…」。
    if (my !== spaceSeq) return;
    if (!ok) {
      if (tip) { tip.hidden = false; tip.textContent = "现在连不上，等有网了再来。"; }
      if (one) $("spBody").innerHTML = `<div class="rite-page"><div class="rite-card">
        <h3>现在连不上</h3><p>这道门在网上，等有网了再来。</p>
        <button class="rite-go" data-enter="${esc(s.id)}">再试一次</button></div></div>`;
      return;
    }
    if (benchPane !== "spaces" || view !== "bench") return;   // 探网这几秒里人已经走了

    spaceOpen = id;
    const host = $("spBody");
    host.innerHTML = "";
    host.classList.add("viewing");
    const f = document.createElement("iframe");
    f.className = "sp-frame";
    // sandbox 只放行脚本：门后那几件作品是 canvas 动画和掷骰，没有脚本就剩一块黑屏。
    // 不给 allow-same-origin（跨源本来也拿不到）、不给 allow-popups、
    // 不给 allow-top-navigation——嵌进来的页面不该能把用户的整个窗口带走。
    //
    // 门枢是一整张有链接的门户页，这三条挡不住它：sandbox 管的是顶层跳转，
    // 框内导航（总门 → 某条通道 → 通道自己那件作品）换的是这个 iframe 本身，照常走。
    // 挡住的只有两处，都实测过，都是取舍不是 bug：
    //   · target="_blank" 的外链（门枢里只有瓦达尔瓜佳那页一个加群链接）点了没反应，
    //     控制台记一句 blocked。要放行得给 allow-popups——为了一个链接把新窗口的口子
    //     开给整个框，不值。
    //   · 圣灵通道那个「核验」按钮按下去没反应：它是个 <form>，没有 allow-forms 的话
    //     浏览器在派发 submit 事件之前就把提交拦了，页面自己的处理函数根本没机会跑。
    //     就算补上 allow-forms 也到不了头：没有 allow-same-origin，框里是个不透明源，
    //     它那句 credentials:"same-origin" 带不上 cookie，照样认不出登录着的账户。
    // 放宽 sandbox 治不了这两条，只会把失败推后一步，所以不放宽；出路是工具条上那个
    // 「在浏览器里打开」——那两件事到真浏览器里都做得成。工具条那句小字就是说给它们的。
    // 以后加别的空间照这两条验一遍：外链脚本要能跑，别指望 localStorage 和 cookie。
    f.setAttribute("sandbox", "allow-scripts");
    // 全屏是父页面对着 #paneSpaces 调的，本来用不着这条；给它是为了框里的页面
    // 哪天自己带了全屏按钮也能按得动。allow 是权限策略，只开 fullscreen 一项，
    // 跟上面那行 sandbox 是两套东西，不会把 sandbox 放宽半点。
    f.setAttribute("allow", "fullscreen");
    f.setAttribute("referrerpolicy", "no-referrer");
    f.src = s.url;
    host.appendChild(f);
    // 挂上去只是开始下载，整页画出来还得一会儿——这台机器上探完网到画完大约 1.3 秒，
    // 网慢的时候更久。这中间 iframe 就是一块空白，什么都不说的话看着像卡死了。
    // 所以盖一层说一句「正在打开…」，等它的 load 事件再撤。
    //
    // 撤这一层必须有兜底。跨源的 load 只能告诉我们「浏览器画完了点什么」，
    // 万一它一直不来（网络卡在半路），这层不撤就把人永远挡在门外——
    // 撤了至少工具条还在，「在浏览器里打开」那条路是通的。
    const veil = document.createElement("div");
    veil.className = "sp-veil";
    veil.textContent = "正在打开…";
    host.appendChild(veil);
    const dropVeil = () => veil.remove();
    f.addEventListener("load", dropVeil, { once: true });
    setTimeout(dropVeil, 20000);
    // 直接进来的那种：名字不写了——上头那条格子标签已经写着「门枢」，
    // 底下这一页自己也顶着大字标题，再报一遍名字是第三遍。
    // 「回列表」同理收掉：只有一处可看的时候，退回去的那个列表就是它自己。
    $("spTitle").textContent = one ? "" : s.name;
    $("spBack").hidden = one;
    spSay("");
    $("spBar").hidden = false;
  }

  // 「在浏览器里打开」——框里做不成的事，到真浏览器里就都能做：那边有 cookie、
  // 表单提交得了、外链开得出新标签页。圣灵通道的资格核验和加群链接就靠这一条出去。
  //
  // 开的只能是这个空间登记的那个地址，也就是这道门的头一页。用户在框里已经走到
  // 哪条通道了，这边一个字都读不到——跨源、又没给 allow-same-origin，
  // iframe 的 location 本来就不让读。与其猜一个地址，不如老实开头一页，
  // 按钮的 title 里也这么写着；标题不敢写成「打开这一页」。
  //
  // window.open 是这个文件里已有的开外链方式（工坊那边去 GitHub 建仓就是这么开的），
  // 不另起一套。尤其不能让服务端 shell 出去 start/open：那只会在**跑服务的那台电脑**上
  // 弹窗，而这软件是可以用手机连过来看的——手机上点了就等于没反应。
  $("spOpen").addEventListener("click", () => {
    const s = (spaceList || []).find(x => x.id === spaceOpen);
    if (s) window.open(s.url, "_blank");
  });

  // ── 全屏 ──────────────────────────────────────────────
  // 送进全屏的是整格 #paneSpaces，不是那个 iframe：只送 iframe 的话，工具条上那几个
  // 按钮（「退出全屏」，多于一处的时候还有「回列表」）全被留在屏幕外面，
  // 不用键盘的人就出不来了。
  //
  // Esc 不接。全屏的时候浏览器把 Esc 截在自己那一层，压根不派给页面；真去接一个，
  // 没全屏时它照样响，就成了「按 Esc 退出空间」——那是另一件事，没人要过。
  // 这里只听 fullscreenchange，把按钮上的字和那层样式对回去（Esc 退出也会触发它）。
  const spPane = $("paneSpaces");
  const fsNow = () => document.fullscreenElement || document.webkitFullscreenElement || null;

  function syncFull() {
    const on = fsNow() === spPane;
    spPane.classList.toggle("sp-full", on);
    $("spFull").textContent = on ? "退出全屏" : "全屏";
    $("spFull").title = on ? "按 Esc 也能退出" : "铺满整块屏幕，Esc 退出";
  }
  document.addEventListener("fullscreenchange", syncFull);
  document.addEventListener("webkitfullscreenchange", syncFull);   // 老 Safari

  function exitFull() {
    if (fsNow() !== spPane) return;
    // 退出可能被拒（比如已经不在全屏了），吞掉——退不出来也没有第二步要做。
    Promise.resolve((document.exitFullscreen || document.webkitExitFullscreen).call(document)).catch(() => { });
  }

  // 支持不了就把按钮收掉，别摆一个按不动的。
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $("spFull").hidden = true;

  $("spFull").addEventListener("click", () => {
    spSay("");
    if (fsNow() === spPane) return exitFull();
    const req = spPane.requestFullscreen || spPane.webkitRequestFullscreen;
    // 进不去就说一句，页面照常看——全屏是加分项，不是进空间的前提。
    Promise.resolve().then(() => req.call(spPane))
      .catch(() => spSay("全屏被挡了，先这么看吧。"));
  });
  syncFull();                              // 顺手把 title 那句提示补上，省得只有按过一次才有

  // 离开就把 iframe **摘掉**，不是藏起来。满屏 canvas 动画藏起来照样在跑，
  // GPU 一直烧着——这软件是用来啃书的，不是屏保。
  // 先把 src 换成 about:blank 再 remove：光 remove 的话，浏览器可能还留着
  // 那个已脱离文档的 iframe（有引用就不回收），动画未必真停。
  function leaveSpace() {
    // 先作废还在探网的那一次。这一句要在下面那个 return 前面：人走的时候
    // 多半还没挂上 iframe（spaceOpen 还是 null），正是最该拦住它的时候——
    // 不拦的话它几秒后回来，往一个已经切走的格子里挂一页。
    spaceSeq++;
    if (!spaceOpen) return;
    spaceOpen = null;
    exitFull();                            // 全屏着走人会剩一屏铺满的空格子，怪
    const f = $("spBody").querySelector("iframe");
    if (f) { f.src = "about:blank"; f.remove(); }
    // 只管摘，不管接着画什么。切走这一格的时候画了也没人看；
    // 想要那张列表的只有「回列表」，让点它的人自己去要（见下面）。
    $("spBar").hidden = true;
    $("spBody").classList.remove("viewing");
    $("spBody").innerHTML = "";
  }

  $("spBody").addEventListener("click", e => {
    const b = e.target.closest("[data-enter]");
    if (b) enterSpace(b.dataset.enter);
  });
  $("spBack").addEventListener("click", () => { leaveSpace(); renderSpaces(); });

  // ------------------------------------------------------------------ 设置
  // 骨架只搭一次；每次进来只刷新动态的字，不动输入框——不然正打一半的 key 会被清掉
  let setReady = false;
  // 下面这几个「把配置填回框里」的函数必须待在 renderSettings **外面**。
  // 踩过一次：它们本来写在 renderSettings 里，而 fillSettings 在外层——
  // 调用时是 ReferenceError，又正好被 loadSettings 的 try/catch 吞掉，
  // 于是接口地址、模型名、远程访问开关、书库路径全都不显示，页面还一声不吭。
  // 别再挪回去。

  // 接口和模型。三个框都是「空 = 用默认」，所以清空保存就是回到 DeepSeek 官方。
  const apiNote = (t, err) => { const el = $("setApiNote"); if (!el) return; el.textContent = t; el.classList.toggle("err", !!err); };
  function fillApi(s) {
    if (!$("setBase")) return;              // 设置页还没渲染过就没什么可填的
    const d = s.defaults || {};
    $("setBase").value = s.baseUrl || "";  $("setBase").placeholder = "接口地址，留空＝" + (d.baseUrl || "官方");
    $("setModel").value = s.model || "";   $("setModel").placeholder = "主模型，留空＝" + (d.model || "默认");
    $("setFast").value = s.fastModel || ""; $("setFast").placeholder = "快模型，留空＝" + (d.fastModel || "默认");
    if ($("setReasoning")) $("setReasoning").value = s.reasoning || "";
  }

  // 模型候选。不做成只能选的下拉：接口回的那张表是「它愿意公开的」，不是「能用的全集」，
  // 中转站更是想列什么列什么、甚至不开这个接口。所以用 datalist——
  // 点一下有得挑，想打字照样打，查不到也只是没有候选，不挡着人填。
  let modelListTried = false;
  async function loadModelList(quiet) {
    const dl = $("setModelList"); if (!dl) return;
    if (!quiet) apiNote("正在问这个接口有哪些模型…");
    try {
      const r = await api("/api/settings/models", { baseUrl: $("setBase").value });
      dl.innerHTML = (r.models || []).map(m => `<option value="${esc(m)}"></option>`).join("");
      if (!quiet) apiNote(r.hint || "", false);
    } catch (e) { if (!quiet) apiNote(e.message || "没问成，名字自己打就行。", true); }
  }

  // 谁来当大脑。选项列表由后端给（server.js 里 BRAINS 那张表），前端只管画——
  // 以后加一条大脑，这里一个字都不用改。
  const brainNote = (x, err) => { const el = $("setBrainNote"); if (!el) return; el.textContent = x; el.classList.toggle("err", !!err); };
  let brainList = [];
  function syncBrainRow(showNote) {
    if (!$("setBrain")) return;
    const id = $("setBrain").value;
    // 只有「自定义命令」才需要那个输入框，别的时候藏起来——多一个看不懂的框
    // 就多一个让人犹豫的东西。
    $("setBrainCmdRow").hidden = id !== "custom";
    const b = brainList.find(x => x.id === id);
    if (showNote && b && b.note) brainNote(b.note);
  }
  function fillBrain(s) {
    const sel = $("setBrain");
    if (!sel) return;
    brainList = s.brains || [];
    const want = brainList.map(b => b.id).join(",");
    if (sel.dataset.ids !== want) {
      sel.innerHTML = brainList.map(b => `<option value="${esc(b.id)}">${esc(b.label)}</option>`).join("");
      sel.dataset.ids = want;
    }
    sel.value = s.brain || "claude";
    if (document.activeElement !== $("setBrainCmd")) $("setBrainCmd").value = s.brainCmd || "";
    syncBrainRow(false);
  }

  // 读图。两个框都是「空 = 关掉」。地址留空时后端会去借上面那个自定义接口
  // （官方 DeepSeek 没有视觉模型，那种情况不借），所以状态得由后端说了算。
  const visNote = (x, err, sticky) => {
    const el = $("setVisNote"); if (!el) return;
    el.textContent = x; el.classList.toggle("err", !!err);
    if (sticky) el.dataset.sticky = "1";
  };
  function fillVision(s) {
    if (!$("setVisBase")) return;
    if (document.activeElement !== $("setVisBase")) $("setVisBase").value = s.visionBase || "";
    if (document.activeElement !== $("setVisModel")) $("setVisModel").value = s.visionModel || "";
    // 用户刚点过保存/试一下的话，那句话比状态更该留在屏幕上
    if (!$("setVisNote").dataset.sticky) {
      // 没 key 的时候得直说。只写一句「开着」，用户会盯着一个没反应的
      // 功能想不明白——而那句才是他真正需要的。
      visNote(s.visionOn
        ? (s.visionBorrowed ? "开着，用的是上面那把 key。" : "开着。")
        : "上面还没填 key，所以暂时读不了图。");
    }
  }

  // 读书的工具（PDF、认字）到底在不在，以及「试着修一下」。
  //
  // **这张卡一直在，不再「修好了就整张消失」。**
  // 原来是缺东西才露面，想法是「一切正常的人不用知道底下还有 Python 这回事」。
  // 结果是反的：有人一路修到好，眼看着那个按钮凭空不见了，以为是自己把界面弄坏了
  // ——而那一刻恰恰是修成功的信号。两个人先后这么问过。
  // 修好之后该给的是一句「都好了」，不是把证据收走。
  //
  // 探测要真去跑几次 python，所以只在打开设置页时问一次、修完再问一次，
  // 不跟着设置页那个定时刷新一起跑。
  async function fillTools() {
    const card = $("setToolsCard");
    if (!card) return;
    // 先写一句占位再露脸。原来是先 hidden=false 再去问，问得慢或者问不到的时候
    // 用户看到的是一张只有标题、底下空着的卡片 —— 那比不显示更让人发慌。
    if (!$("setToolsState").textContent.trim()) $("setToolsState").textContent = "正在看读书的工具装好了没…";
    card.hidden = false;
    let s = null;
    // 问不到就说问不到。原来这儿是 return，卡留在上一次的样子——
    // 探测本身卡住的时候，用户看到的是一张过期的卡，还以为是当前状态。
    try { s = await fetch("/api/tools").then(r => r.json()); }
    catch {
      $("setToolsState").textContent = "这会儿问不出工具的状态（服务没回话）。过一会儿再打开这一页看看。";
      $("setToolsBtns").innerHTML = "";
      return;
    }
    const missing = [];
    if (!s.pdf) missing.push(["pdf", "读 PDF"]);
    if (!s.ocr) missing.push(["ocr", "读扫描版（认字）"]);
    const who = s.python
      ? `用的是 ${s.python}${s.version ? "（" + s.version + "）" : "（版本问不出来）"}`
      : "这台电脑上没找到 Python";
    if (!missing.length) {
      $("setToolsState").textContent = `读 PDF、读扫描版都正常，${who}。这一格没事就不用管。`;
      $("setToolsState").classList.remove("err");
      $("setToolsBtns").innerHTML = "";
      $("setToolsLog").hidden = true;
      return;
    }
    $("setToolsState").textContent =
      missing.map(m => m[1]).join("、") + "现在用不了（" + who + "）"
      + "。点下面的按钮会把安装时那几条命令原样再跑一次——多半是当时网没通。";
    $("setToolsBtns").innerHTML = missing
      .map(m => `<button class="set-plain" data-fix="${m[0]}">试着修一下：${esc(m[1])}</button>`).join("");
  }

  $("setBody").addEventListener("click", async e => {
    const btn = e.target.closest("[data-fix]");
    if (!btn) return;
    const what = btn.dataset.fix;
    const log = $("setToolsLog");
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = "正在装…（要一两分钟）";
    log.hidden = true;
    try {
      const r = await api("/api/tools/repair", { what });
      $("setToolsState").textContent = r.hint || (r.ok ? "修好了。" : "还是没成。");
      $("setToolsState").classList.toggle("err", !r.ok);
      if (r.log) { log.textContent = r.log; log.hidden = false; }
      if (r.ok) await fillTools();          // 修好了就把卡刷成「都好了」，不是让它消失
    } catch (err) {
      $("setToolsState").textContent = err.message || "没修成，稍后再试。";
      $("setToolsState").classList.add("err");
    } finally { btn.disabled = false; btn.textContent = old; }
  });

  // QQ 机器人。密钥只写不读——服务端只回「填没填过」，不回明文。
  const qqNote = (x, err, sticky) => {
    const el = $("setQqNote"); if (!el) return;
    el.textContent = x; el.classList.toggle("err", !!err);
    if (sticky) el.dataset.sticky = "1";
  };
  function fillQq(s) {
    if (!$("setQqId")) return;
    if (document.activeElement !== $("setQqId")) $("setQqId").value = s.qqAppId || "";
    if (s.qqSecretSet && document.activeElement !== $("setQqSecret")) {
      $("setQqSecret").placeholder = "已经存过一把（要换就填新的）";
    }
    const q = s.qq || {};
    $("setQqUnbind").hidden = !q.bound;
    if ($("setQqNote").dataset.sticky) return;
    // 状态直说，别让用户猜「保存了到底连上没有」
    const words = {
      off: s.qqAppId ? "还没保存密钥，填上再点保存。" : "没开。填 AppID 和密钥就开。",
      connecting: "正在连…" + (q.detail ? "（" + q.detail + "）" : ""),
      online: q.bound ? "连上了，也认过主人了。直接在 QQ 上给它发消息。"
        : "连上了，还没认主人——去 QQ 上给它发一句话，第一个说话的人就是主人。",
      error: "连不上：" + (q.detail || "不知道为什么"),
    };
    qqNote(words[q.phase] || "");
  }

  function renderSettings() {
    $("setBody").innerHTML = `
      <div class="rite-card">
        <h3>翻译大脑的 API key</h3>
        <p class="set-state" id="setKeyState">…</p>
        <div class="set-row">
          <input id="setKey" class="rite-q" type="password" placeholder="sk- 开头的一串，粘贴到这里" autocomplete="new-password" />
          <button id="setKeyEye" class="set-plain" type="button" title="看一眼粘进去的是什么">看一眼</button>
          <button id="setKeySave" class="rite-go">保存</button>
          <button id="setKeyTest" class="set-plain" title="问一下 DeepSeek 这把 key 通不通、还有多少钱">测一下</button>
        </div>
        <p class="set-note">在 platform.deepseek.com 注册后创建。保存立刻生效，不用重启。<span id="setKeyCount"></span></p>
      </div>
      <div class="rite-card">
        <h3>手机访问</h3>
        <p>手机连同一个 Wi-Fi，用这个链接打开（打开一次就会记住，之后不用再带口令）：</p>
        <div class="set-box" id="setLan">—</div>
        <div class="set-row">
          <button id="setCopyLan" class="set-plain">复制链接</button>
          <button id="setRotate" class="set-plain danger">重新生成口令</button>
        </div>
        <p class="set-note">「重新生成口令」用在链接发错了人的时候：旧链接全部作废，手机要用新链接重新打开一次。</p>
      </div>
      <div class="rite-card">
        <h3>在外面也能用</h3>
        <p>在公司、在路上、用手机流量的时候，也能连回家里这台电脑看书。手机扫一下码就行，
          不用装 App，不用注册账号，也不用在路由器上开端口。</p>
        <div id="relayBox"><p class="set-note">…</p></div>
        <details class="relay-adv">
