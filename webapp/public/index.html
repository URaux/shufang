    // 版本 / 更新。这一格三种状态：已是最新、有新版（露出按钮）、查不到（如实说查不到，
    // 不许说成"已是最新"——那会让用户以为自己拿的是最新的）。
    const verState = (t, err) => { const el = $("setVerState"); if (!el) return; el.textContent = t; el.classList.toggle("err", !!err); };
    async function checkVersion() {
      verState("正在看有没有新版本…");
      $("setVerApply").hidden = true;
      let r;
      try { r = await fetch("/api/update/check").then(x => x.json()); }
      catch { return verState("连不上，没查到版本。等有网再点「再查一次」。", true); }
      const short = (r.current || "").slice(0, 7) || "未知";
      if (!r.known) return verState(`当前版本 ${short}。查不到线上版本（多半是没网），等会儿再点「再查一次」。`, true);
      if (!r.hasNew) return verState(`已经是最新版了（${short}）。`);
      verState(`有新版本可以更新（现在是 ${short}，最新是 ${r.latest.slice(0, 7)}）。`);
      if (r.canApply) $("setVerApply").hidden = false;
      else verState(`有新版本。关掉群星回廊、再双击一次桌面图标就会自动更新（现在是 ${short}）。`);
    }
    $("setVerCheck").addEventListener("click", checkVersion);
    $("setVerApply").addEventListener("click", async () => {
      const btn = $("setVerApply");
      btn.disabled = true;
      // 接棒那一步（等本进程退出 → 起启动器）依赖一个活到我们死后的小程序，这在不同机器上不是百分百可靠。
      // 所以话要说全：正常情况它自己回来；万一没回来，用户知道下一步该干什么，而不是干等。
      verState("正在更新，程序会自己关掉再开回来，这个页面会断开一下…等半分钟还没动静，就双击桌面上的「群星回廊」，一样会装上新版。");
      try {
        const r = await fetch("/api/update/apply", { method: "POST" }).then(x => x.json());
        if (!r.ok) { btn.disabled = false; return verState(r.hint || "没更新成。", true); }
        // 服务马上就退了，这里只负责等它回来：轮询到端口重新通就自己刷新
        setTimeout(function poll() {
          fetch("/api/status", { cache: "no-store" })
            .then(() => location.reload())
            .catch(() => setTimeout(poll, 2000));
        }, 4000);
      } catch { btn.disabled = false; verState("没能开始更新。关掉重开一样能更新。", true); }
    });
    checkVersion();

    const keyState = (html, err) => { const el = $("setKeyState"); el.innerHTML = html; el.classList.toggle("err", !!err); };

    // 粘贴出问题时最要命的是「看不见」：密码框里几个圆点跟三十几个圆点长得差不多。
    // 有用户粘进去只有一个字符，试了半天最后一个个手打完。把字数摆出来，再给个「看一眼」。
    const keyCount = () => {
      const el = $("setKeyCount"); if (!el) return;
      const n = $("setKey").value.trim().length;
      el.textContent = n ? `　已输入 ${n} 个字符${n < 12 ? "（太短了，多半没粘全）" : ""}` : "";
      el.style.color = n && n < 12 ? "#a3453a" : "var(--ink-mute)";
    };
    $("setKey").addEventListener("input", keyCount);
    $("setKeyEye").addEventListener("click", () => {
      const el = $("setKey"), hidden = el.type === "password";
      el.type = hidden ? "text" : "password";
      $("setKeyEye").textContent = hidden ? "藏起来" : "看一眼";
      el.focus();
    });

    $("setKeySave").addEventListener("click", async () => {
      const k = $("setKey").value.trim();
      if (!k) { keyState("先把 key 粘到框里再点保存。", true); return; }
      $("setKeySave").disabled = true;
      try {
        const r = await fetch("/api/settings", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: k }),
        });
        const d = await r.json();
        // 这个接口把要说的话直接放在 error 里（是中文），humanize 会原样放行；
        // 万一哪天改成了代号，也不至于把英文弹到屏幕上
        if (!r.ok) { keyState(esc(d.hint || humanize(d.error) || "这个 key 没保存上，检查一下再粘一次。"), true); return; }
        $("setKey").value = "";
        keyCount();
        fillSettings(d);
        keyState(`换好了，现在用的是 <b>${esc(d.keyMasked)}</b>。`);
      } catch { keyState("没保存上（网络问题？），再试一次。", true); }
      finally { $("setKeySave").disabled = false; }
    });

    // 框里有字就测框里的（还没保存也能先测），没字就测已经存着的那把
    $("setKeyTest").addEventListener("click", async () => {
      const k = $("setKey").value.trim();
      $("setKeyTest").disabled = true; keyState("正在问 DeepSeek…");
      try { const r = await api("/api/settings/test-key", k ? { key: k } : {}); keyState(esc(r.hint), !r.ok); }
      catch { keyState("跟程序断了联系，刷新一下页面。", true); }
      finally { $("setKeyTest").disabled = false; }
    });

    $("setCopyLan").addEventListener("click", () => {
      const url = $("setLan").textContent;
      if (!url.startsWith("http")) return;
      navigator.clipboard && navigator.clipboard.writeText(url).then(() => {

    $("setPortSave").addEventListener("click", async () => {
      $("setPortSave").disabled = true;
      try {
        const r = await fetch("/api/settings", {
          method: "POST", headers: { "Content-Type": "application/json" },

        });

          : (d.hint || humanize(d.error) || "端口没保存上，换个 1024 到 65535 之间的数字再试。");
      } catch { $("setPortNote").textContent = "端口没保存上，跟「群星回廊」断了联系。看看启动窗口还开着没有。"; }
      finally { $("setPortSave").disabled = false; }
    });

    $("setSpaces").addEventListener("change", () => {
      const on = $("setSpaces").checked;
      applyFlags({ spacesEnabled: on });
      fetch("/api/settings", {
        method: "POST", headers: { "Content-Type": "application/json" },

      }).catch(() => { });

    $("setTelemetry").addEventListener("change", () => {
      fetch("/api/settings", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telemetry: $("setTelemetry").checked }),
      }).catch(() => { });

    $("setRemote").addEventListener("change", () => {
      fetch("/api/settings", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ remoteAccess: $("setRemote").checked }),
      }).catch(() => { });
    });

    // 写剪贴板分两条路。navigator.clipboard 只在「安全上下文」里有（https 或 localhost），
    // 手机是走 http://192.168.x.x 进来的，那上面这个对象干脆是 undefined——
    // 上面几个「复制链接」按钮在手机上没反应就是这个原因。
    // 退回老办法：塞进一个 textarea 选中，execCommand("copy")。过时，但到处都能用。
    // textarea 得真的在页面上、能被选中（display:none 的选不中），挪到角落隐身就行。
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); return true; } catch { }
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ta.setSelectionRange(0, ta.value.length);   // iOS 的 select() 不一定选全
      let done = false;
      try { done = document.execCommand("copy"); } catch { }
      ta.remove();
      return done;
    }

    $("setApiSave").addEventListener("click", async () => {
      $("setApiSave").disabled = true;
      apiNote("正在保存…");
      try {
        const r = await api("/api/settings", {
          baseUrl: $("setBase").value, model: $("setModel").value, fastModel: $("setFast").value,
          reasoning: $("setReasoning") ? $("setReasoning").value : undefined,

        else { fillApi(r); apiNote("保存好了。整理书、写摘要立刻用新的；聊天那条要关掉重开才换过来。"); }
      } catch (e) { apiNote(e.message || "没保存成。", true); }
      finally { $("setApiSave").disabled = false; }
    });
    $("setApiList").addEventListener("click", async () => {
      $("setApiList").disabled = true;
      try { await loadModelList(false); }
      finally { $("setApiList").disabled = false; }
    });
    $("setApiTest").addEventListener("click", async () => {
      $("setApiTest").disabled = true;
      apiNote("正在问一句…");
      try {
        const r = await api("/api/settings/test-key", {});
        apiNote(r.hint || (r.ok ? "通了。" : "没通。"), !r.ok);

      $("setBrainSave").disabled = true;
      brainNote("正在保存…");

        const r = await api("/api/settings", { brain: $("setBrain").value, brainCmd: $("setBrainCmd").value });
        if (r && r.error) brainNote(r.hint || r.error, true);
        else {
          fillBrain(r);
          // 聊天那条是现起进程的，下一句就换过来；但正在跑的后台任务还在用旧的。
          brainNote("换好了。下一句聊天就用新的；正在跑的整理任务还是用原来那个跑完。");
        }
      } catch (e) { brainNote(e.message || "没保存成。", true); }
      finally { $("setBrainSave").disabled = false; }

    $("setBrainTest").addEventListener("click", async () => {
      $("setBrainTest").disabled = true;
      brainNote("正在看看…");
      try {
        const r = await api("/api/settings/test-brain", { brain: $("setBrain").value, brainCmd: $("setBrainCmd").value });
        brainNote(r.hint || (r.ok ? "能用。" : "用不了。"), !r.ok);
      } catch (e) { brainNote(e.message || "没测成。", true); }
      finally { $("setBrainTest").disabled = false; }
    });
    $("setVisSave").addEventListener("click", async () => {
      $("setVisSave").disabled = true;
      visNote("正在保存…", false, true);
      try {
        const r = await api("/api/settings", { visionBase: $("setVisBase").value, visionModel: $("setVisModel").value });
        if (r && r.error) visNote(r.hint || r.error, true, true);
        else {
          $("setVisNote").dataset.sticky = "";
          fillVision(r);
          // 已经在书库里的书不会自动补图说——那要重新看一遍所有图，是一笔用户没同意花的钱
          visNote(r.visionOn ? "开了。从下一本传进来的书开始看图。" : "关了。", false, true);
        }
      } catch (e) { visNote(e.message || "没保存成。", true, true); }
      finally { $("setVisSave").disabled = false; }
    });
    $("setVisTest").addEventListener("click", async () => {
      $("setVisTest").disabled = true;
      visNote("正在给它看一张图…", false, true);
      try {
        const r = await api("/api/settings/test-vision", { visionBase: $("setVisBase").value, visionModel: $("setVisModel").value });
        visNote(r.hint || (r.ok ? "能看图。" : "看不了。"), !r.ok, true);
      } catch (e) { visNote(e.message || "没测成。", true, true); }
      finally { $("setVisTest").disabled = false; }
    });
    // 发给站长（/api/report）：绑过群星账号才发得出去。打开着一本书时多一个「附上译文」的勾，默认不勾。
    if (currentBook && currentBook.translated && currentBook.translated.length) {
      $("setRepBookName").textContent = currentBook.name;
      $("setRepBookRow").hidden = false;
    }
    $("setReport").addEventListener("click", async () => {
      const note = $("setRepNote2");
      $("setReport").disabled = true;
      note.classList.remove("err");
      note.textContent = $("setRepBook").checked ? "正在发（带着译文，要一会儿）…" : "正在发…";
      try {
        const r = await fetch("/api/report", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ note: $("setRepNote").value, book: $("setRepBook").checked && currentBook ? currentBook.name : "" }) })
          .then(x => x.json()).catch(() => ({ ok: false, hint: "跟「群星回廊」断了联系，刷新一下再试。" }));
        if (r.ok) { note.innerHTML = `发好了。告诉站长这个号：<span class="relay-fp">${esc(r.id)}</span>`; $("setRepNote").value = ""; }
        else { note.textContent = r.hint || "没发出去，过一会儿再试。"; note.classList.add("err"); }
      } finally { $("setReport").disabled = false; }
    });
    // 存到桌面：写成文件 + 打开文件夹选中它。用户下一步就是拖进 QQ。
    $("setDiagDesk").addEventListener("click", async () => {
      const note = $("setDiagNote");
      $("setDiagDesk").disabled = true;
      note.textContent = "正在写…";
      try {
        const r = await api("/api/diag/save", {});
        note.textContent = r.hint || "存好了。";
        note.classList.toggle("err", !r.ok);
      } catch (e) {
        note.textContent = e.message || "没存成，用旁边那个「导出成文件」试试。";
        note.classList.add("err");
      } finally { $("setDiagDesk").disabled = false; }
    });

    // 那两个框只有用别家模型的人需要，默认收着：
    // 两个空框摆在那里，会让人以为自己还得填点什么才能用。
    $("setVisMore").addEventListener("click", () => {
      const on = $("setVisAdv").hidden;
      $("setVisAdv").hidden = !on;
      $("setVisAdv2").hidden = !on;
      $("setVisMore").textContent = on ? "收起来" : "用别家的模型";
    });

    // QQ 这三个按钮跟上面那些一样，是 renderSettings 画出来的，
    // 所以事件必须在这里挂。挂在顶层的话，页面一加载 $("setQqSave") 还是 null，
    // addEventListener 当场抛异常，**后面整段启动代码一句都不会再跑**——
    // 包括加载书架。症状是界面打得开、书架空的、哪本书都点不开，
    // 而控制台之外没有任何提示。真发出去过一版，用户报的就是这个。
    $("setQqSave").addEventListener("click", async () => {
      $("setQqSave").disabled = true;
      qqNote("正在保存…", false, true);
      try {
        const r = await api("/api/settings", { qqAppId: $("setQqId").value, qqSecret: $("setQqSecret").value });
        if (r && r.error) qqNote(r.hint || r.error, true, true);
        else {
          $("setQqSecret").value = "";
          $("setQqNote").dataset.sticky = "";
          fillQq(r);
          qqNote("存好了，正在连。连上之后去 QQ 上给你的机器人发一句话。", false, true);
        }
      } catch (e) { qqNote(e.message || "没保存成。", true, true); }
      finally { $("setQqSave").disabled = false; }
    });
    $("setQqTest").addEventListener("click", async () => {
      $("setQqTest").disabled = true;
      qqNote("正在问开放平台…", false, true);
      try {
        const r = await api("/api/settings/test-qq", { qqAppId: $("setQqId").value, qqSecret: $("setQqSecret").value });
        qqNote(r.hint || (r.ok ? "通了。" : "不通。"), !r.ok, true);
      } catch (e) { qqNote(e.message || "没测成。", true, true); }
      finally { $("setQqTest").disabled = false; }
    });
    $("setQqUnbind").addEventListener("click", async () => {
      if (!confirm("解除绑定？\n\n下一个跟这个机器人说话的人会成为新的主人。")) return;
      try {
        const r = await api("/api/settings/qq-unbind", {});
        qqNote(r.hint || "解开了。", false, true);
        $("setQqUnbind").hidden = true;
      } catch (e) { qqNote(e.message || "没解成。", true, true); }
    });

    $("setGuide").addEventListener("click", async () => {
      const note = $("setGuideNote");
      $("setGuide").disabled = true;
      note.textContent = "正在放回去…";
      try {
        const r = await api("/api/guide/restore", {});
        note.textContent = r.hint || (r.ok ? "放回去了。" : "没成功。");
        note.classList.toggle("err", !r.ok);
      } catch { note.textContent = "没成功，刷新一下再试。"; note.classList.add("err"); }
      finally { $("setGuide").disabled = false; }
    });
    $("setDiag").addEventListener("click", async () => {
      const note = $("setDiagNote");
      $("setDiag").disabled = true;
      note.textContent = "正在整理…";
      try {
        const r = await fetch("/api/diag");
        if (!r.ok) throw new Error();
        const text = await r.text();
        // 拿到文本再复制，中间隔了一次 await：浏览器给点击留的「用户授权」窗口有几秒，
        // 本机请求远不到这个数。真不让复制（个别老浏览器），就把内容摆出来让人手动选。
        if (await copyText(text)) { note.textContent = "已复制，粘贴给站长"; return; }
        let box = $("setDiagBox");
        if (!box) {
          box = document.createElement("textarea");
          box.id = "setDiagBox"; box.className = "rite-q"; box.rows = 8; box.readOnly = true;
          note.after(box);
        }
        box.value = text;
        note.textContent = "这个浏览器不让网页写剪贴板。长按下面这块全选、复制，再粘贴给站长。";
      } catch { note.textContent = "没拿到日志（服务没在跑？）。用桌面上的「复制群星回廊日志」试试。"; }
      finally { $("setDiag").disabled = false; }
    });
  }

  function fillSettings(s) {
    $("setKeyState").innerHTML = s.keyMasked
      ? `现在用的是 <b>${esc(s.keyMasked)}</b>，要换就贴一个新的：`
      : `<b>还没配 key</b>——聊天和翻译都靠它，配一个吧：`;
    $("setLan").textContent = s.lanUrl || (s.viaRelay ? "这条链接只在家里那台电脑上显示。" : "没找到局域网地址（电脑可能没连网）");
    renderRelay();
    renderTs();
    if (document.activeElement !== $("setPort")) $("setPort").value = s.port;
    if (s.actualPort && s.actualPort !== s.port) {
      $("setPortNote").textContent = `配置的端口 ${s.port} 被别的程序占了，现在实际用的是 ${s.actualPort}。`;
    }
    // 三个框正在被人编辑的时候别覆盖掉（设置页会定时刷新）
    if (![$("setBase"), $("setModel"), $("setFast"), $("setReasoning")].includes(document.activeElement)) fillApi(s);
    // 候选模型只在第一次打开设置页时悄悄取一次：这个面板会定时刷新，
    // 每次刷新都去打人家的接口既慢又没礼貌。取不到就当没有候选，不打扰用户。
    if (!modelListTried) { modelListTried = true; loadModelList(true); }
    if (document.activeElement !== $("setBrain")) fillBrain(s);
    fillVision(s);
    fillQq(s);
    $("setRemote").checked = !!s.remoteAccess;
    $("setSpaces").checked = !!s.spacesEnabled;
    $("setTelemetry").checked = !!s.telemetry;
    // 被环境变量关死的时候开关点了也没用，干脆灰掉并说一声，免得以为设置坏了
    $("setTelemetry").disabled = !!s.telemetryLocked;
    if (s.telemetryLocked) $("setTelemetryNote").textContent = "这台电脑的启动方式里已经把它关掉了，这里改不了，也什么都不会发。";
    applyFlags(s);
    $("setVault").textContent = s.vaultPath || "—";
  }

  // 「群星账号」：设备码绑定（见 docs/course-account-key.md）。状态全从 /api/account 来；
  // 等批准的时候两秒问一次，批准了这一页自己换成「绑定好了」——人在浏览器那边点完不会回来点刷新。
  let acctTimer = 0;
  async function renderAccount() {
    const box = $("acctBox");
    if (!box) return;
    let s;
    try { s = await fetch("/api/account").then(r => r.json()); }
    catch { box.innerHTML = `<p class="set-note">现在读不到状态，过一会儿再打开这一页。</p>`; return; }
    let html = s.message ? `<p class="relay-ok">${esc(s.message)}</p>` : "";
    if (!s.local) html = `<p class="set-note">绑定、解除群星账号，要在家里那台电脑上点。</p>`;
    else if (s.bound) {
      html += `<p>已绑定：<b>${esc(s.email)}</b><span class="set-note">　${esc(s.deviceName)}</span></p>`
        + (s.hasAck ? "" : `<p class="set-note err">这台电脑还没取到账号的课程钥匙。</p>`)
        + `<div class="set-row">${s.hasAck ? "" : `<button class="rite-go" data-acct="pull">再取一次</button>`}`
        + `<button class="set-plain danger" data-acct="unbind">解除绑定</button></div>`;
    } else if (s.pending) {
      const left = Math.max(0, Math.ceil((s.pending.expiresAt - Date.now()) / 60000));
      html += `<p>在已经登录群星账号的浏览器里打开下面这个链接，核对码是 <span class="relay-fp">${esc(s.pending.userCode)}</span>，点「允许」：</p>`
        + `<div class="set-box">${esc(s.pending.verifyUrl)}</div>`
        + `<div class="set-row"><a class="rite-go" href="${esc(s.pending.verifyUrl)}" target="_blank" rel="noopener" style="text-decoration:none">在浏览器里打开</a>`
        + `<button class="set-plain" data-acct="cancel">不绑了</button></div>`
        + `<p class="set-note">${left} 分钟内有效。批准之后这里几秒内会显示绑定成功。</p>`;
    } else {
      html += `<div class="set-row"><button class="rite-go" data-acct="bind">绑定群星账号</button></div>`;
    }
    box.innerHTML = html;
    clearTimeout(acctTimer);
    if (view === "settings" && s.pending) acctTimer = setTimeout(renderAccount, 2000);
  }
  $("setBody").addEventListener("click", async e => {
    const b = e.target.closest("button[data-acct]");
    if (!b) return;
    const act = b.dataset.acct;
    if (act === "unbind" && !confirm("解除绑定群星账号？\n\n这台电脑上的课程照常能打开；以后换电脑就要重新编了（除非再绑回来）。")) return;
    b.disabled = true;
    try { await api("/api/account/" + act, {}); } catch (err) { toast(err.message); }
    renderAccount();
  });

  // 「在外面也能用」：扫码配手机（自家中转，见 relay.js）。状态全从 /api/relay 来。
  // 二维码只在点了「用手机扫码」的这一页上显示；配上以后接口里的 pending 会消失、
  // 列表多一部手机，这一页隔两秒问一次，自己换成「配好了」——扫码的人手里拿着手机，
  // 不会回来点刷新。二维码里带着钥匙，只有这台电脑自己能要到（手机上看设置页只有列表）。
  let relayTimer = 0, relayQr = null, relayDone = "";
  const relayAgo = t => {
    const m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`;
  };
  const relayDay = t => { const d = new Date(t); return `${d.getMonth() + 1} 月 ${d.getDate()} 日`; };
  async function renderRelay() {
    const box = $("relayBox");
    if (!box) return;
    let s;
    try { s = await fetch("/api/relay").then(r => r.json()); }
    catch { box.innerHTML = `<p class="set-note">现在读不到状态，过一会儿再打开这一页。</p>`; return; }
    // 正在扫的那一张已经被用掉（配上了）或者过期了
    if (relayQr && (!s.pending || s.pending.id !== relayQr.id)) {
      const got = s.phones.find(p => p.id === relayQr.id);
      relayDone = got ? `配好了：${got.name} ✓ 以后在手机上点主屏幕的图标就能进来。` : "";
      relayQr = null;
    }
    let html = "";
    if (!s.available) {
      html = `<p class="set-note err">这台电脑上的程序版本太旧，用不了。重跑一次安装器会装上合适的版本。</p>`;
    } else if (relayQr) {
      const left = Math.max(0, Math.ceil((relayQr.expiresAt - Date.now()) / 60000));
      html = `<div class="relay-pair">
          <div class="relay-qr">${relayQr.svg}</div>
          <div class="relay-how">
            <p>用手机的相机或者微信扫一下。</p>
            <p class="set-note">扫完手机上直接打开的就是群星回廊。这张码 ${left} 分钟内有效，只能配一部手机。
              在微信里扫的，要点右上角「···」→「在浏览器打开」。</p>
            <p class="set-note">手机上会显示一个安全码，应该是 <span class="relay-fp">${esc(relayQr.fp)}</span>。</p>
            <div class="set-row"><button class="set-plain" data-relay="cancel">不扫了</button></div>
          </div>
        </div>`;
    } else if (!s.local) {
      html = `<p class="set-note">配新手机、解除手机，都要在家里那台电脑上点。</p>`;
    } else if (s.phones.length >= s.max) {
      html = `<p class="set-note">已经配了 ${s.max} 部手机，满了。要配新的，先在下面解除一部不用的。</p>`;
    } else {
      html = `<div class="set-row"><button class="rite-go" data-relay="pair">用手机扫码</button></div>`;
    }
    if (relayDone && !relayQr) html = `<p class="relay-ok">${esc(relayDone)}</p>` + html;
    if (s.phones.length) {
      const net = { online: "", connecting: "正在连中转…", retry: "现在连不上中转，过一会儿会自己再试（这台电脑能上网吗？）", off: "" }[s.state] || "";
      html += `<p class="relay-h">已配对的手机（${s.phones.length}/${s.max}）</p><ul class="relay-list">`
        + s.phones.map(p => `<li>
            <div class="who"><b><span class="relay-dot${p.online ? " on" : ""}"></span>${esc(p.name)}</b>
              <small>${p.online ? "正连着" : `上次用：${relayAgo(p.lastSeen)}`} · 配对于 ${relayDay(p.pairedAt)} · 安全码 <span class="relay-fp">${esc(p.fp)}</span></small></div>
            ${s.local ? `<button class="set-plain danger" data-relay="unpair" data-id="${esc(p.id)}" data-name="${esc(p.name)}">解除</button>` : ""}
          </li>`).join("") + `</ul>`
        + (net ? `<p class="set-note">${net}</p>` : "")
        + `<p class="set-note">手机丢了、或者不想让它再连进来，点「解除」，那部手机就再也连不上了。</p>`;
    }
    box.innerHTML = html;
    clearTimeout(relayTimer);
    if (view === "settings") relayTimer = setTimeout(renderRelay, relayQr ? 2000 : 6000);
  }
  $("setBody").addEventListener("click", async e => {
    const b = e.target.closest("button[data-relay]");
    if (!b) return;
    const kind = b.dataset.relay;
    if (kind === "unpair" && !confirm(`解除「${b.dataset.name}」？\n\n解除后这部手机就再也连不上了，要再用得重新扫码。`)) return;
    b.disabled = true;
    try {
      if (kind === "pair") {
        const r = await fetch("/api/relay/pair", { method: "POST" }).then(r => r.json());
        if (r.svg) { relayQr = r; relayDone = ""; }
        else $("relayBox").insertAdjacentHTML("beforeend", `<p class="set-note err">${esc(r.hint || "没出得来二维码，过一会儿再点一次。")}</p>`);
      } else if (kind === "cancel") {
        relayQr = null;
        await fetch("/api/relay/cancel", { method: "POST" });
      } else if (kind === "unpair") {
        relayDone = "";
        await fetch("/api/relay/unpair", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: b.dataset.id }) });
      }
    } catch { }
    if (kind !== "pair" || relayQr) renderRelay();
  });

  // 「在外面也能用」向导。状态全从 /api/tailscale 来，前端只按状态画卡，不自己判断：
  //   没装        → 一键装：服务端下官方安装包并拉起（带进度），失败给官网链接兜底
  //   装了没登录  → 一个「登录」按钮，打开 Tailscale 给的登录网页
  //   通了        → 链接 + 复制 + 手机怎么装
  // 没通之前隔几秒再问一次：装完、登完，卡片自己换过来，用户不用刷新——
  // 装 Tailscale 的人多半不知道「刷新」是什么。
  let tsTimer = 0;
  async function renderTs() {
    const box = $("tsWizard");
    if (!box) return;
    let s;
    try { s = await fetch("/api/tailscale").then(r => r.json()); }
    catch { box.innerHTML = `<p class="set-note">现在看不出装没装，过一会儿再打开这一页。</p>`; return; }
    const inst = s.install || { phase: "idle" };
    const busy = inst.phase === "downloading" || inst.phase === "launching";
    const ok = s.installed && s.state === "running" && s.url;
    let html;
    if (s.viaRelay) {
      html = `<p class="set-note">Tailscale 的链接只在家里那台电脑上显示。</p>`;
    } else if (!s.installed && inst.phase === "downloading") {
      const pct = inst.total ? Math.round(inst.got / inst.total * 100) : 0;
      html = `<p>正在下载 Tailscale 安装包${inst.total ? `：${pct}%` : "…"}</p>
        <div class="ts-prog"><i style="width:${pct}%"></i></div>
        <p class="set-note">三十多 MB，慢的话要一两分钟。别关这一页，也别再点一次。</p>`;
    } else if (!s.installed && (inst.phase === "launching" || inst.phase === "launched")) {
      html = `<p>安装窗口已经弹出来了（可能被这个窗口挡在后面）。按它的提示装完，回到这一页就好。</p>
        <p class="set-note">Windows 会问一句「是否允许此应用更改你的设备」，点「是」。装完它会自己打开登录网页，登一下。</p>`;
    } else if (!s.installed) {
      html = `<div class="set-row"><button class="rite-go" data-ts="install">一键安装 Tailscale</button></div>
        ${inst.phase === "failed"
          ? `<p class="set-note err">刚才没下下来（${esc(inst.error || "网络不通")}）。可以去 <a href="https://tailscale.com/download" target="_blank" rel="noopener">官网下载页</a> 手动装，装完回到这一页。</p>`
          : `<p class="set-note">装的是官方原版安装包，免费。装好登录一次；手机上也装一个、登同一个账号，之后在哪都能连回来。</p>`}`;
    } else if (ok) {
      html = `<p>通了。手机上装好 Tailscale、登同一个账号，然后打开这个链接（打开一次会记住）：</p>
        <div class="set-box" id="setTs">${esc(s.url)}</div>
        <div class="set-row"><button class="set-plain" data-ts="copy" data-url="${esc(s.url)}">复制链接</button></div>
        <details class="set-note"><summary>手机上怎么装</summary>
          <p>iPhone：App Store 搜 Tailscale，或者 <a href="${esc(s.phone.ios)}" target="_blank" rel="noopener">点这里</a>。</p>
          <p>安卓：去 <a href="${esc(s.phone.android)}" target="_blank" rel="noopener">这一页</a> 点最新的 apk 装上（国内手机没有 Google Play，直接装这个）。</p>
          <p>装好后登<b>同一个账号</b>（Google、微软、GitHub、Apple 账号都行，Tailscale 不支持微信登录），把开关打开，再点上面那个链接。</p>
        </details>`;
    } else {
      html = `<p>Tailscale 装好了，还差登录。</p>
        <div class="set-row"><button class="rite-go" data-ts="login">登录 Tailscale</button></div>
        <p class="set-note">会打开一个登录网页，用 Google、微软、GitHub 或 Apple 账号都行（不支持微信）。登完回到这一页，链接就会出现。手机上要登同一个账号。</p>`;
    }
    box.innerHTML = html;
    clearTimeout(tsTimer);
    if (view === "settings" && !ok && !s.viaRelay) tsTimer = setTimeout(renderTs, busy ? 1500 : 4000);
  }
  // 三个按钮都是动态画出来的，事件挂在整页上
  $("setBody").addEventListener("click", async e => {
    const b = e.target.closest("button[data-ts]");
    if (!b) return;
    const kind = b.dataset.ts;
    if (kind === "copy") {
      const url = b.dataset.url || "";
      const done = () => { b.textContent = "已复制 ✓"; setTimeout(() => { b.textContent = "复制链接"; }, 1600); };
      // 手机上走 http 时没有 clipboard API，退回老办法：选中再 execCommand
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => {});
      else {
        const ta = document.createElement("textarea"); ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch { }
        ta.remove();
      }
      return;
    }
    b.disabled = true;
    try {
      if (kind === "install") { await fetch("/api/tailscale/install", { method: "POST" }); }
      else if (kind === "login") {
        const r = await fetch("/api/tailscale/login", { method: "POST" }).then(r => r.json());
        if (r.url) window.open(r.url, "_blank", "noopener");
        else $("tsWizard").insertAdjacentHTML("beforeend", `<p class="set-note err">没拿到登录链接。右下角托盘里找 Tailscale 的图标，点它登录也一样。</p>`);
      }
    } catch { }
    renderTs();
  });

  async function loadSettings() {
    if (!setReady) { renderSettings(); setReady = true; fillTools(); }
    renderAccount();
    // 这个 catch 曾经是光秃秃的 {}，代价是：fillSettings 里一句 ReferenceError
    // 被它整个吞掉，设置页所有已存的值都不显示，而页面一声不吭，整整一版没人发现。
    // 现在至少往控制台留一行——排错的人打开 F12 就看得见。
    try { fillSettings(await fetch("/api/settings").then(r => r.json())); }
    catch (e) { console.error("[设置] 填页面时出错：", e); }
  }

  // ------------------------------------------------------------------ 视图切换
  // 实验功能的开关落到界面上。门枢关着时工作台不显示那一格；正停在门枢里被关掉，就退回术语表。
  function applyFlags(s) {
    const on = !!(s && s.spacesEnabled);
    const btn = document.querySelector('.bench-nav button[data-pane="spaces"]');
    if (btn) btn.hidden = !on;
    if (!on && benchPane === "spaces") { benchPane = "terms"; if (view === "bench") openBench(); }
  }

  // 没配 key 就在对话页顶上挂一条。每次进对话页查一次——配好了这条自己消失，不用刷新
  async function checkKey() {
    try {
      const st = await fetch("/api/settings").then(r => r.json());
      $("noKey").hidden = !!st.keyMasked;
    } catch { }
  }
  $("noKeyGo").addEventListener("click", () => setView("settings"));

  function setView(v) {
    view = v;
    if (v === "chat") checkKey();
    if (v !== "settings") { clearTimeout(tsTimer); clearTimeout(relayTimer); }   // 向导的轮询只在设置页活着
    document.body.className = "view-" + v;
    $("tabRead").classList.toggle("on", v === "read");
    $("tabChat").classList.toggle("on", v === "chat");
    $("tabBench").classList.toggle("on", v === "bench");
    $("tabShop").classList.toggle("on", v === "workshop");
    $("tabSet").classList.toggle("on", v === "settings");
    if (v !== "read") sidebar.classList.remove("open");
    if (v === "chat") {
      // 第一次进来才拉会话列表和内容，之后原样留着
      if (!chatLane.loaded) {
        chatLane.loaded = true;
        loadSessions().then(id => { chatLane.session = id; return loadLane(chatLane, null); });
      } else scrollLane(chatLane);
      if (window.innerWidth > 860) input2.focus();
    }
    // 切走也要把嵌着的页面卸掉，不只是切格子的时候——不然从「门枢」
    // 直接跳去读书，那一屏动画会在后台接着转。
    if (v !== "bench") leaveSpace();
    if (v === "bench") openBench();
    if (v === "settings") loadSettings();
    if (v === "workshop") loadShop(true);
  }
  $("tabRead").addEventListener("click", () => setView("read"));
  $("tabChat").addEventListener("click", () => setView("chat"));
  $("tabBench").addEventListener("click", () => setView("bench"));
  $("tabShop").addEventListener("click", () => setView("workshop"));
  $("tabSet").addEventListener("click", () => setView("settings"));

  // 工作台里的两格。术语表是主业，抽签暂时只是个待开放的壳，
  // 所以默认停在术语表，别让人一进来先看见「还用不了」。
  let benchPane = "terms";
  function openBench() {
    document.querySelectorAll(".bench-nav button").forEach(b =>
      b.classList.toggle("on", b.dataset.pane === benchPane));
    $("paneTerms").hidden = benchPane !== "terms";
    $("paneComponents").hidden = benchPane !== "components";
    $("paneSpaces").hidden = benchPane !== "spaces";
    if (benchPane !== "spaces") leaveSpace();
    if (benchPane === "components") loadComponents();
    else if (benchPane === "spaces") loadSpaces();
    else loadTerms();
  }
  document.querySelector(".bench-nav").addEventListener("click", e => {
    const b = e.target.closest("button[data-pane]");
    if (!b) return;
    benchPane = b.dataset.pane;
    openBench();
  });
  // ☰ 在读书模式开书目录，在对话模式开会话列表——同一个位置，同一个含义
  $("menuBtn").addEventListener("click", () => {
    if (view === "chat") $("sessions").classList.toggle("open");
    else sidebar.classList.toggle("open");
  });

  // 启动落在读书模式，还没打开书，所以读书那条先给个空态提示
  loadLane(readLane, null);
  loadShelf();
  loadShop(false);
  pollJobs();
  // 实验功能的开关在配置里，启动时问一次再决定工作台摆几格
  fetch("/api/settings").then(r => r.json()).then(applyFlags).catch(() => { });
})();
</script>
</body>
</html>
