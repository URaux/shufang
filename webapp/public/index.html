    bad_invite: "邀请串不完整，让对方重新发一次（要一整串，别漏掉开头和结尾）。",
  };

  // 把服务端的 error 代号翻成人话。
  // 有几个老接口把中文直接写在 error 里（比如设置页那两条），那本来就是给人看的，
  // 原样返回；纯英文代号而表里又没有的，返回空串，让调用处退回自己的兜底句子——
  // 宁可说一句笼统的中文，也不能把 github_403 这种东西甩到用户脸上。
  function humanize(code) {
    const c = String(code == null ? "" : code).trim();
    if (!c) return "";
    if (ERR_CN[c]) return ERR_CN[c];
    if (/^github_\d+$/.test(c)) return ERR_CN.repo_not_found_or_no_access;
    return /^[\x20-\x7E]+$/.test(c) ? "" : c;
  }

  // GET 一段 JSON。
  //
  // 原来这些 GET 是 `fetch(u).then(r => r.json())` 直接用的，没有任何检查。
  // 后果是：服务端一旦回的不是 JSON（500 的 HTML 错误页、被代理截胡、被杀毒插一脚），
  // r.json() 当场抛，而调用它的 openBook 又没有 try——于是整个「打开这本书」
  // 无声无息地死在半路，界面上什么都不发生。
  // 用户看到的就是「点了没反应」，而且是**每一本书**都没反应，因为坏的是同一条路。
  // 有用户就这么报上来的：翻完一章之后，书架上哪本都点不开。
  //
  // 现在把三种坏法分开说：连不上、服务端出错、回的东西不是 JSON。
  async function getJson(url) {
    let r;
    try {
      r = await fetch(url);
    } catch {
      throw new Error("跟「群星回廊」断了联系。看看电脑上的启动窗口还开着没有，然后刷新这个页面。");
    }
    const text = await r.text().catch(() => "");
    if (!r.ok) {
      // 服务端给了人话就用它的，没有就说个大概，并且**带上是哪一条路**，
      // 用户截图给站长时那半行字就是线索。
      let hint = "";
      try { hint = (JSON.parse(text) || {}).hint || ""; } catch { }
      throw new Error(hint || `服务端出错了（${r.status}）。把设置页里的日志存到桌面发给站长。`);
    }
    try {
      return JSON.parse(text);
    } catch {
      throw new Error("服务端回的东西看不懂，多半是它自己出错了。把设置页里的日志存到桌面发给站长。");
    }
  }

  async function api(url, body) {
    let r;
    try {
      r = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
    } catch {
      // fetch 只在「根本连不上」的时候抛：程序被关掉了，或者手机跟电脑不在同一个网里。
      // 原样往上抛的话用户看到的是浏览器那句英文的 Failed to fetch。
      throw new Error("跟「群星回廊」断了联系。看看电脑上的启动窗口还开着没有，然后刷新这个页面。");
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.hint || humanize(j.error) || "这一步没做成，稍等一下再试一次。");
    return j;
  }

  // ------------------------------------------------------------------ 书架
  async function loadShelf() {
    const r = await fetch("/api/books").then(r => r.json()).catch(() => ({ books: [] }));
    const parts = ['<div class="side-h">书架</div>'];
    if (!r.books.length) parts.push('<div class="side-item" style="cursor:default;color:var(--ink-mute)">还没有书</div>');
    for (const b of r.books) {
      // 说明书那种只有「译文」没有原书的，标「N 章」会显示成「0 章 · 已翻 5」，看着像坏了
      const meta = b.chapters ? `${b.chapters} 章 · <span class="done">已翻 ${b.translated}</span>` : `${b.translated} 篇`;
      parts.push(`<button class="side-item" data-book="${encodeURIComponent(b.name)}">${esc(b.name)}<small>${meta}</small></button>`);
    }
    parts.push('<button class="side-item upload" id="uploadBook">📕 传一本书</button>');
    parts.push('<div class="side-h">协作</div>');
    parts.push('<button class="side-item" id="joinShared">📥 加入朋友共享的书</button>');
    sidebar.innerHTML = parts.join("");
    if (currentBook) renderBookMenu();
    // 书架上只有说明书那一本（刚装好）时直接翻开它，别让人对着空白页猜该点哪。
    // 只在读书页、且还没打开任何书的时候做——之后的每次刷新书架都不该抢页面。
    if (!currentBook && view === "read" && r.books.length === 1 && r.books[0].name === "怎么用群星回廊") openBook(r.books[0].name);
  }

  // keepChat：这不是「用户点开了一本书」，只是助手干完活后刷新一下目录。
  // 这种时候既不能重载对话（会把刚聊的清掉），也不能跳回默认章节（读者正读着呢）。
  async function openBook(name, opts) {
    const keep = !!(opts && opts.keepChat);
    const wasFile = currentFile;
    // 助手每答完一句都会来刷一次这本书（它可能改了文件）。刷新会重新渲染正文，
    // 而渲染的最后一步是 reader.scrollTop = 0 —— 于是读者每问一句，页面就被
    // 弹回本章开头。这里在重渲染之前先把当前读到的位置记下来，刷完再放回去。
    // 必须在任何 await 之前读：await 之后 DOM 可能已经不是原来那一屏了。
    const keepFrac = keep ? readFrac() : 0;
    try {
      currentBook = await getJson("/api/book?name=" + encodeURIComponent(name));
    } catch (e) {
      // 出错必须落在屏幕上。这一条以前是静默的，用户只知道「点了没反应」。
      reader.innerHTML = `<div class="page"><p>《${esc(name)}》打不开。</p><p>${esc(e.message)}</p></div>`;
      crumb.textContent = name;
      return;
    }
    if (!keep) { collabState = null; loadHistory(name); }
    refreshCollab(name);
    await loadMarks(name);
    renderBookMenu();
    if (keep) {
      if (wasFile) openFile(wasFile, null, keepFrac);   // 停在原来那一章、原来那一处
      return;
    }
    // 上次看到哪儿就从哪儿接着看——这才是重新打开一本书时想要的。
    // 没看过（或者那一章已经不在了）再退回默认：梗概 → 第一章译文 → 第一章原文
    if (autoPos && autoPos.path && await openFile(autoPos.path, docLabel(autoPos.path), autoPos.frac)) return;
    if (currentBook.outline) openFile(`Library/${name}/01-全书梗概.md`, "全书梗概");
    else if (currentBook.translated[0]) openFile(`Library/${name}/译文/${currentBook.translated[0]}`, currentBook.translated[0]);
    else if (currentBook.original[0]) openFile(`Library/${name}/00-原书/${currentBook.original[0]}`, currentBook.original[0]);
  }

  async function refreshCollab(name) {
    try {
      const st = await fetch("/api/collab/state?book=" + encodeURIComponent(name)).then(r => r.json());
      if (currentBook && currentBook.name === name) { collabState = st; renderBookMenu(); }
    } catch { }
  }

  // 「读一遍插图」。要花钱，所以先问一句——问的时候把张数说出来，
  // 用户对「120 张」的感觉比对「一点钱」准得多。
  async function exportBook(btn) {
    if (!currentBook || btn.disabled) return;
    const small = btn.querySelector("small"), was = small.textContent;
    btn.disabled = true; small.textContent = "正在合成，书大的话要一两分钟…";
    try {
      let r;
      try { r = await fetch(`/api/book/export?name=${encodeURIComponent(currentBook.name)}`); }
      catch { toast("跟「群星回廊」断了联系。看看电脑上的启动窗口还开着没有，然后再导一次。"); return; }
      if (!r.ok) { toast((await r.text().catch(() => "")) || "这本书没导出来，过一会儿再试。"); return; }
      const url = URL.createObjectURL(await r.blob());
      const a = Object.assign(document.createElement("a"), { href: url, download: `${currentBook.name}.epub` });
      document.body.appendChild(a); a.click(); a.remove();
      // 立刻 revoke 的话有的浏览器还没开始存就断了
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } finally { btn.disabled = false; small.textContent = was; }
  }

  async function captionBook() {
    const b = currentBook;
    if (!b || !b.name) return;
    if (!confirm(`把《${b.name}》的 ${b.images} 张插图都读一遍？\n\n`
      + `读完的说明会写在图旁边，翻译和聊书时助手就用得上了。\n`
      + `这一步要调用读图模型，会花一点钱。`)) return;
    try {
      await api("/api/job", { kind: "captions", book: b.name });
      // 进度和结果都在任务卡上，跟传书是同一套；这里只负责让它立刻出现
      pollJobs();
    } catch (e) { alert(e.message || "没能开始，稍等一下再试一次。"); }
  }

  async function deleteBook() {
    const name = currentBook && currentBook.name;
    if (!name) return;
    if (!confirm(`把《${name}》从书架上拿掉？\n\n不会真删：它会挪进书库的回收站，想找回去 .群星阅览室/回收站 里看。`)) return;
    try { await api("/api/book/delete", { name }); }
    catch (e) { alert(e.message || "这本书没能拿下书架，稍等一下再试一次。"); return; }
    // 书没了，读书页上还开着它的某一章——最省事也最不会出错的收尾是整页重来
    location.reload();
  }

  function renderBookMenu() {
    const b = currentBook;
    const parts = [
      `<button class="side-item" id="backShelf">← 书架</button>`,
      `<div class="side-h">${esc(b.name)}</div>`,
    ];
    // 全书搜索只搜原文：规格定的「原文是唯一真相」，而且没翻完的书译文是残缺的。
    // 没有原文章节的（纯笔记本之类）不给框，给了也搜不出东西。
    if (b.original.length) {
      parts.push(`<form class="book-search" id="bookSearch"><input type="search" id="bookQ" placeholder="🔍 在原文里搜…" `
        + `value="${esc(lastQuery)}" enterkeyhint="search" autocomplete="off"></form>`);
    }
    // 课程放在最上面：编过课的书，照着课学是主路，梗概和章节是查的时候才翻。
    // 没编过的书在同一个位置给「编成课程」：入口固定在一处，编好了它就地变成「课程」
    const cj = courseJob();
    const cjRun = cj && jobActive(cj);
    const cjNote = cjRun ? (cj.state === "queued" ? "排着队" : `正在编 · ${(cj.progress && cj.progress.pct) || 0}%`) : "";
    if (b.course) parts.push(`<button class="side-item course-entry${coursePage !== null ? " on" : ""}" data-course="1">📚 课程`
      + `<small>${cjNote ? "重新编：" + cjNote : "按课学这本书，引的原文都能点回去"}</small></button>`);
    else if (b.original.length) parts.push(`<button class="side-item course-entry${coursePage !== null ? " on" : ""}" data-course="1">✦ 编成课程`
      + `<small>${cjNote || "把这本书编成一课一课，引的原文都核过"}</small></button>`);
    if (b.outline) parts.push(item(`Library/${b.name}/01-全书梗概.md`, "📖 全书梗概"));
    if (b.summary) parts.push(item(`Library/${b.name}/02-逐章摘要.md`, "🗂 逐章摘要"));
    if (b.translated.length) {
      parts.push('<div class="side-h">译文</div>');
      for (const f of b.translated) parts.push(item(`Library/${b.name}/译文/${f}`, f.replace(/\.md$/, "")));
      // 翻好的拿去别的阅读器看：浏览器直接下载，手机上也一样
      // 不用 <a download> 直接链：导失败时浏览器会把那句中文报错存成一个打不开的 export.txt（2026-10-23 用户截图），
      // 用户看不到原因。先 fetch，成了再交给浏览器下载，没成就弹那句话。
      parts.push(`<button class="side-item" id="exportBook">📦 导出成 epub<small>丢进微信读书、Kindle 都能看</small></button>`);
    }
    if (b.original.length) {
      parts.push('<div class="side-h">原文</div>');
      for (const f of b.original) parts.push(item(`Library/${b.name}/00-原书/${f}`, f.replace(/\.md$/, "")));
    }
    // 插图。这颗按钮只在「这本书有图 + 读图功能开着」时出现：
    // 给用户一个点了只会报错的按钮，比没有按钮更糟。
    // 入库时会自动看一遍，所以这里是给「先攒了书、后来才配读图」的人补的。
    if (b.images && b.visionOn) {
      parts.push('<div class="side-h">插图</div>');
      if (b.captioned) parts.push(item(`Library/${b.name}/插图/图说.md`, "🖼 图说"));
      parts.push(`<button class="side-item" id="capBook">👁 ${b.captioned ? "重新读一遍插图" : "读一遍插图"}`
        + `<small>${b.images} 张 · 要花一点钱</small></button>`);
    }

    for (const [dir, label] of [["笔记", "笔记"], ["讨论", "讨论"]]) {
      const files = b[dir === "笔记" ? "notes" : "discussions"];
      if (files.length) {
        parts.push(`<div class="side-h">${label}</div>`);
        for (const f of files) parts.push(item(`Library/${b.name}/${dir}/${f}`, f.replace(/\.md$/, "")));
      }
    }

    // ---- 书签 ----
    // 「上次看到」单独一条放最上面，它是最常点的那个。
    if (autoPos && autoPos.path) {
      const pct = Math.round((autoPos.frac || 0) * 100);
      parts.push('<div class="side-h">书签</div>');
      parts.push(`<button class="side-item mark-auto" data-jump="${encodeURIComponent(autoPos.path)}" data-frac="${autoPos.frac || 0}">`
        + `🕘 上次看到<small>${esc(docLabel(autoPos.path))}${pct ? " · " + pct + "%" : ""}</small></button>`);
    } else if (marks.length) {
      parts.push('<div class="side-h">书签</div>');
    }
    for (const m of marks) {
      const pct = Math.round((m.frac || 0) * 100);
      const sub = esc(m.note || (docLabel(m.path) + (pct ? " · " + pct + "%" : "")));
      parts.push(`<div class="mark-row"><button class="side-item mark" data-jump="${encodeURIComponent(m.path)}" data-frac="${m.frac || 0}">`
        + `🔖 ${esc(docLabel(m.path))}<small>${sub}</small></button>`
        + `<button class="mark-x" data-unmark="${esc(m.id)}" title="删掉这条书签">×</button></div>`);
    }

    // ---- 划线 ----
    // 划了线的人回头要找的是「我标过的那几句」，而不是「我读到哪一页」，
    // 所以跟书签分开列，并且把原话摆出来 —— 只写章节名等于让人一条条点开找。
    if (hls.length) {
      parts.push(`<div class="side-h">划线 (${hls.length})</div>`);
      for (const h of hls.slice(0, 60)) {
        const head = esc((h.anchor || "").slice(0, 16));
        const sub = esc(h.note || docLabel(h.path));
        parts.push(`<div class="mark-row"><button class="side-item mark" data-hl-jump="${esc(h.id)}">`
          + `<span class="hl-chip ${esc(h.color || "yellow")}"></span>${head}…<small>${sub}</small></button>`
          + `<button class="mark-x" data-hl-del="${esc(h.id)}" title="删掉这道划线">×</button></div>`);
      }
    }

    // ---- 校对协作区 ----
    const cs = collabState;
    if (cs) {
      const open = (cs.suggestions || []).filter(s => s.status === "open");
      const dotCls = cs.state ? cs.state.dot : "gray";
      if (cs.shared) {
        parts.push(`<div class="side-h" style="display:flex;align-items:center;gap:.4rem"><span class="sync-dot ${dotCls}"></span>校对 (${open.length})</div>`);
        for (const s of (cs.suggestions || []).slice(0, 30)) {
          const done = s.status !== "open" ? " sug-done" : "";
          const tag = { accepted: "✅", rejected: "❌", stale: "⏳" }[s.status] || "💬";
          const preview = esc((s.anchor || "").slice(0, 14));
          const chapLabel = esc(String(s.chapter || "").split("/").pop().replace(/\.md$/, ""));
          parts.push(`<button class="side-item${done}" data-sug="${encodeURIComponent(s.id)}">${tag} ${preview}…<span class="sug-meta">${esc(s.author)} · ${chapLabel}</span></button>`);
        }
        if (cs.role === "owner") parts.push(`<button class="side-item" id="showInvite">🔗 邀请朋友</button>`);
        parts.push(`<button class="side-item" id="syncNow">🔄 立即同步</button>`);
      } else if (cs.engine) {
        parts.push('<div class="side-h">校对</div>');
        parts.push(`<button class="side-item" id="shareBook">🤝 共享这本书给朋友</button>`);
      }
    }

    // 放在最底下，离常点的那些远一点。删的是「挪进回收站」，不是真删（见服务端）
    parts.push(`<div class="side-h"></div><button class="side-item" id="delBook" style="color:var(--ink-mute)">🗑 删掉这本书</button>`);
    sidebar.innerHTML = parts.join("");
    function item(p, label) {
      const on = p === currentFile ? " on" : "";
      return `<button class="side-item${on}" data-file="${encodeURIComponent(p)}">${esc(label)}</button>`;
    }
  }

  let fileMd = "", fileMtime = 0, editing = false;

  // ---------------------------------------------------------------- 书签
  //
  // 位置记的是**滚动比例**不是像素：手机和电脑行宽不一样，同一篇文章
  // 两边的总高度差好几倍，记像素等于记了个没用的数。
  //
  // 自动位置（上次看到哪儿）和手动书签（这段我要再回来看）分开存——
  // 混成一个的话，用户加一条书签就会把「上次看到哪儿」顶掉。
  let marks = [], autoPos = null, markPanelOpen = false;

  const readFrac = () => {
    const max = reader.scrollHeight - reader.clientHeight;
    return max > 8 ? Math.min(1, reader.scrollTop / max) : 0;
  };
  const applyFrac = frac => {
    const f = Number(frac) || 0;
    if (f <= 0) { reader.scrollTop = 0; return; }
    // 渲染完到布局稳定有一帧的差，直接设会落空
    requestAnimationFrame(() => {
      const max = reader.scrollHeight - reader.clientHeight;
      reader.scrollTop = max > 0 ? max * f : 0;
    });
  };
  const docLabel = rel => (rel || "").split("/").pop().replace(/\.md$/, "");

  async function loadMarks(book) {
    if (!book) { marks = []; autoPos = null; hls = []; return; }
    try {
      const r = await fetch("/api/bookmarks?book=" + encodeURIComponent(book)).then(r => r.json());
      marks = r.marks || [];
      autoPos = r.auto || null;
      hls = r.hl || [];
    } catch { marks = []; autoPos = null; hls = []; }
  }

  // 滚动就存会把磁盘打满，停下来才存。读者翻页翻得再快，
  // 真正「停在这儿」的位置也就是他不动的那一下。
  let autoTimer = 0;
  function scheduleAutoSave() {
    if (editing || !currentBook || !currentFile) return;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      const body = { book: currentBook.name, path: currentFile, frac: readFrac(), label: docLabel(currentFile) };
      autoPos = { ...body, ts: Date.now() };
      fetch("/api/bookmarks/auto", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).catch(() => { });
    }, 1200);
  }
  reader.addEventListener("scroll", scheduleAutoSave, { passive: true });
  // 关标签页时最后补一次：读者常常是看到一半直接关掉的，
  // 那时上面那个 1.2 秒的延时还没到，最后一段滚动就丢了。
  // 用 sendBeacon 而不是 fetch——页面正在卸载，普通请求会被浏览器掐掉。
  window.addEventListener("pagehide", () => {
    if (editing || !currentBook || !currentFile || !navigator.sendBeacon) return;
    try {
      navigator.sendBeacon("/api/bookmarks/auto", new Blob([JSON.stringify({
        book: currentBook.name, path: currentFile, frac: readFrac(), label: docLabel(currentFile),
      })], { type: "application/json" }));
    } catch { }
  });

  async function addMark() {
    if (!currentBook || !currentFile) return;
    const note = prompt("给这条书签写句话（可以留空）", "") ;
    if (note === null) return;                       // 点了取消
    try {
      const r = await fetch("/api/bookmarks/add", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ book: currentBook.name, path: currentFile,
                               frac: readFrac(), label: docLabel(currentFile), note }),
      }).then(r => r.json());
      if (r.error) { toast(r.hint || humanize(r.error) || "书签没存上，稍等一下再点一次。"); return; }
      marks.unshift(r.mark);
      renderBookMenu();
      toast("书签存好了");
    } catch { toast("书签没存上，跟「群星回廊」断了联系。看看启动窗口还开着没有。"); }
  }

  async function removeMark(id) {
    marks = marks.filter(m => m.id !== id);
    renderBookMenu();
    try {
      await fetch("/api/bookmarks/remove", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
    } catch { }
  }

  async function jumpTo(rel, frac) {
    if (rel !== currentFile) await openFile(rel, undefined, frac);
    else applyFrac(frac);
  }

  // ------------------------------------------------------------------ 划线
  //
  // 锚点是「那段文字 + 它在这一章里是第几次出现」，不是字符偏移 —— 理由写在
  // 服务端 /api/highlights/add 那一段上面。这里只讲前端这一侧的一个坑：
  //
  // **存锚点和找锚点必须用同一个坐标系。** 直觉的写法是存的时候用
  // selection.toString()、找的时候把文字节点拼起来搜 —— 两者对空白的处理不一样
  // （toString 会在块元素之间塞换行，拼接不会），于是存下去的锚点回头自己找不到
  // 自己。所以两边都走 flatten()：把 reader 里所有文字节点原样拼成一条字符串，
  // 存和找都在这条字符串上量。
  let hls = [];

  function flatten(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [], starts = [];
    let full = "", n;
    while ((n = w.nextNode())) {
      if (!n.nodeValue) continue;
      starts.push(full.length); nodes.push(n); full += n.nodeValue;
    }
    return { full, nodes, starts };
  }

  // 摊平坐标 → 具体哪个文字节点的第几个字
  function locate(flat, pos) {
    let lo = 0, hi = flat.nodes.length - 1, best = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (flat.starts[mid] <= pos) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0) return null;
    return [flat.nodes[best], pos - flat.starts[best]];
  }

  // 选区的两头不一定落在文字节点上（三击选一整段就会给元素节点），往里走一步
  function toTextPos(node, offset, isStart) {
    if (node.nodeType === 3) return [node, offset];
    const kid = node.childNodes[isStart ? offset : offset - 1];
    const scope = kid || node;
    if (scope.nodeType === 3) return [scope, isStart ? 0 : scope.nodeValue.length];
    const w = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT);
    let first = null, last = null, n;
    while ((n = w.nextNode())) { if (!first) first = n; last = n; }
    if (!first) return null;
    return isStart ? [first, 0] : [last, last.nodeValue.length];
  }

  function selectionAnchor() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    const rg = sel.getRangeAt(0);
    if (!reader.contains(rg.commonAncestorContainer)) return null;
    const flat = flatten(reader);
    const a = toTextPos(rg.startContainer, rg.startOffset, true);
    const b = toTextPos(rg.endContainer, rg.endOffset, false);
    if (!a || !b) return null;
    const ia = flat.nodes.indexOf(a[0]), ib = flat.nodes.indexOf(b[0]);
    if (ia < 0 || ib < 0) return null;
    let p1 = flat.starts[ia] + a[1];
    const p2 = flat.starts[ib] + b[1];
    if (p2 <= p1) return null;
    let text = flat.full.slice(p1, p2);
    // 两头的空白削掉，起点跟着挪 —— 锚点带着空白，回头就找不着了
    p1 += text.length - text.replace(/^\s+/, "").length;
    text = text.trim();
    if (text.length < 2 || text.length > 300) return null;
    let occ = 0, i = -1;
    while ((i = flat.full.indexOf(text, i + 1)) >= 0 && i < p1) occ++;
    return { text, occ };
  }

  // 把这一章的划线贴回正文。
  // **从后往前贴**：贴一条就会把文字节点切开，前面的位置不受影响、后面的全变。
  // 每贴一条重新摊平一次，位置表才不会是旧的。一章几千字，这点开销看不出来。
  // 把正文里已有的 <mark> 拆掉，还原成干净的文字。
  // normalize() 不能省：surroundContents 会把文字节点切成好几段，不接回去的话
  // 下一轮 flatten 出来的还是碎的，锚点数出来的位置就不对了。
  function stripHighlights(page) {
    for (const mk of [...page.querySelectorAll("mark.hl")]) {
      const p = mk.parentNode;
      if (!p) continue;
      while (mk.firstChild) p.insertBefore(mk.firstChild, mk);
      p.removeChild(mk);
    }
    page.normalize();
  }

  // **这个函数必须是幂等的**：同一份 hls 跑一次和跑十次，正文得一模一样。
  // 每存一条划线就会调它一次，不先拆干净的话，前面那几条会被一层层重复包起来
  // —— 连划十二条之后正文里是 364 个 mark 而不是 12 个，每个拿到的都是半截话。
  function applyHighlights() {
    if (editing || cmpMode || !currentFile) return;
    const page = reader.querySelector(".page");
    if (!page) return;
    stripHighlights(page);
    const mine = hls.filter(h => h.path === currentFile);
    if (!mine.length) return;
    const flat0 = flatten(page);
    const findAt = (flat, h) => {
      let i = -1;
      for (let k = 0; k <= (h.anchorIndex || 0); k++) {
        i = flat.full.indexOf(h.anchor, i + 1);
        if (i < 0) return -1;
      }
      return i;
    };
    const ordered = mine.map(h => ({ h, at: findAt(flat0, h) }))
      .filter(x => x.at >= 0).sort((a, b) => b.at - a.at);
    for (const { h } of ordered) {
      const flat = flatten(page);
      const at = findAt(flat, h);
      if (at < 0) continue;                       // 这段话被改掉了，划线自然消失
      const a = locate(flat, at), b = locate(flat, at + h.anchor.length);
      if (!a || !b) continue;
      // 已经贴在别的划线里面了就跳过。
      // 同一句话被划两次是会发生的（划过了自己忘了，又划一次），那时两条的锚点
      // 完全相同，第二条会把第一条整个包进去 —— 一层套一层，点开拿到的是半截话。
      // 这一条只认「这一趟贴上去的」：正文本来就有的 <mark> 在上面已经拆干净了。
      if (a[0].parentNode && a[0].parentNode.closest && a[0].parentNode.closest("mark.hl")) continue;
      const rg = document.createRange();
      try { rg.setStart(a[0], a[1]); rg.setEnd(b[0], b[1]); } catch { continue; }
      const mk = document.createElement("mark");
      mk.className = "hl " + (h.color || "yellow") + (h.note ? " has-note" : "");
      mk.dataset.hl = h.id;
      if (h.note) mk.title = h.note;
      // surroundContents 碰到跨元素的选区会抛，退回「掏出来再包回去」
      try { rg.surroundContents(mk); }
      catch { try { mk.appendChild(rg.extractContents()); rg.insertNode(mk); } catch { } }
    }
  }

  const hlBar = $("hlBar");
  let pendingSel = null;

  function maybeShowHlBar() {
    hlBar.classList.remove("on");
    if (view !== "read" || editing || cmpMode || !currentBook || !currentFile) return;
    const a = selectionAnchor();
    if (!a) return;
    pendingSel = a;
    const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
    hlBar.style.left = Math.max(8, Math.min(window.innerWidth - 200, r.left + r.width / 2 - 95)) + "px";
    // 摆在选区**上方**：提建议那颗按钮在下方，两个一起冒出来时不打架
    hlBar.style.top = Math.max(8, r.top - 46) + "px";
    hlBar.classList.add("on");
  }
  reader.addEventListener("mouseup", () => setTimeout(maybeShowHlBar, 10));
  reader.addEventListener("touchend", () => setTimeout(maybeShowHlBar, 10));
  document.addEventListener("selectionchange", () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) hlBar.classList.remove("on");
  });

  async function saveHl(color, note) {
    if (!pendingSel || !currentBook || !currentFile) return;
    try {
      const r = await fetch("/api/highlights/add", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          book: currentBook.name, path: currentFile,
          anchor: pendingSel.text, anchorIndex: pendingSel.occ,
          color, note: note || "",
        }),
      }).then(r => r.json());
      if (r.error) { toast(r.hint || "这条划线没存上，再划一次。"); return; }
      hls.unshift(r.mark);
      try { window.getSelection().removeAllRanges(); } catch { }
      applyHighlights();
      if (currentBook) renderBookMenu();
    } catch { toast("没存上，跟「群星回廊」断了联系。看看启动窗口还开着没有。"); }
  }

  hlBar.addEventListener("click", e => {
    const dot = e.target.closest(".dot");
    hlBar.classList.remove("on");
    if (dot) return saveHl(dot.dataset.c, "");
    if (e.target.closest("[data-note]")) {
      const note = prompt("想说点什么（留空也行，就是划一道）", "");
      if (note === null) return;
      return saveHl("yellow", note);
    }
  });

  // 点已有的划线 → 改评论、换颜色、删掉
  reader.addEventListener("click", e => {
    const mk = e.target.closest("mark.hl");
    if (!mk) return;
    const h = hls.find(x => x.id === mk.dataset.hl);
    if (!h) return;
    const m = modal(`
      <h3>这道划线</h3>
      <div class="quote">${esc(h.anchor)}</div>
      <label>你的话</label>
      <textarea id="mNote" rows="3"></textarea>
      <div class="row">
        <button class="plain" id="mDel">删掉</button>
        <button class="plain" id="mCancel">算了</button>
        <button class="primary" id="mOk">存下</button>
      </div>`);
    m.querySelector("#mNote").value = h.note || "";
    m.querySelector("#mCancel").addEventListener("click", closeModal);
    m.querySelector("#mDel").addEventListener("click", async () => {
      closeModal();
      hls = hls.filter(x => x.id !== h.id);
      applyHighlights();                 // 幂等，直接整篇重贴，不手工拆这一个
      if (currentBook) renderBookMenu();
      try {
        await fetch("/api/highlights/remove", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: h.id }),
        });
      } catch { }
    });
    m.querySelector("#mOk").addEventListener("click", async () => {
      const note = m.querySelector("#mNote").value.trim();
      closeModal();
      h.note = note;
      mk.classList.toggle("has-note", !!note);
      mk.title = note;
      if (currentBook) renderBookMenu();
      try {
        await fetch("/api/highlights/note", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: h.id, note }),
        });
      } catch { toast("评论没存上，再点一次。"); }
    });
  });

  // 侧边栏那个叉。只从 hls 里删掉、不重贴的话，这一页上那道线要等翻页回来才消失。
  async function removeHl(id) {
    hls = hls.filter(x => x.id !== id);
    applyHighlights();                   // 同上：改数据 + 重贴，不单独拆某一个
    if (currentBook) renderBookMenu();
    try {
      await fetch("/api/highlights/remove", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
    } catch { }
  }

  // 从侧边栏跳到某一道划线
  async function jumpToHl(id) {
    const h = hls.find(x => x.id === id);
    if (!h) return;
    if (h.path !== currentFile) { cmpMode = false; await openFile(h.path); }
    const mk = reader.querySelector(`mark.hl[data-hl="${h.id}"]`);
    if (mk) {
      mk.scrollIntoView({ block: "center", behavior: "smooth" });
      mk.style.outline = "2px solid rgba(0,0,0,.35)";
      setTimeout(() => { mk.style.outline = ""; }, 1400);
    } else {
      toast("这段话在正文里找不着了 —— 多半是这一章后来改过。");
    }
  }

  // ------------------------------------------------------------------ 全书搜索 / 跳回原文
  //
  // 搜的是服务端的全文索引（每本书一个，原文改了会自己重建）。结果点进去，
  // 落到阅读器里那一章、那一段，高亮一下，并把对齐好的译文摆在它下面。
  // 以后课程里的出处、笔记里引的原文，都走 jumpToPassage 这同一条路。
  let lastQuery = "";

  async function searchBook(q) {
    q = String(q || "").trim();
    lastQuery = q;
    if (!currentBook || !q) return;
    const name = currentBook.name;
    let r;
    try {
      r = await getJson(`/api/book/search?name=${encodeURIComponent(name)}&q=${encodeURIComponent(q)}`);
    } catch (e) {
      toast(e.message);
      return;
    }
    coursePage = null;
    currentFile = null;              // 搜索页不是书里的文件：书签、划线、改一改都不该挂在它上面
    crumb.textContent = `${name} · 搜「${q}」`;
    // 先转义再标黄：原文可能是别人共享过来的，不能让里面的尖括号变成标签
    const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    const items = r.hits.map(h => `<li><button data-pid="${esc(h.id)}">`
      + `<span class="hit-ch">${esc(h.chapter_file.replace(/\.md$/, ""))} · 第 ${h.order} 段</span>`
      + esc(h.snippet).replace(re, m => `<mark>${m}</mark>`) + `</button></li>`).join("");
    const note = !r.hits.length ? "原文里没搜到。换个说法，或者少打几个字试试。"
      : `找到 ${r.hits.length}${r.more ? "+" : ""} 处${r.more ? "，只列出前 " + r.hits.length + " 处，换个更具体的词能缩小范围" : ""}。点一下跳到原文那一段。`;
    reader.innerHTML = `<div class="page"><h2>搜「${esc(q)}」</h2><p class="search-note">${esc(note)}</p>`
      + `<ol class="search-hits">${items}</ol></div>`;
    reader.scrollTop = 0;
    sidebar.classList.remove("open");
  }

  // 按段落 ID 跳到原文。段落里写的是 markdown，页面上是渲染过的 html，两边不能直接比；
  // 都只留字母和数字再比开头一截——星号、井号、标点、空格这些渲染时会变的东西全不看。
  const passageKey = s => String(s || "").normalize("NFKC").replace(/[^\p{L}\p{N}]/gu, "");

  async function jumpToPassage(book, id) {
    if (!book || !id) return;
    let r;
    try {
      r = await getJson(`/api/passage?book=${encodeURIComponent(book)}&id=${encodeURIComponent(id)}`);
    } catch (e) {
      toast(e.message);
      return;
    }
    if (r.path !== currentFile && !(await openFile(r.path))) {
      toast("这一章打不开了，刷新一下页面再试。");
      return;
    }
    const probe = passageKey(r.text).slice(0, 24);
    // 从细到粗找：先段落、标题、列表项，最后才是引用块整块
    const blocks = reader.querySelectorAll(".page p, .page h1, .page h2, .page h3, .page h4, .page h5, .page h6, .page li, .page pre, .page blockquote");
    const el = probe && [...blocks].find(b => passageKey(b.textContent).includes(probe));
    if (!el) {
      toast("这一段在正文里没找着——可能这一章刚被改过。");
      return;
    }
    el.dataset.pid = r.id;
    reader.querySelectorAll(".passage-hit").forEach(x => x.classList.remove("passage-hit", "fade"));
    reader.querySelectorAll(".passage-zh").forEach(x => x.remove());
    el.classList.add("passage-hit");
    // 规格第 3 节：证据段落要原文和译文一起看。没翻的章也说一声，不然读者以为是漏了。
    // 原书本来就是中文的，没有译文可言，什么都不摆（服务端按整章汉字比例判的）。
    if (r.zh || r.needsTranslation !== false) {
      const zh = document.createElement("div");
      zh.className = "passage-zh";
      zh.innerHTML = r.zh
        ? `<small>对应的译文</small>${esc(r.zh)}`
        : `<small>这一章还没翻译，只有原文。</small>`;
      el.after(zh);
    }
    el.scrollIntoView({ block: "center" });
    setTimeout(() => el.classList.add("fade"), 1800);
    if (r.moved) toast("这段原文后来改过，已经跳到改过之后的那一段。");
  }
  window.jumpToPassage = jumpToPassage;   // 给以后的课程页、笔记里的出处链接用

  // ------------------------------------------------------------------ 课程
  //
  // 课程编纂器编好的课：目录 → 一课 → 知识卡，点「原文」跳回书里那一段。
  // 就画在阅读区里，不另开视图：课文跟原文来回跳是常事，同一个滚动区里切最不容易迷路。
  // 「返回」自己记一条栈，不走浏览器历史——这个页面别处都没用 history，
  // 只在课程里接管后退键，用户退出课程时反而会被困在里面。
  let coursePage = null;        // 正在看的课程页（"" = 目录）；不在课程里是 null
  let courseStack = [];

  const courseBar = (back, where) => `<nav class="c-top"><button ${back}>← ${back === "data-course" ? "课程目录" : "返回"}</button>`
    + (where ? `<span class="c-where">${esc(where)}</span>` : "") + `</nav>`;

  async function openCourse() {
    if (!currentBook) return;
    // 还没编过、或者正在编：先到「编成课程」那一页（说明、估价、进度都在那儿）
    const cj = courseJob();
    if (!currentBook.course || (cj && jobActive(cj))) return openCourseMake();
    let r;
    try { r = await getJson("/api/course/outline?book=" + encodeURIComponent(currentBook.name)); }
    catch (e) { toast(e.message); return; }
    const n = r.units.reduce((k, u) => k + u.lessons.length, 0);
    let no = 0;
    const units = r.units.map((u, ui) => `<section class="c-unit"><h2>${esc(u.title)}<small>第 ${ui + 1} 单元</small></h2><ol class="c-lessons">`
      + u.lessons.map(l => `<li><button class="c-lesson" data-cpage="${esc(l.file)}"><span class="c-ln">${++no}</span>`
        + `<span><b>${esc(l.title)}</b><small>${esc(l.goal || "")}</small></span></button></li>`).join("")
      + `</ol></section>`).join("");
    // 「先试一章」编出来的课程要明说：不然读的人以为整本就这几课
    const trial = r.scope && r.scope.length
      ? `<div class="cc-box warn">这是试编的：只编了第 ${r.scope.map(esc).join("、")} 章。觉得好，再把整本编出来。`
        + `<div class="cc-go" style="margin:.6rem 0 0"><button class="primary" data-cc="estimate" data-scope="all">编整本…</button></div></div>` : "";
    // 「其余词汇」附录：哪一课都没讲到的词，列在最后，不让它们悄悄消失
    const extras = r.extras && r.extras.count
      ? `<section class="c-unit"><h2>附录</h2><ol class="c-lessons"><li><button class="c-lesson" data-cpage="${esc(r.extras.file)}"><span class="c-ln">词</span>`
        + `<span><b>其余词汇</b><small>书里提到、没有哪一课专门讲的 ${r.extras.count} 个词，按拼音排</small></span></button></li></ol></section>` : "";
    // 课程编纂从原文括注里收了几个译名，放在译名表的「待定」组里，等用户看一眼
    const drafts = r.draftTerms
      ? `<p class="cc-foot">发现 ${r.draftTerms} 个待定译名：课程编纂从原文的括注里收的，放在这本书译名表的「待定」组里，没盖掉你定过的。`
        + `<button class="c-link" data-cc="terms" style="min-height:44px">去译名表看看</button></p>` : "";
    showCourse("", `<h1>课程</h1><p class="c-sub">${r.units.length} 个单元、${n} 课，${r.cards} 张知识卡。`
      + `课里引的每一句原文都核对过出处，点句子后面的「原文」能跳回书里那一段。</p>${drafts}${trial}${units}${extras}`
      + (trial ? "" : `<p class="cc-foot" style="margin-top:2rem">原文改过、或者想换个编法，可以<button class="c-link" data-cc="estimate" data-scope="all" style="min-height:44px">重新编一遍</button>。没改过的部分不会重复花钱。</p>`)
      // 「导出给自己」默认不给，配置里开了才出现（见 server.js /api/course/export）
      + (r.exportEnabled ? `<p class="cc-foot"><button class="c-link" data-cc="export" style="min-height:44px">导出给自己</button>：写成普通的 markdown，每页开头标着「导出给自己用」。</p>` : ""), "课程");
    courseStack = [];
  }

  // ------------------------------------------------------------------ 编成课程
  //
  // 编纂是服务端的后台作业（kind=course，底下是 course/run.js），跟「翻译本章」同一套：
  // 进度挂在 /api/jobs 上，刷新、换手机看都还在。这一页只做三件事：
  //   开编前：说清楚会得到什么，点「编成课程…」弹出估价（花多少、多久、哪个模型），确认了才开始；
  //   编的时候：七个人话步骤 + 真进度条 + 「停下」；
  //   停下 / 出错后：「接着编」——同样再走一遍估价，做过的部分有缓存，估价里只算剩下的。
  // 没填 key（订阅模式）不支持，按钮置灰并说清楚为什么、去哪儿填。
  let coursePlan = null;    // 最近一次 /api/course/plan 的结果

  function courseJob() {
    if (!currentBook) return null;
    return jobList.find(j => j.kind === "course" && j.book === currentBook.name && !j.dismissedLocal) || null;
  }

  async function openCourseMake() {
    if (!currentBook) return;
    try { coursePlan = await getJson("/api/course/plan?book=" + encodeURIComponent(currentBook.name)); }
    catch (e) { toast(e.message); return; }
    showCourse("@make", `<div data-ccmake="1">${courseMakeInner()}</div>`, "编成课程");
  }

  function courseMakeInner() {
    const b = currentBook, p = coursePlan || {};
    const steps = p.steps || [];
    const j = courseJob();
    const bar = currentBook.course ? courseBar("data-course", "") : "";
    if (j && jobActive(j)) {
      const pr = j.progress || {};
      const pct = pr.pct || 0;
      const mins = j.startedAt ? Math.floor((Date.now() - j.startedAt) / 60000) : 0;
      const list = steps.map((s, i) => {
        const cls = j.state === "queued" ? "" : i < pr.step ? "done" : i === pr.step ? "now" : "";
        const ic = cls === "done" ? "✓" : cls === "now" ? "●" : "○";
        return `<li class="${cls}"><span class="ic">${ic}</span><span>${esc(s)}${cls === "now" && pr.detail ? `<small>${esc(pr.detail)}</small>` : ""}</span></li>`;
      }).join("");
      const head = j.state === "queued" ? `排着队${j.ahead ? `，前面还有 ${j.ahead} 件` : "，马上开始"}`
        : j.cancelling ? "正在停下…（等已经发出去的几问回来，结果存好，下次接着编就不重复花钱）"
        : `第 ${(pr.step || 0) + 1}/${steps.length || 7} 步 · ${esc(pr.stepName || "")}`;
      return bar + `<h1>正在编课程</h1>`
        + `<p class="c-sub">${j.scope ? `先试一章：第 ${j.scope.map(esc).join("、")} 章` : "整本"}${mins >= 1 ? ` · 已经 ${mins} 分钟` : ""}${j.etaMin ? ` · 估计 ${esc(j.etaMin)} 分钟左右` : ""}</p>`
        + `<div class="cc-pct"><span>${head}</span><b>${pct}%</b></div>`
        + `<div class="prog${j.state === "queued" ? " wait" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>`
        + `<ol class="cc-steps">${list}</ol>`
        + `<div class="cc-go">${j.cancelling ? `<button disabled>正在停…</button>` : `<button data-cc="stop" data-id="${esc(j.id)}">停下</button>`}</div>`
        + `<p class="cc-foot">可以关掉这一页去读书，编好了会在对话里告诉你。中途停下也不要紧：做完的部分都存着，接着编不重复花钱。</p>`;
    }
    if (j && j.state === "done") {
      return `<h1>课程编好了</h1><p class="c-sub">${esc(j.units)} 个单元、${esc(j.lessons)} 课，${esc(j.cards)} 张知识卡。课里引的每一句原文都核对过出处。</p>`
        + `<div class="cc-go"><button class="primary" data-course="1">去看课程</button></div>`;
    }
    const why = `<p class="c-sub">把《${esc(b.name)}》编成一个个单元、一课一课：先讲什么、后讲什么按概念的先后排好，`
      + `每一课引的原文都由程序回书里核对过，点一下就跳回那一段。还附一套知识卡（概念、人物、技法……）。</p>`
      + `<p class="cc-foot">编好的课程加密存在这本书的「课程」文件夹里，只能在群星回廊里打开；拷到别的电脑上打不开，在那边重新编一次就行。</p>`;
    if (!p.keyed) {
      return bar + `<h1>编成课程</h1>${why}<div class="cc-box warn">${esc(p.hint || "编纂课程要用 API key，在设置里填一个就能用。")}`
        + `<br><span class="cc-foot">用自己订阅的助手（没填 key）时一问一答太慢，整本书要问上千次，暂时不支持。</span></div>`
        + `<div class="cc-go"><button class="primary" data-cc="settings">去设置里填 key</button><button disabled>编成课程…</button></div>`;
    }
    // 别的电脑上编的、绑定过群星账号：先登录，不然开编会把做过的部分当没做、整本再花一遍钱
    if (p.needAccount) {
      return bar + `<h1>编成课程</h1>${why}<div class="cc-box warn">这本书是在别的电脑上编的，绑定过群星账号。`
        + `在「设置 → 群星账号」里登录同一个账号，就能直接打开、接着用，不用重编。</div>`
        + `<div class="cc-go"><button class="primary" data-cc="settings">去绑定群星账号</button></div>`;
    }
    const last = p.estimate && p.estimate.resume;
    const failed = j && j.state === "failed";
    let resume = "";
    if (last || failed) {
      const where = last ? `上次编到第 ${last.step + 1} 步「${esc(last.stepName)}」` : "上次没编完";
      resume = `<div class="cc-box warn">${where}就停了${last && last.scope ? `（试编第 ${last.scope.map(esc).join("、")} 章）` : ""}。`
        // 出错的原因要说（「账上没钱了」「连不上」），用户自己点的「停下」就不必再念一遍
        + `已经做完的部分都存着，接着编不重复花钱。${failed && j.error && !/停下/.test(j.error) ? `<br><span class="cc-foot">${esc(j.error)}</span>` : ""}`
        + `<div class="cc-go" style="margin:.6rem 0 0"><button class="primary" data-cc="estimate" data-scope="${last && last.scope ? esc(last.scope.join(",")) : "all"}">接着编…</button>`
        + (failed ? `<button data-cc="dismiss" data-id="${esc(j.id)}">知道了</button>` : "") + `</div></div>`;
    }
    return bar + `<h1>编成课程</h1>${why}${resume}`
      + (resume ? "" : `<div class="cc-go"><button class="primary" data-cc="estimate">编成课程…</button></div>`
        + `<p class="cc-foot">点了先告诉你要花多少钱、多少时间，确认了才开始。也可以先拿一章试试。</p>`);
  }

  // 轮询回来只换这一页的内容，不重画别的
  function refreshCourseMake() {
    const box = coursePage === "@make" && reader.querySelector("[data-ccmake]");
    if (box) box.innerHTML = courseMakeInner();
  }

  // 估价弹窗。scope: "all" | "3"（章号）| undefined（默认整本）
  async function courseEstimate(scopeArg) {
    if (!currentBook) return;
    const book = currentBook.name;
    const get = ch => getJson(`/api/course/plan?book=${encodeURIComponent(book)}${ch ? "&chapter=" + ch : ""}`);
    let plan;
    try { plan = await get(scopeArg && scopeArg !== "all" ? scopeArg.split(",")[0] : ""); }
    catch (e) { toast(e.message); return; }
    coursePlan = plan;
    if (!plan.keyed) { refreshCourseMake(); return toast(plan.hint || "编纂课程要用 API key，在设置里填一个就能用。"); }
    const chs = plan.chapters || [];
    // 「先试一章」默认挑一章不太短的（一千五百字以上里最短的那章）：太短的章抽不出东西，看不出效果
    const pick = (chs.filter(c => c.chars >= 1500).sort((a, b) => a.chars - b.chars)[0] || chs[0] || {}).no;
    let scope = scopeArg && scopeArg !== "all" ? Number(scopeArg.split(",")[0]) : null;
    const wan = n => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + " 万字" : n + " 字";
    const resuming = !!(plan.estimate && plan.estimate.resume);
    const m = modal(`<h3>把《${esc(book)}》编成课程</h3>
      <div class="cc-scope">
        <label><input type="radio" name="ccScope" value="all"${scope ? "" : " checked"}> 整本（${chs.length} 章，${wan(chs.reduce((n, c) => n + c.chars, 0))}）</label>
        <label><input type="radio" name="ccScope" value="one"${scope ? " checked" : ""}> 先试一章：
          <select id="ccCh">${chs.map(c => `<option value="${c.no}"${c.no === (scope || pick) ? " selected" : ""}>第 ${c.no} 章 ${esc(c.name).slice(0, 18)}（${wan(c.chars)}）</option>`).join("")}</select></label>
      </div>
      <div class="cc-est" id="ccEst">正在算…</div>
      <p class="hint">编的时候随时可以停下；停下后做完的部分都存着，接着编不重复花钱。</p>
      <div class="row"><button class="plain cc-btn" id="ccNo">算了</button><button class="primary cc-btn" id="ccGo" disabled>开始编</button></div>`);
    const estBox = m.querySelector("#ccEst"), go = m.querySelector("#ccGo");
    let cur = plan, seq = 0;
    const draw = () => {
      const e = cur.estimate;
      const replacing = scope && cur.hasCourse && !cur.courseScope;
      // 下限不到一毛（多半是做过的部分都有缓存）就只说上限，「¥0–0.3」看着像算错了
      const yuan = e.yuan[0] < 0.1 ? `不到 ¥${e.yuan[1]}` : `¥${e.yuan[0]}–${e.yuan[1]}`;
      estBox.innerHTML = `大约调用模型 <b>${e.calls}</b> 次 · 花 <b>${yuan}</b> · 用时 <b>${e.minutes[0]}–${e.minutes[1]} 分钟</b>`
        + `<br><span class="mute">模型：${esc(e.modelNames.join("、"))}。${e.deepseek ? "按 DeepSeek 白天的价格估的，夜里跑大约便宜一半。" : "按 DeepSeek 的价格估的；你用的模型不同，实际以那边的账单为准。"}</span>`
        + (e.chunks && e.chunksLeft < e.chunks ? `<br><span class="mute">其中 ${e.chunks - e.chunksLeft}/${e.chunks} 块上次已经读过，不再花钱。</span>` : "")
        + (e.resumeStep ? `<br><span class="mute">上次编到第 ${e.resumeStep + 1} 步，前面几步做完了，只算剩下的。</span>` : "")
        + (replacing ? `<br><b>注意：</b>这本书已经编好了整本课程，只试一章会把它换掉。` : "");
      go.textContent = `${resuming && e.resume && e.resume.sameScope ? "接着编" : "开始编"}（最多约 ¥${e.yuan[1]}）`;
      go.disabled = false;
      go.dataset.replace = replacing ? "1" : "";
      go.dataset.eta = e.minutes[1];
    };
    const reload = async () => {
      const my = ++seq;
      go.disabled = true; estBox.textContent = "正在算…";
      try { const r = await get(scope || ""); if (my === seq) { cur = r; draw(); } }
      catch (err) { if (my === seq) estBox.textContent = err.message; }
    };
    draw();
    m.querySelectorAll("input[name=ccScope]").forEach(x => x.addEventListener("change", () => {
      scope = x.value === "one" && x.checked ? Number(m.querySelector("#ccCh").value) : null; reload();
    }));
    m.querySelector("#ccCh").addEventListener("change", ev => {
      m.querySelector("input[value=one]").checked = true; scope = Number(ev.target.value); reload();
    });
    m.querySelector("#ccNo").addEventListener("click", closeModal);
    go.addEventListener("click", async () => {
      go.disabled = true;
      try {
        const r = await api("/api/job", { kind: "course", book, confirm: true, chapters: scope ? [scope] : null,
          replace: go.dataset.replace === "1", etaMin: Number(go.dataset.eta) || 0 });
        closeModal();
        if (r && r.job) jobList = [r.job, ...jobList.filter(x => x.id !== r.job.id)];
        await openCourseMake();
        renderJobs();
      } catch (err) { go.disabled = false; toast(err.message); }
      pollJobs();
    });
  }

  async function openCoursePage(rel, back) {
    if (!currentBook) return;
    let r;
    try { r = await getJson(`/api/course/page?book=${encodeURIComponent(currentBook.name)}&path=${encodeURIComponent(rel)}`); }
    catch (e) { toast(e.message); return; }
    if (!back && coursePage !== null && coursePage !== rel) courseStack.push(coursePage);
    const nav = r.kind !== "lesson" ? "" : `<nav class="c-pager">`
      + (r.prev ? `<button data-cpage="${esc(r.prev.file)}"><small>上一课</small>← ${esc(r.prev.title)}</button>` : "")
      + (r.next ? `<button class="next" data-cpage="${esc(r.next.file)}"><small>下一课</small>${esc(r.next.title)} →</button>` : "")
      + `</nav>`;
    // 课文一律给「课程目录」：从目录点进来、或者上一课下一课翻过来，想回的都是目录；
    // 卡片是从课里点进来的，「返回」回到刚才那一课
    const top = r.kind === "lesson" ? courseBar("data-course", `第 ${r.no} / ${r.total} 课`)
      : courseBar(courseStack.length ? "data-cup" : "data-course", r.kind === "card" ? "知识卡" : "");
    showCourse(rel, top + (r.kind === "lesson" ? `<p class="c-unitname">${esc(r.unit)}</p>` : "") + r.html + nav, r.title);
    if (r.kind === "lesson") courseStack = [];
  }

  function showCourse(rel, html, label) {
    reader.innerHTML = `<div class="page course">${html}</div>`;
    currentFile = null;              // 课程页不是书里的一章：书签、划线、改一改都不挂在它上面
    coursePage = rel;
    crumb.textContent = `${currentBook.name} · ${label}`;
    reader.scrollTop = 0;
    sidebar.classList.remove("open");
    renderBookMenu();
  }

  // 从课里点「原文」：先记下课文读到哪儿，跳过去之后在原文页顶上钉一条「回到这一课」
  async function jumpFromCourse(pid) {
    const from = { rel: coursePage, top: reader.scrollTop, stack: courseStack.slice() };
    await jumpToPassage(currentBook.name, pid);
    if (!reader.querySelector(".passage-hit")) return;     // 没跳成，页面还是原来那一课
    const page = reader.querySelector(".page");
    const bar = document.createElement("button");
    bar.className = "c-back";
    bar.textContent = "← 回到课文";
    bar.addEventListener("click", async () => {
      await (from.rel ? openCoursePage(from.rel, true) : openCourse());
      courseStack = from.stack;
      reader.scrollTop = from.top;
    });
    page.prepend(bar);
  }

  // ------------------------------------------------------------------ 显示方式
  //
  // 三档：单栏（点哪篇看哪篇，一直以来的样子，也是默认）、双列对照、只看译文。
  // 记在这台设备的浏览器里：手机上爱看译文、电脑上爱看对照的人不少，
  // 记到服务端反而会让两边互相改来改去。
  //
  // 双列对照的数据全在服务端配好（/api/pair，按长度的 DP 对齐，见那一段），
  // 这边只管画：电脑左右两栏各自滚、按对齐的段联动；手机（≤860）并排放不下，
  // 改成一组原文、一组译文交替，整页一起滚 —— 联动在手机上没意义，两栏各占 180 像素宽读不了。
  const READ_MODES = { single: "单栏", pair: "双列对照", zh: "只看译文" };
  let readMode = (() => { try { const m = localStorage.getItem("shufang.readMode"); return READ_MODES[m] ? m : "single"; } catch { return "single"; } })();
  let cmpMode = false;                 // 现在页面上画的是不是双列
  let pairData = null;                 // 上一次 /api/pair 的结果，转屏跨过 860 时重画用
  const isChapter = rel => /\/(00-原书|译文)\//.test(rel || "");
  const chNo = f => (String(f || "").match(/^(\d+)/) || [])[1] || "";
  const narrow = window.matchMedia("(max-width: 860px)");

  // 这一页是第几章、原文译文各在哪。不是书里的章就返回 null（梗概、笔记之类）。
  function chapterOf(rel) {
    if (!currentBook || !isChapter(rel)) return null;
    const no = chNo(rel.split("/").pop());
    if (!no) return null;
    const src = currentBook.original.find(f => chNo(f) === no) || null;
    const zh = currentBook.translated.find(f => chNo(f) === no) || null;
    return {
      no: Number(no), src, zh,
      srcRel: src ? `Library/${currentBook.name}/00-原书/${src}` : null,
      zhRel: zh ? `Library/${currentBook.name}/译文/${zh}` : null,
      onZh: rel.includes("/译文/"),
    };
  }

  // 「只看译文」：点了原文那一章，有译文就换成译文打开
  function preferredRel(rel) {
    if (readMode !== "zh") return rel;
    const c = chapterOf(rel);
    return c && !c.onZh && c.zhRel ? c.zhRel : rel;
  }

  function setReadMode(m) {
    if (!READ_MODES[m] || m === readMode) return;
    readMode = m;
    try { localStorage.setItem("shufang.readMode", m); } catch { }
    if (!currentFile) return;
    // 从「只看译文」切回来，回到原来点的那一篇说不清是哪篇 —— 就停在现在这篇
    openFile(currentFile);
  }

  // 两栏按对齐的组联动：左边第 k 组读到三分之一，右边就停在第 k 组的三分之一处。
  // 不按整栏的滚动比例：译文比原文短三成，长短段一多，比例联动几屏之后就差出好几段。
  function linkGroups(root) {
    const cols = [...root.querySelectorAll(".cmp-split > div")];
    if (cols.length !== 2) return;
    const gs = cols.map(c => [...c.querySelectorAll(":scope > .cmp-g")]);
    // 程序替对面设的那一次 scroll 事件不能再反推回来，否则两栏会互相拉扯着抖
    const skip = [false, false];
    cols.forEach((from, i) => {
      const to = cols[1 - i];
      from.addEventListener("scroll", () => {
        if (skip[i]) { skip[i] = false; return; }
        const y = from.scrollTop;
        let target;
        if (y >= from.scrollHeight - from.clientHeight - 2) target = to.scrollHeight;   // 到底了，对面也到底
        else {
          const a = gs[i], b = gs[1 - i];
          let k = 0;
          for (let n = 0; n < a.length; n++) { if (a[n].offsetTop <= y + 1) k = n; else break; }
          const frac = a[k] ? Math.min(1, (y - a[k].offsetTop) / Math.max(1, a[k].offsetHeight)) : 0;
          target = b[k] ? b[k].offsetTop + frac * b[k].offsetHeight : 0;
        }
        target = Math.max(0, Math.min(Math.round(target), to.scrollHeight - to.clientHeight));
        if (Math.abs(to.scrollTop - target) < 1) return;   // 不动就不会有事件，别留着 skip 吞掉用户下一次滚动
        skip[1 - i] = true;
        to.scrollTop = target;
      }, { passive: true });
    });
    // 指到哪一组，对面那组也亮一下：眼睛找「这句对应哪儿」最快的办法
    root.addEventListener("mouseover", e => {
      const g = e.target.closest(".cmp-g");
      root.querySelectorAll(".cmp-g.hot").forEach(x => x.classList.remove("hot"));
      if (!g) return;
      root.querySelectorAll(`.cmp-g[data-g="${g.dataset.g}"]`).forEach(x => x.classList.add("hot"));
    });
  }

  function renderPair(r) {
    const page = reader.querySelector(".page");
    if (!page || !r) return;
    const nav = chapterNav(currentFile);
    const join = a => a.join("");
    let body;
    if (narrow.matches) {
      body = `<div class="cmp-stack">` + r.groups.map(g =>
        `<div class="cmp-row"><div class="cmp-a">${join(g.s)}</div><div class="cmp-b">${join(g.z)}</div></div>`).join("") + `</div>`;
    } else {
      body = `<div class="cmp-split"><div class="cmp-a">`
        + r.groups.map((g, k) => `<div class="cmp-g" data-g="${k}">${join(g.s)}</div>`).join("")
        + `</div><div class="cmp-b">`
        + r.groups.map((g, k) => `<div class="cmp-g" data-g="${k}">${join(g.z)}</div>`).join("")
        + `</div></div>`;
    }
    page.classList.add("wide");
    page.innerHTML = chapterHead() + editBar() + body + nav;
    if (!narrow.matches) linkGroups(page);
    bindPager();
  }
  narrow.addEventListener("change", () => { if (cmpMode && pairData) renderPair(pairData); });

  async function showPair() {
    const at = currentFile;
    let r;
    try { r = await getJson("/api/pair?path=" + encodeURIComponent(at)); }
    catch (e) { toast("对照打不开：" + e.message); return false; }
    if (currentFile !== at || editing) return false;    // 等对齐的工夫里读者已经翻到别处、或者开始改了
    if (!r || !r.ok) { toast((r && r.reason) || "这一章没法对照。"); return false; }
    cmpMode = true;
    pairData = r;
    renderPair(r);
    reader.scrollTop = 0;
    return true;
  }

  // ------------------------------------------------------------------ 翻译本章
  //
  // 章首那一块：显示方式三档 + 「翻译本章」/「重新翻译」+ 进度。
  // 翻译是服务端的后台作业（kind=translate，底下就是对话里「翻第 N 章」那条 translate.js），
  // 进度从 /api/jobs 来 —— 所以刷新页面、换台设备打开，进度条都还在。
  function chapterJob(no) {
    if (!currentBook) return null;
    return jobList.find(j => j.kind === "translate" && j.book === currentBook.name && j.chapter === no) || null;
  }

  function chapterHead() {
    const c = chapterOf(currentFile);
    if (!c) return "";
    return `<div class="ch-head" data-chhead="1">${chapterHeadInner(c)}</div>`;
  }

  function chapterHeadInner(c) {
    const seg = `<div class="ch-seg" role="group" aria-label="显示方式">` + Object.entries(READ_MODES).map(([k, t]) =>
      `<button data-rmode="${k}" class="${k === readMode ? "on" : ""}" aria-pressed="${k === readMode}">${t}</button>`).join("") + `</div>`;
    const j = chapterJob(c.no);
    const busy = j && (j.state === "running" || j.state === "queued");
    // 失败的那条下面已经有「再试一次」了，上面再摆一颗「翻译本章」是两颗按钮干一件事
    const failedHere = j && j.state === "failed" && !j.dismissedLocal;
    const acts = [];
    if (c.src && !busy && !failedHere) {
      if (c.zh) {
        if (!c.onZh && readMode === "single") acts.push(`<button data-tr="show">看译文</button>`);
        acts.push(`<button data-tr="redo">重新翻译</button>`);
      } else acts.push(`<button class="primary" data-tr="go">翻译本章</button>`);
    }
    let st = "", bad = false;
    if (j && j.state === "queued") {
      st = `<div class="line"><span>排着队${j.ahead ? `，前面还有 ${j.ahead} 件` : "，马上开始"}</span><button data-tr="stop" data-id="${esc(j.id)}">停下</button></div>`;
    } else if (j && j.state === "running") {
      const p = j.progress || {};
      const pct = p.totalChars ? Math.floor(p.doneChars * 100 / p.totalChars) : 0;
      const started = p.total > 0;
      const text = j.cancelling ? "正在停下…"
        : !started ? "正在准备…"
        : `正在翻译第 ${c.no} 章 · 已译 ${p.done}/${p.total} 段 · ${pct}%`;
      st = `<div class="prog${started ? "" : " wait"}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>`
        + `<div class="line"><span>${text}<span class="mute">　翻完之前，原来的${c.zh ? "译文" : "页面"}一个字都不动</span></span>`
        + (j.cancelling ? "" : `<button data-tr="stop" data-id="${esc(j.id)}">停下</button>`) + `</div>`;
    } else if (j && j.state === "failed" && !j.dismissedLocal) {
      bad = true;
      st = `<div class="line"><span>⚠️ 第 ${c.no} 章没翻成：${esc(j.error || "中途出岔子了。")}</span>`
        + `<button class="primary" data-tr="retry">再试一次</button><button data-tr="dismiss" data-id="${esc(j.id)}">知道了</button></div>`;
    } else if (j && j.state === "done" && !j.dismissedLocal && c.zh && Date.now() - (j.endedAt || 0) < 10 * 60000) {
      st = `<div class="line"><span>✓ 第 ${c.no} 章翻好了${j.newTerms ? `，新收了 ${j.newTerms} 个专名进译名表` : ""}。</span>`
        + (!c.onZh && readMode === "single" ? `<button class="primary" data-tr="show">看译文</button>` : "")
        + `<button data-tr="dismiss" data-id="${esc(j.id)}">知道了</button></div>`;
    } else if (!c.zh && readMode !== "single") {
      st = `<span class="mute">这一章还没有译文，先给你看原文。</span>`;
    }
    return `<div class="ch-row">${seg}<div class="ch-act">${acts.join("")}</div></div>`
      + `<div class="ch-st${bad ? " bad" : ""}">${st}</div>`;
  }

  // 轮询回来只换章首那一块，不重画正文：重画会把读者的滚动位置和划线都弄丢
  function refreshChapterHead() {
    const box = reader.querySelector("[data-chhead]");
    const c = box && chapterOf(currentFile);
    if (c) box.innerHTML = chapterHeadInner(c);
  }

  async function startTranslate(force) {
    const c = chapterOf(currentFile);
    if (!c || !currentBook) return;
    if (force && !confirm(`重新翻译第 ${c.no} 章？\n\n现在的译文会被新译文整个换掉，你在网页里改过的地方也会跟着没了。\n翻译会调用模型，花一点钱。`)) return;
    try {
      const r = await api("/api/job", { kind: "translate", book: currentBook.name, chapter: c.no, force: !!force });
      // 先把这一条塞进列表，章首立刻变成进度条；不然要等下一轮轮询才有反应，像没点上
      if (r && r.job) { jobList = [r.job, ...jobList.filter(x => x.id !== r.job.id)]; refreshChapterHead(); renderJobs(); }
    } catch (e) { toast(e.message); }
    pollJobs();
  }

  reader.addEventListener("click", async e => {
    const m = e.target.closest("[data-rmode]");
    if (m) { setReadMode(m.dataset.rmode); return; }
    const t = e.target.closest("[data-tr]");
    if (!t) return;
    const c = chapterOf(currentFile);
    const act = t.dataset.tr;
    if (act === "go") return startTranslate(false);
    if (act === "redo") return startTranslate(true);
    if (act === "retry") return startTranslate(!!(c && c.zh));
    if (act === "show") { if (c && c.zhRel) openFile(c.zhRel); return; }
    t.disabled = true;
    try {
      if (act === "stop") await api("/api/job/cancel", { id: t.dataset.id });
      if (act === "dismiss") {
        const j = jobList.find(x => x.id === t.dataset.id);
        if (j) j.dismissedLocal = true;
        refreshChapterHead();
        await api("/api/job/dismiss", { id: t.dataset.id });
      }
    } catch (err) { toast(err.message); }
    pollJobs();
  });

  // 返回是否真的打开了。调用方要能分辨「文件没了」——
  // 书签指向的章节可能已经被重命名或删掉，那时得退回默认章节，
  // 不然读者点开一本书看到的是一片空白，还以为软件坏了。
  async function openFile(rel, label, frac) {
    const want = preferredRel(rel);
    if (want !== rel) { rel = want; label = null; }   // 换成了译文，原来那个标签说的是原文
    let r;
    try {
      r = await getJson("/api/file?path=" + encodeURIComponent(rel));
    } catch (e) {
      // 跟 openBook 同一个道理：以前这儿抛出去就没人接，界面上一片安静。
      reader.innerHTML = `<div class="page"><p>这一篇打不开。</p><p>${esc(e.message)}</p></div>`;
      return false;
    }
    if (r.error) return false;
    coursePage = null;
    cmpMode = false;
    pairData = null;
    currentFile = rel;
    fileMd = r.md || "";
    fileMtime = r.mtime || 0;
    editing = false;
    crumb.textContent = (currentBook ? currentBook.name + " · " : "") + (label || rel.split("/").pop().replace(/\.md$/, ""));
    const nav = chapterNav(rel);
    reader.innerHTML = `<div class="page">${chapterHead()}${editBar()}${r.html}${nav}</div>`;
    applyHighlights();
    reader.scrollTop = 0;
    if (currentBook) renderBookMenu();
    sidebar.classList.remove("open");
    bindPager();
    // 双列对照：单栏先画出来（对齐要服务端算一下，别让人对着空白等），配好了再换成两栏。
    // 没有译文的章就停在单栏原文上，章首会说一句「还没有译文」。
    const c = readMode === "pair" ? chapterOf(rel) : null;
    // 要两边都有：说明书那种只有译文、没有原书的，一打开就弹「没法对照」只会烦人
    if (c && c.src && c.zh && await showPair()) return true;
    if (frac) applyFrac(frac);
    return true;
  }

  // ---------------------------------------------------------------- 自己改
  // 机翻出来的东西一定有要改的地方，而想改的人往往正是不会用命令行、
  // 也不会专门去装 Obsidian 的那批。改不了，这软件就只剩「看个大概」。
  // 所以给一个文本框就够了——不做富文本编辑器，不做实时预览。
  // 装了 Obsidian 就多给一条路：书库本来就是个 Obsidian vault，
  // 点过去就有双链、大纲、图谱和全文搜索，比我们自己造编辑器强得多。
  // 没装就不显示——点了没反应的按钮比没有按钮更糟。
  let obsidian = { ok: false, vault: "" };
  fetch("/api/status").then(r => r.json())
    .then(s => { obsidian = { ok: !!s.obsidian, vault: s.vaultName || "" }; })
    .catch(() => { });

  function obsidianHref(rel) {
    // 外接条目不在书库里，Obsidian 那边根本没有这个文件——
    // 给出去只会是一个点了没反应的按钮，比没有按钮更糟。
    if (!obsidian.ok || !obsidian.vault || !rel || rel.startsWith("@")) return "";
    return "obsidian://open?vault=" + encodeURIComponent(obsidian.vault)
      + "&file=" + encodeURIComponent(rel.replace(/\.md$/, ""));
  }

  const editBar = () => {
    const href = obsidianHref(currentFile);
    return `<div class="editbar"><button data-edit="1">✏️ 改一改</button>`
      + (currentBook ? `<button data-mark="1">🔖 加书签</button>` : "")
      // 原来这里有一颗「⇄ 中英对照」，现在并进了章首的显示方式（单栏 / 双列对照 / 只看译文）
      // Obsidian 只认它自己「打开过」的库。第一次点没反应不是坏了，
      // 是那边还不知道有这么个库——把这句写在悬停提示里，省一次求助。
      + (href ? `<a class="obs" href="${href}" title="第一次用要先在 Obsidian 里「打开文件夹作为库」选中你的书库">在 Obsidian 里打开</a>` : "")
      + `</div>`;
  };

  function enterEdit() {
    if (!currentFile) return;
    editing = true;
    const page = reader.querySelector(".page");
    if (!page) return;
    page.innerHTML =
      `<div class="editbar"><button data-save="1">保存</button>` +
      `<button data-cancel="1">不改了</button>` +
      `<span class="edittip">改完记得保存。想让助手帮你改，就在右边直接说。</span></div>` +
      `<textarea id="editor" spellcheck="false"></textarea>`;
    const ta = $("editor");
    ta.value = fileMd;
    ta.focus();
    ta.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveEdit(); }
    });
  }

  async function saveEdit() {
    const ta = $("editor");
    if (!ta) return;
    const btn = reader.querySelector("[data-save]");
    if (btn) { btn.disabled = true; btn.textContent = "保存中…"; }
    let r = null, why = "";
    try {
      r = await api("/api/file", { path: currentFile, md: ta.value, mtime: fileMtime });
    } catch (e) {
      // api() 遇到非 2xx 会抛，服务端的 hint 就在 message 里——那句话正是
      // 用户唯一看得懂的部分（比如「文件刚被助手改过」），不能吞掉
      why = (e && e.message) || "";
    }
    if (btn) { btn.disabled = false; btn.textContent = "保存"; }
    if (!r || !r.ok) {
      alert(why || "没能存进去，稍后再试。你的文字还在框里，可以先复制一份。");
      return;
    }
    fileMd = ta.value;
    fileMtime = r.mtime || 0;
    editing = false;
    const page = reader.querySelector(".page");
    // 双列里点「改一改」改的是点进来的那一篇；存完回到双列，两边都是新的
    if (cmpMode) { await showPair(); return; }
    if (page) page.innerHTML = chapterHead() + editBar() + r.html + chapterNav(currentFile);
    // 存完是整段重画的，划线跟着没了 —— 而这一页说的是「只要那句话还在，划线就还在」。
    // 改一个错别字回来发现五条划线全不见了，用户只会当成丢数据。
    // 锚点认的是文字不是位置，所以重贴就能原样回来（改掉的那一句除外，那本该消失）。
    applyHighlights();
    bindPager();
  }

  async function courseAction(el) {
    const act = el.dataset.cc;
    if (act === "estimate") return courseEstimate(el.dataset.scope);
    if (act === "settings") return setView("settings");
    if (act === "terms") { $("tabBench").click(); return; }
    if (act === "export") {
      if (!confirm("把课程导出成普通的 markdown，放在这本书的「课程-导出给自己」文件夹里？\n\n每一页开头都会标明「导出给自己用」和这台电脑的标识，请勿外传。")) return;
      try { const r = await api("/api/course/export", { book: currentBook.name }); toast(`导出好了，一共 ${r.files} 个文件，在这本书的「${r.folder}」文件夹里。`); }
      catch (err) { toast(err.message); }
      return;
    }
    el.disabled = true;
    try {
      if (act === "stop") {
        const j = jobList.find(x => x.id === el.dataset.id);
        if (j) j.cancelling = true;
        refreshCourseMake();
        await api("/api/job/cancel", { id: el.dataset.id });
      }
      if (act === "dismiss") {
        const j = jobList.find(x => x.id === el.dataset.id);
        if (j) j.dismissedLocal = true;
        await api("/api/job/dismiss", { id: el.dataset.id });
        return openCourseMake();
      }
    } catch (err) { toast(err.message); }
    pollJobs();
  }

  reader.addEventListener("click", e => {
    const el = e.target.closest("[data-edit],[data-save],[data-cancel],[data-mark],[data-pid],[data-cpage],[data-course],[data-cup],[data-cc]");
    if (!el) return;
    if (el.dataset.cpage) return openCoursePage(el.dataset.cpage);
    if (el.hasAttribute("data-course")) return openCourse();
    if (el.dataset.cc) return courseAction(el);
    if (el.hasAttribute("data-cup")) {
      const prev = courseStack.pop();
      return prev ? openCoursePage(prev, true) : openCourse();
    }
    if (el.dataset.pid && coursePage !== null) return jumpFromCourse(el.dataset.pid);
    if (el.dataset.pid) return jumpToPassage(currentBook && currentBook.name, el.dataset.pid);
    if (el.dataset.edit) return enterEdit();
    if (el.dataset.save) return saveEdit();
    if (el.dataset.mark) return addMark();
    if (el.dataset.cancel) { editing = false; openFile(currentFile); }
  });

  // 上一章/下一章：在当前文件所属列表(译文或原文)里找邻居
  function chapterNav(rel) {
    if (!currentBook) return "";
    const inTrans = rel.includes("/译文/"), inOrig = rel.includes("/00-原书/");
    if (!inTrans && !inOrig) return "";
    const list = inTrans ? currentBook.translated : currentBook.original;
    const fname = rel.split("/").pop();
    const i = list.indexOf(fname);
    if (i < 0) return "";
    const dir = inTrans ? "译文" : "00-原书";
    const mk = (f, t) => f ? `<button data-nav="${encodeURIComponent(`Library/${currentBook.name}/${dir}/${f}`)}">${t}</button>` : `<button disabled>${t}</button>`;
    return `<div class="pager">${mk(list[i - 1], "← 上一章")}${mk(list[i + 1], "下一章 →")}</div>`;
  }
  function bindPager() {
    reader.querySelectorAll("[data-nav]").forEach(b =>
      b.addEventListener("click", () => openFile(decodeURIComponent(b.dataset.nav))));
  }

  sidebar.addEventListener("submit", e => {
    if (e.target.id !== "bookSearch") return;
    e.preventDefault();
    searchBook(($("bookQ") || {}).value || "");
  });

  sidebar.addEventListener("click", e => {
    const el = e.target.closest("[data-book],[data-file],[data-course],[data-sug],[data-jump],[data-unmark],[data-hl-jump],[data-hl-del],#backShelf,#joinShared,#shareBook,#showInvite,#syncNow,#uploadBook,#delBook,#capBook,#exportBook");
    if (!el) return;
    // 删按钮压在跳转按钮上面，先判它，否则点叉会顺带跳过去
    if (el.dataset.unmark) { removeMark(el.dataset.unmark); return; }
    if (el.dataset.hlDel) { removeHl(el.dataset.hlDel); return; }
    if (el.dataset.hlJump) { jumpToHl(el.dataset.hlJump); return; }
    if (el.dataset.jump) { jumpTo(decodeURIComponent(el.dataset.jump), Number(el.dataset.frac) || 0); return; }
    if (el.id === "uploadBook") { pickFile(); return; }
    if (el.id === "backShelf") { currentBook = null; currentFile = null; collabState = null; loadHistory(null); loadShelf(); return; }
    if (el.id === "delBook") { deleteBook(); return; }
    if (el.id === "capBook") { captionBook(); return; }
    if (el.id === "exportBook") { exportBook(el); return; }
    if (el.id === "joinShared") { joinWizard(); return; }
    if (el.id === "shareBook") { shareWizard(); return; }
    if (el.id === "showInvite") { showInvite(); return; }
    if (el.id === "syncNow") { syncNow(); return; }
    if (el.dataset.course) { openCourse(); return; }
    if (el.dataset.sug) { openSuggestionCard(decodeURIComponent(el.dataset.sug)); return; }
    if (el.dataset.book) openBook(decodeURIComponent(el.dataset.book));
    else openFile(decodeURIComponent(el.dataset.file));
  });

  // ------------------------------------------------------------------ 弹窗
  const modalHost = $("modalHost");
  const suggestBtn = $("suggestBtn");

  function modal(html) {
    modalHost.innerHTML = `<div class="modal-wrap"><div class="modal-back"></div><div class="modal">${html}</div></div>`;
    modalHost.querySelector(".modal-back").addEventListener("click", closeModal);
    return modalHost.querySelector(".modal");
  }
  function closeModal() { modalHost.innerHTML = ""; }

  // 署名：所有协作/发布动作的前置。没有就先要一个。
  let knownAuthor = null;
  async function needAuthor() {
    const have = (collabState && collabState.author) || knownAuthor;
    if (have) return have;
    return new Promise(resolve => {
      const m = modal(`
        <h3>先留个名字</h3>
        <p>让朋友知道是谁提的意见、谁发的插件。就填平时叫你的名字，不是账号。</p>
        <input id="mAuthor" maxlength="24" placeholder="比如：小王" />
        <div class="row"><button class="plain" id="mCancel">算了</button><button class="primary" id="mOk">好了</button></div>`);
      m.querySelector("#mCancel").addEventListener("click", () => { closeModal(); resolve(null); });
      m.querySelector("#mOk").addEventListener("click", async () => {
        const v = m.querySelector("#mAuthor").value.trim();
        if (!v) return;
        try {
          await api("/api/collab/author", { author: v });
          knownAuthor = v;
          if (collabState) collabState.author = v;
          closeModal(); resolve(v);
        } catch (e) { alert(e.message); }
      });
      m.querySelector("#mAuthor").focus();
    });
  }

  // ------------------------------------------------------------------ 校对协作
  // ---- 选中译文 → 提建议 ----
  reader.addEventListener("mouseup", () => setTimeout(maybeShowSuggestBtn, 10));
  reader.addEventListener("touchend", () => setTimeout(maybeShowSuggestBtn, 10));
  document.addEventListener("selectionchange", () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) suggestBtn.style.display = "none";
  });

  function maybeShowSuggestBtn() {
    suggestBtn.style.display = "none";
    if (view !== "read") return;
    if (!collabState || !collabState.shared) return;
    if (!currentFile || !currentFile.includes("/译文/")) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    const text = sel.toString().trim();
    if (!text || text.length < 2 || text.length > 300) return;
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    suggestBtn.style.left = Math.max(8, rect.left + rect.width / 2 - 50) + "px";
    suggestBtn.style.top = Math.min(window.innerHeight - 48, rect.bottom + 8) + "px";
    suggestBtn.style.display = "block";
    suggestBtn._anchor = text;
  }

  suggestBtn.addEventListener("click", async () => {
    const anchor = suggestBtn._anchor;
    suggestBtn.style.display = "none";
    if (!anchor || !(await needAuthor())) return;

    // 第几处出现：数选区之前的渲染文本里同串出现了几次
    let anchorIndex = 0;
    try {
      const sel = window.getSelection();
      const rng = sel.getRangeAt(0);
      const pre = document.createRange();
      pre.selectNodeContents(reader);
      pre.setEnd(rng.startContainer, rng.startOffset);
      const before = pre.toString();
      let c = 0, i = -1;
      while ((i = before.indexOf(anchor, i + 1)) >= 0) c++;
      anchorIndex = c;
    } catch { }

    const m = modal(`
      <h3>提个建议</h3>
      <div class="quote">${esc(anchor)}</div>
      <label>改成这样（可以空着，只说问题也行）</label>
      <textarea id="mProposed" rows="3"></textarea>
      <label>为什么</label>
      <textarea id="mReason" rows="2"></textarea>
      <div class="row"><button class="plain" id="mCancel">算了</button><button class="primary" id="mOk">提交</button></div>`);
    m.querySelector("#mCancel").addEventListener("click", closeModal);
    m.querySelector("#mOk").addEventListener("click", async () => {
      const proposed = m.querySelector("#mProposed").value.trim();
      const reason = m.querySelector("#mReason").value.trim();
      if (!proposed && !reason) { alert("「改成这样」和「为什么」至少填一个。"); return; }
      const chapter = currentFile.replace(`Library/${currentBook.name}/`, "");
      try {
        await api("/api/collab/suggest", { book: currentBook.name, chapter, anchor, anchorIndex, proposed, reason });
        closeModal();
        refreshCollab(currentBook.name);
      } catch (e) { alert(e.message); }
    });
  });

  // ---- 建议卡片 ----
  function openSuggestionCard(id) {
    const s = (collabState && collabState.suggestions || []).find(x => x.id === id);
    if (!s) return;
    const isOwner = collabState.role === "owner";
    const statusLabel = { open: "待处理", accepted: "已采纳", rejected: "未采纳", stale: "译文已变，建议失效" }[s.status] || s.status;
    const when = String(s.created || "").slice(0, 16).replace("T", " ");
    const buttons = s.status === "open"
      ? (isOwner
        ? `<button class="danger" id="mReject">不采纳</button>` +
          (s.proposed ? `<button class="primary" id="mAccept">采纳（改进译文）</button>` : "") +
          `<button class="plain" id="mSecond">👍 附议</button>`
        : `<button class="plain" id="mSecond">👍 附议</button>`)
      : "";
    const m = modal(`
      <h3>${esc(s.author)} 的建议 <span class="hint">（${esc(statusLabel)}）</span></h3>
      <label>原文</label><div class="quote">${esc(s.anchor)}</div>
      ${s.proposed ? `<label>建议改为</label><div class="quote">${esc(s.proposed)}</div>` : ""}
      ${s.reason ? `<label>理由</label><p>${esc(s.reason)}</p>` : ""}
      ${s.body ? `<p class="hint">${esc(s.body)}</p>` : ""}
      <p class="hint">${esc(String(s.chapter || ""))} · ${esc(when)}</p>
      <div class="row"><button class="plain" id="mClose">关闭</button>${buttons}</div>`);
    m.querySelector("#mClose").addEventListener("click", closeModal);
    const act = async (action) => {
      try {
        const r = await api("/api/collab/decide", { book: currentBook.name, id, action });
        closeModal();
        await refreshCollab(currentBook.name);
        if (r.status === "accepted" && s.chapter) openFile(`Library/${currentBook.name}/${s.chapter}`);
        if (r.status === "stale") alert("这段译文后来改过了，原句已经找不到，这条建议标为失效。");
      } catch (e) { alert(e.message); }
    };
    const acceptBtn = m.querySelector("#mAccept");
    if (acceptBtn) acceptBtn.addEventListener("click", () => act("accept"));
    const rejectBtn = m.querySelector("#mReject");
    if (rejectBtn) rejectBtn.addEventListener("click", () => act("reject"));
    const secondBtn = m.querySelector("#mSecond");
    if (secondBtn) secondBtn.addEventListener("click", async () => {
      if (!(await needAuthor())) return;
      try { await api("/api/collab/second", { book: currentBook.name, id }); closeModal(); refreshCollab(currentBook.name); }
      catch (e) { alert(e.message); }
    });
  }

      <p class="hint">⚠️ 这串字里带着仓库钥匙，别发到大群里。发错了可以去 GitHub 把 token 撤销掉再重新生成。</p>

  // ---- 加入向导（朋友）----

      <h3>加入朋友共享的书</h3>
