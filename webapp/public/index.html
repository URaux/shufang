<meta name="theme-color" content="#1f1b16" />
<style>
  /* 全站一套米纸色配色；组件只认变量。 */
  :root {
    --paper: #faf7f0; --card: #ffffff; --ink: #2b2820; --ink-soft: #57503f;
    --ink-mute: #8a8170; --line: #e5dfd0; --accent: #8c6a2d; --accent-soft: #c89a4a;
    --chat-bg: #f3efe5; --user-bubble: #e9e0c8; --bot-bubble: #ffffff;
    --bubble-shadow: 0 1px 2px rgba(90,70,30,.08);
    /* 下面几个原来是写死的浅色，夜间要跟着换（见「夜间」那一段） */
    --code-bg: #f0ead9; --hit-bg: #FDF0B8; --link: #8c6a2d; --img-tile: transparent; --img-pad: 0px;
  }
  /* 全站一套配色。切视图只换布局（三栏 ↔ 居中单列），不换颜色——
     换主题看着像跳到了另一个软件里。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    background: var(--paper); color: var(--ink); display: flex; flex-direction: column;
    transition: background .22s ease, color .22s ease;
  }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  header {
    display: flex; align-items: center; gap: .6rem; padding: .55rem .9rem;
    border-bottom: 1px solid var(--line); background: var(--card); flex-shrink: 0;
    transition: background .22s ease, border-color .22s ease;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: .1em; }
  header .crumb { color: var(--ink-mute); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  /* 奠城颂的印（丙式·星斗），挨着名字。站上丙式是挂在页脚右角的，这软件没有页脚，
     侧栏又是 innerHTML 整块重画的（挂进去下一次渲染就没了）、切到别的视图还藏起来——
     四个视图里一直在、又不挡操作的只有顶栏名字旁边这一处。
     不用甲式（钉右下角）：那里是对话页的「发送」键。 */
  header .gx-seal--c.gx-hd { width: 22px; height: 22px; margin: 0 0 0 -.2rem; flex-shrink: 0; opacity: .55; }
  .tabs { display: flex; gap: .3rem; flex-shrink: 0; }
  .tabs button { padding: .3rem .8rem; border-radius: 999px; font-size: .85rem; color: var(--ink-mute); white-space: nowrap; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .tabs .dot { display: none; width: 6px; height: 6px; border-radius: 50%; background: #c25549; margin-left: .3rem; vertical-align: middle; }
  .tabs button.has-new .dot { display: inline-block; }

  main { flex: 1; display: flex; min-height: 0; }

  /* 书架 + 章节列表 */
  #sidebar {
    width: 240px; flex-shrink: 0; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--card); padding: .8rem .6rem;
  }
  .side-h { font-size: .78rem; letter-spacing: .15em; color: var(--ink-mute); margin: .8rem .4rem .35rem; }
  .side-item {
    display: block; width: 100%; text-align: left; padding: .42rem .55rem;
    border-radius: 6px; font-size: .92rem; line-height: 1.4; color: var(--ink-soft);
  }
  .side-item:hover { background: var(--paper); }
  .side-item.on { background: var(--user-bubble); color: var(--ink); }
  .side-item small { color: var(--ink-mute); display: block; font-size: .75rem; }
  .side-item .done { color: var(--accent); }

  /* 书签：删按钮平时不显形，鼠标移上去才出来——
     一列书签每条挂个红叉太吵，而且手机上很容易误触。
     触屏没有 hover，所以窄屏下常驻显示（见下面的窄屏分支）。 */
  .mark-row { display: flex; align-items: center; gap: .2rem; }
  .mark-row .side-item { flex: 1; min-width: 0; }
  .mark-x {
    flex: none; width: 1.5rem; height: 1.5rem; line-height: 1; border: 0; border-radius: 4px;
    background: none; color: var(--ink-mute); font-size: 1rem; cursor: pointer;
    opacity: 0; transition: opacity .12s;
  }
  .mark-row:hover .mark-x { opacity: 1; }
  .mark-x:hover { background: var(--paper); color: #c25549; }
  .side-item.mark-auto { color: var(--ink); }

  /* 阅读区 */
  #reader { flex: 1; overflow-y: auto; min-width: 0; }
  #reader .page { max-width: 46rem; margin: 0 auto; padding: 2.2rem 1.4rem 5rem; }
  /* 原书里抽出来的插图。老书的图常常只有两三百像素宽，放大了糊，所以不强行撑满，
     只封一个上限；比正文窄的就按原大小居中。手机上按屏宽收。 */
  #reader .page img { display: block; max-width: 100%; height: auto; margin: 1.2em auto; border-radius: 4px; }
  /* 夜间：原书插图多是白底黑线（印记、符号、字母表），直接放在深底上黑线就看不见了；
     也不能反色（反了颜色，彩图和照片就全错了）。垫一块米纸色的底，跟日间看到的是同一张图 */
  #reader .page img { background: var(--img-tile); padding: var(--img-pad); box-sizing: content-box; max-width: calc(100% - 2 * var(--img-pad)); }
  #reader .page img[alt]:not([alt=""]) { margin-bottom: .4em; }
  #reader .page p > img + em { display: block; text-align: center; color: var(--ink-mute); font-size: .86rem; }
  .msg.md img { max-width: 100%; height: auto; border-radius: 4px; }
  .editbar { display: flex; align-items: center; gap: .5rem; margin: -.8rem 0 1.4rem; flex-wrap: wrap; }
  .editbar button { font: inherit; font-size: .85rem; padding: .3rem .8rem; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .editbar button:hover { background: var(--card); color: var(--ink); border-color: var(--accent-soft); }
  .editbar button[disabled] { opacity: .5; cursor: default; }
  .edittip { font-size: .8rem; color: var(--ink-soft); }
  .editbar a.obs { font-size: .85rem; padding: .3rem .8rem; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-soft); text-decoration: none; }
  .editbar a.obs:hover { background: var(--card); color: var(--ink); border-color: var(--accent-soft); }
  /* 编辑框用等宽字体：改译文常要对齐标记和缩进，比例字体下看不准 */
  #editor { width: 100%; min-height: 60vh; box-sizing: border-box; padding: 1rem;
    font: 1rem/1.75 ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: .5rem; resize: vertical; }
  #editor:focus { outline: 2px solid var(--accent, #8a6a3b); outline-offset: -1px; }
  #reader h1, #reader h2, #reader h3 { line-height: 1.4; margin: 1.6em 0 .6em; font-weight: 600; }
  #reader h1 { font-size: 1.55rem; } #reader h2 { font-size: 1.25rem; } #reader h3 { font-size: 1.05rem; }
  #reader p { line-height: 2; margin: .9em 0; font-size: 1.02rem; }
  #reader blockquote { border-left: 3px solid var(--accent-soft); padding-left: 1em; color: var(--ink-soft); margin: 1em 0; }
  #reader li { line-height: 1.9; margin: .3em 0 .3em 1.4em; }
  #reader code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; background: var(--code-bg); padding: .1em .3em; border-radius: 3px; }
  #reader table { border-collapse: collapse; margin: 1em 0; width: 100%; }
  #reader th, #reader td { border: 1px solid var(--line); padding: .4em .7em; font-size: .92rem; }
  .pager { display: flex; justify-content: space-between; margin-top: 3rem; gap: 1rem; }
  .pager button { color: var(--accent); font-size: .95rem; padding: .5rem .8rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .empty { color: var(--ink-mute); text-align: center; padding: 5rem 1rem; line-height: 2; }

  /* 侧栏聊天（读书视图里的那条） */
  #chat {
    width: 380px; flex-shrink: 0; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--chat-bg); min-height: 0;
  }
  #msgs { flex: 1; overflow-y: auto; padding: 1rem .9rem; display: flex; flex-direction: column; gap: .7rem; }
  .msg { max-width: 92%; padding: .55rem .8rem; border-radius: 10px; font-size: .93rem; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 3px; box-shadow: var(--bubble-shadow); }
  .msg.status { align-self: flex-start; background: none; color: var(--ink-mute); font-size: .8rem; padding: 0 .3rem; box-shadow: none; }
  #composer { display: flex; gap: .5rem; padding: .7rem; border-top: 1px solid var(--line); background: var(--card); }
  #composer textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 8px;
    padding: .55rem .7rem; font-family: inherit; font-size: .95rem; line-height: 1.5;
    background: var(--paper); color: var(--ink); max-height: 7.5rem;
  }
  #composer textarea:focus { outline: 2px solid var(--accent-soft); }
  #sendBtn, #sendBtn2 { background: var(--accent); color: #fff; border-radius: 8px; padding: 0 1.1rem; font-size: .95rem; flex-shrink: 0; }
  #sendBtn:disabled, #sendBtn2:disabled { opacity: .5; cursor: default; }
  /* 图没找到时那行小字：说清楚是哪一张，但别打断阅读 */
  .img-missing { display: inline-block; padding: .15rem .5rem; border: 1px dashed var(--line);
                 border-radius: 6px; color: var(--ink-mute); font-size: .82rem; }
  /* 修工具时把命令原文摊在这里。等宽 + 可滚，别撑破卡片 */
  .set-log { margin: .7rem 0 0; padding: .6rem .7rem; background: var(--code-bg); border-radius: 6px;
             font-family: ui-monospace, Consolas, monospace; font-size: .74rem; line-height: 1.6;
             white-space: pre-wrap; word-break: break-all; max-height: 16rem; overflow: auto; color: var(--ink-soft); }
  /* 助手在写的时候这颗键是「停下」：换个颜色，免得跟平时的发送看混 */
  #sendBtn.stopping, #sendBtn2.stopping { background: #8a6f52; }

  /* 对话视图：居中单列（与读书的三栏区分靠布局，不靠配色） */
  #chatview { flex: 1; min-width: 0; flex-direction: row; background: var(--paper); }
  #chatMain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #chatScroll { flex: 1; overflow-y: auto; }
  /* 会话列表：跟网页版聊天一个位置和一个习惯，左边一列，最新的在上面 */
  #sessions { width: 15rem; flex-shrink: 0; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow-y: auto; padding: .8rem .6rem; gap: .5rem; }
  #newSession { font: inherit; font-size: .9rem; padding: .5rem; border-radius: .5rem;
    border: 1px dashed var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  #newSession:hover { border-style: solid; color: var(--ink); border-color: var(--accent-soft); }
  #sessionList { display: flex; flex-direction: column; gap: .15rem; }
  .sess { display: flex; align-items: center; gap: .3rem; border-radius: .45rem; padding: .1rem .1rem .1rem .5rem; }
  .sess:hover { background: var(--card); }
  .sess.on { background: var(--card); box-shadow: inset 2px 0 0 var(--accent); }
  .sess .name { flex: 1; min-width: 0; font: inherit; font-size: .88rem; text-align: left;
    background: none; border: 0; color: var(--ink); cursor: pointer; padding: .45rem 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .act { opacity: 0; font-size: .8rem; background: none; border: 0; cursor: pointer;
    color: var(--ink-mute); padding: .3rem .2rem; }
  .sess:hover .act, .sess.on .act { opacity: 1; }
  .sess .act:hover { color: var(--ink); }
  .sess-empty { font-size: .82rem; color: var(--ink-mute); padding: .4rem .5rem; line-height: 1.7; }
  .col { max-width: 880px; margin: 0 auto; padding: 0 1.2rem; }
  #chatBody { display: flex; flex-direction: column; gap: 1rem; padding-top: 1.8rem; padding-bottom: 2.5rem; }
  #chatBody .msg { max-width: 88%; padding: .75rem 1.05rem; border-radius: 14px; font-size: 1rem; line-height: 1.9; }
  #chatBody .msg.bot { border: 1px solid var(--line); }
  #chatBody .msg.status { border: 0; padding: 0 .4rem; font-size: .85rem; }
  .msg.md { white-space: normal; }
  .msg.md > *:first-child { margin-top: 0; }
  .msg.md > *:last-child { margin-bottom: 0; }
  .msg.md p { margin: .7em 0; }
  .msg.md h1, .msg.md h2, .msg.md h3 { font-size: 1.08rem; margin: 1.1em 0 .5em; font-weight: 600; }
  .msg.md ul, .msg.md ol { margin: .6em 0 .6em 1.3em; }
  .msg.md li { margin: .25em 0; }
  .msg.md code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; background: var(--code-bg); border: 1px solid var(--line); padding: .08em .35em; border-radius: 4px; }
  .msg.md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .85rem; overflow-x: auto; margin: .8em 0; }
  .msg.md pre code { background: none; border: 0; padding: 0; font-size: .85em; line-height: 1.7; }
  .msg.md blockquote { border-left: 3px solid var(--accent-soft); padding-left: .9em; color: var(--ink-soft); margin: .8em 0; }
  .msg.md a { color: var(--accent); }
  .msg.md table { border-collapse: collapse; margin: .8em 0; width: 100%; }
  .msg.md th, .msg.md td { border: 1px solid var(--line); padding: .35em .6em; font-size: .92em; }
  .msg.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  #chatComposer { border-top: 1px solid var(--line); background: var(--card); padding: .9rem 0 1.1rem; flex-shrink: 0; }
  #chatComposer .col { display: flex; gap: .6rem; align-items: flex-end; flex-wrap: wrap; }
  #chatComposer textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    padding: .7rem .9rem; font-family: inherit; font-size: 1rem; line-height: 1.7;
    background: var(--paper); color: var(--ink); max-height: 12rem; min-height: 5.4rem;
  }
  #chatComposer textarea:focus { outline: 2px solid var(--accent-soft); }
  #sendBtn2 { height: 2.6rem; }
  .chat-hint { color: var(--ink-mute); font-size: .78rem; padding: .45rem 0 0; text-align: right; }

  /* 工坊视图 */
  #workshop { flex: 1; overflow-y: auto; min-width: 0; }
  .wk-subs { display: flex; flex-direction: column; gap: .3rem; margin: 0 0 1.2rem; }
  .wk-sub { font-size: .85rem; color: var(--ink-soft); padding: .3rem .7rem; border-radius: .4rem;
    background: var(--chat-bg); border-left: 2px solid var(--line); }
  .wk-sub.ok { border-left-color: #4a7c4e; }
  .wk-sub.no { border-left-color: #b4442a; }
  .wk-tier { font-size: .76rem; padding: .08rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-mute); white-space: nowrap; }
  .wk-tier.official { border-color: var(--accent); color: var(--accent); }
  .wk-page { max-width: 900px; margin: 0 auto; padding: 2rem 1.3rem 4rem; }
  .wk-page h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: .4rem; }
  .wk-page .lead { color: var(--ink-soft); font-size: .92rem; line-height: 1.9; margin-bottom: 1.6rem; }
  .wk-entries { display: flex; gap: 1rem; flex-wrap: wrap; }
  .wk-entry {
    flex: 1 1 260px; text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 1.1rem 1.2rem; line-height: 1.7;
  }
  .wk-entry:hover { border-color: var(--accent-soft); }
  .wk-entry b { display: block; font-size: 1rem; margin-bottom: .25rem; }
  .wk-entry span { color: var(--ink-mute); font-size: .85rem; }
  .wk-bar { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
  .wk-bar .title { font-size: .95rem; color: var(--ink-soft); display: flex; align-items: center; gap: .45rem; }
  .wk-bar .spacer { flex: 1; }
  .wk-bar button { border: 1px solid var(--line); border-radius: 8px; padding: .38rem .85rem; font-size: .86rem; color: var(--ink-soft); background: var(--card); }
  .wk-bar button:hover { border-color: var(--accent-soft); }
  .wk-bar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .wk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
  .wk-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.05rem; display: flex; flex-direction: column; }
  .wk-name { font-size: 1rem; font-weight: 600; line-height: 1.5; word-break: break-word; }
  .wk-ver { font-size: .72rem; color: var(--ink-mute); font-weight: 400; margin-left: .35rem; }
  .wk-by { color: var(--ink-mute); font-size: .78rem; margin: .2rem 0 .5rem; }
  .wk-desc { color: var(--ink-soft); font-size: .88rem; line-height: 1.8; flex: 1; word-break: break-word; white-space: pre-wrap; }
  .wk-act { display: flex; gap: .5rem; margin-top: .9rem; flex-wrap: wrap; }
  .wk-act button { border-radius: 8px; padding: .32rem .8rem; font-size: .84rem; border: 1px solid var(--line); color: var(--ink-soft); }
  .wk-act button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .wk-act button.on { color: var(--accent); border-color: var(--accent-soft); }
  .wk-act button.danger { color: #a3453a; border-color: #c9a09a; }
  .wk-empty { color: var(--ink-mute); text-align: center; padding: 3.5rem 1rem; line-height: 2; }

  /* 视图切换：谁显示谁不显示 */
  #chatview, #workshop, #bench, #settings { display: none; }
  body.view-chat #sidebar, body.view-chat #reader, body.view-chat #chat,
  body.view-workshop #sidebar, body.view-workshop #reader, body.view-workshop #chat,
  body.view-bench #sidebar, body.view-bench #reader, body.view-bench #chat,
  body.view-settings #sidebar, body.view-settings #reader, body.view-settings #chat { display: none; }
  body.view-chat #chatview { display: flex; }
  body.view-workshop #workshop { display: block; }
  /* flex:1 不能少：main 是横向 flex 容器，少了这一块只占内容宽高——
     设置页会缩在左边一条，工作台会收成半屏、下面留一大片空白。 */
  body.view-settings #settings { display: block; overflow-y: auto; flex: 1; min-width: 0; }
  body.view-bench #bench { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }

  /* 工作台：读书和对话之外的家伙什都放这儿。
     原来这一格叫「仪轨」，只装得下求签；术语表进来之后那名字就盖不住了。 */
  .bench-nav { display: flex; gap: .3rem; padding: .5rem .8rem 0; border-bottom: 1px solid var(--line); flex: none; }
  .bench-nav button { font: inherit; font-size: .92rem; padding: .45rem .95rem; border: none;
    background: transparent; color: var(--ink-mute); cursor: pointer; border-radius: .4rem .4rem 0 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .bench-nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .bench-pane { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  /* 这一行不能省。hidden 属性的 display:none 来自浏览器默认样式表，
     作者样式表里任何一条 display 都压得过它——上面那句 `.bench-pane { display: flex }`
     就把藏起来的那一格又显示回来了，于是两格平分高度，术语表只剩半屏。
     症状是「界面只占上半屏，下面一片空白」，看 CSS 根本看不出来，得去量计算值。 */
  .bench-pane[hidden] { display: none; }
  #paneComponents:not([hidden]) { overflow-y: auto; display: block; }

  /* 术语表 —— 左边一览，右边一条的全部。
     列表要能扫，所以一行只放最要紧的四样；剩下的（禁用译名、来源、全书实例）
     都在右边，点开才看得见。专业译者要的深度和朋友要的清爽，靠这条分界线兼顾。 */
  .tm-bar { flex: none; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
  .tm-bar select, .tm-bar input[type=text], #tmSearch { font: inherit; font-size: .88rem;
    padding: .3rem .5rem; border: 1px solid var(--line); border-radius: .4rem;
    background: var(--card); color: var(--ink); }
  #tmSearch { flex: 1; min-width: 8rem; }
  .tm-chips { display: flex; gap: .25rem; }
  .tm-chips button, .tm-acts button { font: inherit; font-size: .82rem; padding: .28rem .6rem;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    color: var(--ink-soft); cursor: pointer; }
  .tm-chips button.on, .tm-acts button.on { border-color: var(--accent); color: var(--accent); }
  .tm-chips b { font-weight: 600; margin-left: .25rem; opacity: .65; }
  .tm-acts { display: flex; gap: .25rem; margin-left: auto; }

  .tm-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(20rem, 34%) 1fr; }
  .tm-list { overflow-y: auto; border-right: 1px solid var(--line); }
  .tm-detail { overflow-y: auto; padding: 1rem 1.2rem 3rem; }

  .tm-row { display: grid; grid-template-columns: .8rem 1fr auto; gap: .5rem; align-items: baseline;
    padding: .45rem .7rem; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tm-row:hover { background: var(--chat-bg); }
  .tm-row.on { background: var(--user-bubble); }
  .tm-row .dot { font-size: .7rem; line-height: 1.6; color: var(--ink-mute); }
  .tm-row.bad .dot { color: #b4442a; }
  .tm-row .src { font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm-row .zh { font-size: .82rem; color: var(--ink-soft); }
  .tm-row .n { font-size: .75rem; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
  .tm-row.hint .src { opacity: .68; font-style: italic; }
  .tm-empty { padding: 2rem 1rem; text-align: center; color: var(--ink-mute); font-size: .88rem; }

  .tm-detail h3 { margin: 0 0 .1rem; font-size: 1.15rem; font-weight: 600; }
  .tm-detail .meta { font-size: .78rem; color: var(--ink-mute); margin-bottom: 1rem; }
  .tm-f { display: grid; grid-template-columns: 4.2rem 1fr; gap: .45rem .7rem; align-items: center;
    margin-bottom: .9rem; }
  .tm-f label { font-size: .8rem; color: var(--ink-mute); text-align: right; }
  .tm-f input, .tm-f select, .tm-f textarea { font: inherit; font-size: .88rem; width: 100%;
    box-sizing: border-box; padding: .32rem .5rem; border: 1px solid var(--line);
    border-radius: .4rem; background: var(--card); color: var(--ink); }
  .tm-f textarea { resize: vertical; min-height: 2.6rem; }
  .tm-f .row { display: flex; gap: .4rem; }
  .tm-note { font-size: .76rem; color: var(--ink-mute); margin: -.5rem 0 1rem 4.9rem; }
  /* 体系开关：一行一个，勾选框大一点——这是给不用键盘的人点的 */
  .tm-sys { display: flex; align-items: center; gap: .55rem; padding: .35rem 0;
    font-size: .95rem; cursor: pointer; }
  .tm-sys input { accent-color: var(--accent); transform: scale(1.15); }

  .tm-occ { border-top: 1px solid var(--line); margin-top: 1.2rem; padding-top: .9rem; }
  .tm-occ .head { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .7rem;
    font-size: .84rem; color: var(--ink-soft); }
  .tm-occ .head label { margin-left: auto; font-size: .78rem; color: var(--ink-mute); cursor: pointer; }
  .tm-o { border-left: 2px solid var(--line); padding: .35rem 0 .55rem .7rem; margin-bottom: .55rem; }
  .tm-o.bad { border-left-color: #b4442a; }
  .tm-o .where { font-size: .74rem; color: var(--ink-mute); margin-bottom: .2rem; }
  .tm-o .s { font-size: .84rem; color: var(--ink-soft); line-height: 1.55; }
  .tm-o .t { font-size: .86rem; line-height: 1.7; margin-top: .15rem; }
  .tm-o mark { background: #f3e2b8; color: inherit; border-radius: .15rem; padding: 0 .1rem; }
  .tm-o .wrong { background: #f6d9d1; text-decoration: line-through; }
  .tm-o .act { margin-top: .3rem; display: flex; gap: .35rem; }
  .tm-o .act button { font: inherit; font-size: .76rem; padding: .18rem .55rem; border-radius: .35rem;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
  .tm-o .act button:hover { border-color: var(--accent-soft); color: var(--ink); }
  .tm-fixall { font: inherit; font-size: .8rem; padding: .3rem .8rem; border-radius: 999px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }

  /* 手机上没有并排的余地：列表压到上半屏，详情接在下面各滚各的。
     不做「点进去再返回」那套，是因为改译名这件事本来就要来回对照列表和实例。 */
  @media (max-width: 860px) {
    .tm-split { grid-template-columns: 1fr; grid-template-rows: minmax(6rem, 38vh) 1fr; }
    .tm-list { border-right: none; border-bottom: 1px solid var(--line); }
    .tm-detail { padding: .8rem .9rem 3rem; }
    .tm-f { grid-template-columns: 3.4rem 1fr; }
    .tm-note { margin-left: 0; }
    .tm-bar { gap: .35rem; padding: .5rem .6rem; }
    #tmSearch { order: 3; flex-basis: 100%; }
  }

  /* 抽签：一屏一件事，别做成仪表盘 */
  .rite-page { max-width: 42rem; margin: 0 auto; padding: 2.4rem 1.4rem 4rem; }
  .rite-card { border: 1px solid var(--line); border-radius: .7rem; padding: 1.3rem 1.4rem;
    margin-bottom: 1rem; background: var(--card); }
  .rite-card h3 { margin: 0 0 .3rem; font-size: 1.05rem; font-weight: 600; }
  .rite-card p { margin: 0 0 .9rem; color: var(--ink-soft); font-size: .92rem; }
  .rite-card.off { opacity: .6; }
  .rite-card .soon { font-size: .8rem; color: var(--ink-mute); }
  .rite-q { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem .7rem;
    border: 1px solid var(--line); border-radius: .4rem; background: var(--paper); color: var(--ink); }
  .rite-go { font: inherit; margin-top: .7rem; padding: .45rem 1.4rem; border-radius: 999px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .rite-go[disabled] { opacity: .5; cursor: default; }
  .rite-out { margin-top: 1.2rem; border-top: 1px solid var(--line); padding-top: 1.2rem; }
  .rite-dice { font-size: .85rem; color: var(--ink-soft); letter-spacing: .1em; }
  .rite-text { font-size: 1.2rem; line-height: 2; margin: .7rem 0; }
  .rite-ref { font-size: .85rem; color: var(--ink-mute); }
  .rite-ask { font: inherit; margin-top: 1rem; padding: .45rem 1.2rem; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .rite-ask:hover { background: var(--card); color: var(--ink); border-color: var(--accent-soft); }

  /* 门枢 —— 嵌站上那些纯观看的页面。
     列表沿用抽签那套卡片：同一格里的两件事，长得不该像两个软件。 */
  .sp-body { flex: 1; min-height: 0; overflow-y: auto; }
  /* 进去之后整块交给 iframe，四周不留边、外层也不滚：
     这些页面本来就是满屏动画，留一圈框会把它切成「网页里的一个小窗口」。
     position 是给下面那层 .sp-veil 定位用的。 */
  .sp-body.viewing { overflow: hidden; position: relative; }
  /* 底色跟着应用走，不用黑。原来是黑的——那时候门后只有虫洞那一页满屏黑底动画，
     配黑不闪。现在门后大半是米色的长页，黑底反而成了「一块黑屏」，
     页面还没画出来的那一两秒看着就是坏了：这条真被当成 bug 报上来过。 */
  .sp-frame { display: block; width: 100%; height: 100%; border: 0; background: var(--paper); }
  /* 还没画出来的时候盖在上面的一层。iframe 挂上去只是开始下载，
     整页画完还要一会儿，这中间它是一块空白，得有人说一句话。 */
  .sp-veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink-mute); font-size: .9rem; }
  .sp-bar { flex: none; display: flex; align-items: center; gap: .7rem;
    padding: .4rem .8rem; border-bottom: 1px solid var(--line);
    font-size: .88rem; color: var(--ink-soft); }
  /* 跟上面 .bench-pane[hidden] 同一个坑，这次是当场撞上的：
     hidden 的 display:none 来自浏览器默认样式表，上面那句 display:flex 压得过它，
     结果没进空间的时候列表上方也挂着一条「← 回列表」。截图才看得出来。 */
  .sp-bar[hidden] { display: none; }
  .sp-bar button { font: inherit; font-size: .84rem; padding: .25rem .75rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer;
    flex: none; }
  .sp-bar button:hover { border-color: var(--accent-soft); color: var(--ink); }
  /* 一句话的状态位。它占着那段 auto 边距，顺手把右边那两个按钮顶到最右。
     窄屏上这条会先被挤扁：所以让它自己截断，别去挤按钮——话少看一句无妨，
     按钮少一个就出不去了。按钮那条的 flex:none 是配套的，缺一不可。 */
  .sp-note { margin-left: auto; font-size: .82rem; color: var(--ink-mute);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 全屏送进去的是整格 #paneSpaces，工具条跟着一起进，所以要把它改成压在页面顶上的一条。
     平时半透明，指过去或者键盘聚焦才实——不能干脆藏掉：藏了就只剩 Esc 一条出路。
     用类名不用 :fullscreen 伪类：老 Safari 那边叫 :-webkit-full-screen，而选择器列表里
     混进一个浏览器不认识的伪类，整条规则会被当作无效丢掉，得写两份。类名一份就够。 */
  #paneSpaces.sp-full { position: relative; background: #000; }
  #paneSpaces.sp-full .sp-bar { position: absolute; z-index: 2; top: 0; left: 0; right: 0;
    background: var(--paper); opacity: .3; transition: opacity .18s; }
  #paneSpaces.sp-full .sp-bar:hover { opacity: 1; }
  /* :focus-visible 而不是 :focus-within：刚点完「全屏」，那个按钮还带着焦点，
     用 :focus-within 的话这条会一直亮着，鼠标挪开也不暗——等于没做淡化。
     用键盘 Tab 过来才算数。:has() 老浏览器不认，所以单开一条：
     选择器列表里混一个不认识的东西，整条规则连 :hover 一起作废。 */
  #paneSpaces.sp-full .sp-bar:has(:focus-visible) { opacity: 1; }
  .sp-tip { margin-top: .7rem; font-size: .86rem; color: var(--ink-mute); }
  /* 8-bit 神谕：八枚硬币排一行，一枚一枚落定。
     每枚翻 260ms，八枚不到三秒——仪式感要有，但别让人干等。 */
  .or-coins { display: flex; gap: .5rem; margin: .3rem 0 .5rem; }
  .or-coin { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--line);
    background: var(--paper); display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Consolas, monospace; font-size: .95rem; color: var(--ink-mute); }
  .or-coin.spin { animation: or-flip .16s linear infinite; }
  .or-coin.done { color: var(--accent); border-color: var(--accent-soft); }
  @keyframes or-flip { from { transform: rotateX(0deg); } to { transform: rotateX(360deg); } }
  .or-addr { font-family: ui-monospace, Consolas, monospace; letter-spacing: .22em;
    font-size: .92rem; color: var(--ink-soft); }
  .or-addr .src { letter-spacing: 0; margin-left: .6rem; font-size: .78rem; color: var(--ink-mute); }
  .or-zh { font-size: 1.25rem; line-height: 2; margin: .9rem 0 .25rem; }
  .or-greek { font-size: .95rem; line-height: 1.9; color: var(--ink-soft); }
  .or-ref { font-size: .82rem; color: var(--ink-mute); margin-top: .35rem; }
  .or-context { margin-top: .9rem; font-size: .9rem; line-height: 1.9; color: var(--ink-soft);
    border-left: 2px solid var(--line); padding-left: .8rem; }
  .or-read { margin-top: 1.1rem; border-top: 1px solid var(--line); padding-top: .9rem;
    font-size: .96rem; line-height: 2; white-space: pre-wrap; }
  .or-acts { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
  .or-hint { font-size: .86rem; color: var(--ink-mute); line-height: 1.8; margin-top: .6rem; }
  .or-old .item { border-top: 1px solid var(--line); padding: .55rem 0; font-size: .92rem; line-height: 1.8; }
  .or-old .item .a { font-family: ui-monospace, Consolas, monospace; font-size: .76rem;
    color: var(--ink-mute); letter-spacing: .12em; }
  .or-box { font-family: ui-monospace, Consolas, monospace; font-size: .78rem; line-height: 1.7;
    max-height: 11rem; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    background: var(--paper); border: 1px dashed var(--line); border-radius: 8px;
    padding: .6rem .7rem; margin-top: .7rem; }

  /* 设置：整页复用仪轨的 .rite-page/.rite-card/.rite-q/.rite-go，这里只补差的 */
  .set-state { font-size: .92rem; margin: 0 0 .7rem; color: var(--ink-soft); }
  .set-state b { color: var(--accent); font-weight: 600; }
  .set-state.err { color: #a3453a; }
  /* 没配 key 时压在对话页顶上的一条。不是弹窗：弹窗关了就没了，这条一直在，配好才消失 */
  .nokey { flex: none; display: flex; gap: .8rem; align-items: center; justify-content: center; flex-wrap: wrap;
    padding: .55rem 1rem; font-size: .88rem; color: #7a4a1e; background: #f6e8cf; border-bottom: 1px solid #e6cf9f; }
  .nokey button { font: inherit; padding: .2rem .8rem; border-radius: 999px; border: 1px solid #c9a870; background: #fff; color: #7a4a1e; cursor: pointer; }
  .set-box { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; word-break: break-all;
    background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; padding: .6rem .7rem; margin: .5em 0; }
  .set-row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* 又是 .bench-pane[hidden] 那个坑（这个文件里第三处了）：类选择器的
     display:flex 压得过 [hidden] 的 UA 规则，藏起来的那行照样显示。 */
  .set-row[hidden] { display: none; }
  .set-row .rite-q { flex: 1; min-width: 11rem; width: auto; }
  .set-row .rite-go { margin-top: 0; }
  .set-plain { font: inherit; padding: .42rem 1.1rem; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .set-plain:hover { background: var(--paper); color: var(--ink); border-color: var(--accent-soft); }
  .set-plain.danger { border-color: #c9a09a; color: #a3453a; }
  .set-note { font-size: .8rem; color: var(--ink-mute); line-height: 1.7; margin: .6rem 0 0; }
  .set-note.err { color: #a3453a; }
  .ts-prog { height: 9px; background: var(--line); border-radius: 999px; overflow: hidden; margin: .5rem 0; }
  .ts-prog i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  /* 在外面也能用：二维码、已配对的手机。二维码永远白底黑码——深色底上很多手机扫不出来 */
  .relay-pair { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; margin: .2rem 0 .4rem; }
  .relay-qr { width: 200px; height: 200px; flex-shrink: 0; background: #fff; border-radius: .5rem; padding: 6px;
              border: 1px solid var(--line); }
  .relay-qr svg { display: block; width: 100%; height: 100%; }
  .relay-pair .relay-how { flex: 1; min-width: 12rem; }
  .relay-pair .relay-how p { margin: 0 0 .5rem; }
  .relay-fp { font-family: ui-monospace, Consolas, monospace; letter-spacing: .06em; color: var(--ink-soft); }
  .rite-card .relay-h { font-size: .88rem; color: var(--ink-soft); margin: 1.1rem 0 .4rem; }
  .relay-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .relay-list li { display: flex; align-items: center; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
  .relay-list .who { flex: 1; min-width: 0; }
  .relay-list .who b { font-weight: 600; font-size: .93rem; }
  .relay-list .who small { display: block; font-size: .78rem; color: var(--ink-mute); margin-top: .15rem; }
  .relay-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-right: .35rem; vertical-align: middle; }
  .relay-dot.on { background: #5a9a5e; }
  .relay-ok { color: #4f8a52; }
  .relay-adv { margin-top: 1.2rem; }
  .relay-adv summary { cursor: pointer; font-size: .85rem; color: var(--ink-mute); }
  .relay-adv[open] summary { margin-bottom: .6rem; }
  .set-switch { display: flex; align-items: center; gap: .55rem; font-size: .93rem; cursor: pointer; color: var(--ink); }
  .set-switch input { accent-color: var(--accent); transform: scale(1.15); }

  /* 手机布局：读书视图单栏（侧栏聊天让位给「对话」视图） */
  /* 注意：这条要放在 media query 前面。同是 #menuBtn、同权重，写在后面的赢——
     原来它在后面，等于把手机里的 display:block 又盖回 none，☰ 一直点不动。 */
  #menuBtn { display: none; font-size: 1.2rem; padding: .2rem .4rem; }
  @media (max-width: 860px) {
    /* 盖层钉在 main 里而不是按顶栏高度写死 top：顶栏按钮加高到 44px 以后顶栏变高了，
       写死的 49px 会让书架顶端被顶栏压住一截 */
    main { position: relative; }
    #sidebar { position: absolute; inset: 0; width: 100%; z-index: 20; display: none; }
    body.view-read #sidebar.open { display: block; }
    #chat { display: none; }
    #reader .page { padding: 1.4rem 1.1rem 4rem; }
    #menuBtn { display: block; }
    header h1 { display: none; }
    /* 手机上顶栏连标签都放不下，印跟名字一起让位 */
    header .gx-seal--c.gx-hd { display: none; }
    /* 390 宽的手机上实测：四个标签加⚙加☰放不下，「工坊」被挤出屏外、「工作台」切掉一半。
       标签条自己可以横向滚（不显示滚动条），面包屑让位——它是说明，标签是出口。 */
    header { gap: .4rem; padding: .5rem .6rem; }
    header .crumb { flex: 1 1 auto; min-width: 0; }
    .tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { padding: .3rem .55rem; font-size: .82rem; flex: none; }
    /* 空态那两行提示原来一行到底，手机上从右边溢出去半句 */
    .empty { padding: 4rem 1.2rem; white-space: normal; word-break: break-word; }
    #chatBody .msg { max-width: 94%; }
    .col { padding: 0 .9rem; }
    /* 窄屏放不下并排两栏：会话列表变成盖上来的一层，点顶栏的☰开关 */
    #sessions { position: absolute; inset: 0; width: 100%; z-index: 20;
      display: none; background: var(--paper); }
    body.view-chat #sessions.open { display: flex; }
    body.view-chat #menuBtn { display: block; }
    /* 触屏没有 hover，删书签的叉常驻显示，否则手机上根本删不掉 */
    .mark-x { opacity: .6; }

    /* 手机上手指点的东西都不低于 44px（390 宽实测原来只有 29–34px，点「对话」常点到「工作台」） */
    #menuBtn, .tabs button { min-height: 44px; }
    /* 标签点得到的范围是 44px，看上去的胶囊还是原来那么扁：上下各垫 7px 透明边框，
       底色只铺到边框里面。直接撑高的话「读书」那颗胶囊会鼓成一个圆 */
    .tabs button { border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
    /* 选中那颗的底色是 background 简写给的，简写会把 clip 重置回 border-box，所以要单独再写一遍 */
    .tabs button, .tabs button.on { background-clip: padding-box; }
    .side-item, .editbar button, .editbar a.obs, .pager button { min-height: 44px; }
    .editbar a.obs { display: inline-flex; align-items: center; }
    .book-search input { min-height: 44px; font-size: 1rem; }
    .mark-x { width: 44px; height: 44px; }
    /* 正文里的长网址、宽表格、代码块原来把阅读区撑出一截，整页能左右晃。
       网址就地折行；表格和代码块自己横向滚，不连累正文 */
    #reader .page { overflow-wrap: anywhere; }
    #reader table { display: block; overflow-x: auto; }
    #reader pre { overflow-x: auto; }
  }

  /* 校对协作 */
  .sync-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .sync-dot.green { background: #7aa45e; } .sync-dot.yellow { background: #d6a545; }
  .sync-dot.gray { background: #b8b0a0; } .sync-dot.auth { background: #c25549; }
  .side-item .sug-meta { color: var(--ink-mute); font-size: .75rem; display: block; }
  .side-item.sug-done { opacity: .55; }

  /* ---- 划线 ---- */
  /* 颜色压得很淡：划线是压在正文底下的，不是盖在正文上面的。
     饱和一点的黄在长段落里读十分钟就开始晃眼。 */
  mark.hl { background: #FDF0B8; color: inherit; border-radius: 2px; padding: 0 1px; cursor: pointer; }
  mark.hl.green { background: #D9F0D3; }
  mark.hl.blue  { background: #D6E9F8; }
  mark.hl.pink  { background: #F8DDE6; }
  /* 带评论的多一条下边线 —— 光靠颜色分不出「划了一道」和「写了话」，
     而用户想找的往往是后者。 */
  mark.hl.has-note { border-bottom: 2px solid rgba(0,0,0,.28); }

  /* ---- 全书搜索 / 跳回原文 ---- */
  .book-search { margin: .1rem .2rem .4rem; }
  .book-search input {
    width: 100%; box-sizing: border-box; padding: .38rem .55rem; font-size: .88rem;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .search-hits { list-style: none; padding: 0; margin: 0; }
  .search-hits button {
    display: block; width: 100%; text-align: left; padding: .6rem .7rem; margin: 0 0 .35rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink-soft); line-height: 1.6;
  }
  .search-hits button:hover { border-color: var(--accent-soft); }
  .search-hits .hit-ch { display: block; font-size: .76rem; color: var(--ink-mute); margin-bottom: .15rem; }
  .search-hits mark { background: var(--hit-bg); color: inherit; border-radius: 2px; }
  .search-note { color: var(--ink-mute); font-size: .85rem; }
  /* 跳过来的那一段：底色慢慢退掉。一直亮着的话，读者往下读时它就成了噪音 */
  .passage-hit { background: var(--hit-bg); border-radius: 4px; box-shadow: 0 0 0 4px var(--hit-bg); transition: background 2.4s ease, box-shadow 2.4s ease; }
  .passage-hit.fade { background: transparent; box-shadow: 0 0 0 4px transparent; }
  .passage-zh {
    margin: .5rem 0 1rem; padding: .5rem .75rem; border-left: 3px solid var(--accent-soft);
    background: var(--paper); color: var(--ink-soft); font-size: .92rem;
  }
  .passage-zh small { display: block; color: var(--ink-mute); font-size: .75rem; margin-bottom: .2rem; }

  /* 侧边栏里那一列划线前面的小色块 */

          </div>
          <div class="col chat-hint" id="chatHint"></div>
        </div>
      </div>
    </section>

    <section id="bench">
      <nav class="bench-nav">
        <button data-pane="terms" class="on">术语表</button>
        <button data-pane="components">组件</button>
        <button data-pane="spaces">门枢</button>
      </nav>
      <div class="bench-pane" id="paneTerms">
        <div class="tm-bar">
          <select id="tmBook" title="哪本书的译名表"></select>

            <button data-f="draft">待定<b></b></button>

          <span class="tm-acts">

        </div>
        <div class="sp-body" id="spBody"></div>

    <section id="settings"><div class="rite-page" id="setBody"></div></section>
    <section id="workshop"><div class="wk-page" id="wkBody"></div></section>
